---
# UM unico playbook: cada role tem um "when" na variavel acao (survey do AAP, ou -e acao=...).
#   precheck              role precheck                       confere ambiente e plano de discos (somente leitura)   <- padrao
#   instalar              roles precheck + infra + instalacao discos, sistema, Elasticsearch, Kibana, Fleet
#   validar               role validacao                      confere o ambiente instalado (somente leitura)
#   adicao                roles manutencao + precheck + infra + instalacao   adiciona UM node (survey: node_ip, node_funcao)
#   remocao               role manutencao                     tira os shards e remove UM node (survey: node_ip, node_funcao)
#   renovar_certificados  roles manutencao + instalacao       reemite os certificados com a CA atual e reinicia UM por vez
# "componentes" (group_vars/all.yml) escolhe o que instalar/renovar; cluster NOVO exige -e es_bootstrap_allowed=true (so na 1a vez).
# O "hosts:" de cada play diz EM QUAIS servidores; o "when" de cada role diz QUANDO.

- name: "Conferir acao e componentes"
  hosts: elastic
  connection: local
  run_once: true
  gather_facts: false
  tasks:
    - ansible.builtin.assert:
        that:
          - acao in ['precheck', 'instalar', 'validar', 'adicao', 'remocao', 'renovar_certificados']
          - componentes | difference(['elasticsearch', 'kibana', 'fleet']) | length == 0
        fail_msg: "acao: precheck | instalar | validar | adicao | remocao | renovar_certificados. componentes: elasticsearch, kibana, fleet."
        quiet: true

    - name: Conferir os campos da survey (adicao/remocao)
      ansible.builtin.assert:
        that:
          - node_ip is match('^([0-9]{1,3}[.]){3}[0-9]{1,3}$')
          - node_funcao in node_grupos
          # masters e Kibana nunca entram ou saem por aqui
          - node_ip not in (groups['es_master'] + groups['kibana']) | map('extract', hostvars, 'ansible_host') | list
        fail_msg: "Survey: node_ip = IP da VM (nao pode ser master nem Kibana); node_funcao = {{ node_grupos.keys() | join(' | ') }}."
        quiet: true
      when: acao in ['adicao', 'remocao']

    - name: Registrar a VM da survey pelo IP (grupo temporario vm_survey, so nesta execucao)
      ansible.builtin.add_host:
        name: "{{ node_ip }}"
        groups: vm_survey
        ansible_host: "{{ node_ip }}"
        ansible_ssh_common_args: "{{ hostvars[groups['elastic'][0]].ansible_ssh_common_args }}"
      changed_when: false
      when: acao in ['adicao', 'remocao']

# ---- precheck e infra: os 21 servidores ---------------------------------------------------------
- name: "Precheck (precheck, instalar) e infra (instalar): todos os servidores"
  hosts: elastic
  gather_facts: "{{ acao in ['precheck', 'instalar'] }}"     # so conecta nos servidores quando o play vai rodar
  vars_files: [vault.yml]
  any_errors_fatal: true        # se UM servidor reprovar, nada e formatado nos outros
  roles:
    - role: precheck
      when: acao in ['precheck', 'instalar']
    - role: infra
      when: acao == 'instalar'

# ---- renovacao: guardar os certificados atuais (os plays de instalacao abaixo reemitem e distribuem) ----
- name: "Renovar certificados - backup dos atuais (a CA continua a mesma)"
  hosts: es_master[0]
  gather_facts: false
  vars_files: [vault.yml]
  roles:
    - role: manutencao
      fase: cert_backup
      when: acao == 'renovar_certificados'

# ---- Elasticsearch ------------------------------------------------------------------------------
- name: "Instalar Elasticsearch - decidir se o cluster e novo"
  hosts: es_master
  gather_facts: "{{ acao == 'instalar' }}"
  vars_files: [vault.yml]
  any_errors_fatal: true
  roles:
    - role: instalacao
      fase: es_decidir
      when: acao == 'instalar' and 'elasticsearch' in componentes

- name: "Instalar Elasticsearch - instalar e iniciar os nos, UM por vez (masters primeiro)"
  hosts: es_master:es_hot:es_cold:es_frozen:es_ml
  gather_facts: "{{ acao in ['instalar', 'renovar_certificados'] }}"
  vars_files: [vault.yml]
  serial: 1
  any_errors_fatal: true
  roles:
    - role: instalacao
      fase: es_nos
      when: acao in ['instalar', 'renovar_certificados'] and 'elasticsearch' in componentes

- name: "Instalar Elasticsearch - marca do cluster e senhas definitivas"
  hosts: elasticsearch
  gather_facts: "{{ acao == 'instalar' }}"
  vars_files: [vault.yml]
  any_errors_fatal: true
  roles:
    - role: instalacao
      fase: es_final
      when: acao == 'instalar' and 'elasticsearch' in componentes

# ---- Kibana: 3 servidores, um por vez -----------------------------------------------------------
- name: "Instalar Kibana"
  hosts: kibana
  gather_facts: "{{ acao in ['instalar', 'renovar_certificados'] }}"
  vars_files: [vault.yml]
  serial: 1
  any_errors_fatal: true
  roles:
    - role: instalacao
      fase: kibana
      when: acao in ['instalar', 'renovar_certificados'] and 'kibana' in componentes

# ---- Fleet --------------------------------------------------------------------------------------
- name: "Instalar Fleet - configurar o Kibana (uma vez)"
  hosts: kibana
  gather_facts: "{{ acao == 'instalar' }}"
  vars_files: [vault.yml]
  roles:
    - role: instalacao
      fase: fleet_kibana
      when: acao == 'instalar' and 'fleet' in componentes

- name: "Instalar Fleet - Fleet Server nos servidores integration, UM por vez"
  hosts: integration
  gather_facts: "{{ acao in ['instalar', 'renovar_certificados'] }}"
  vars_files: [vault.yml]
  serial: 1
  any_errors_fatal: true
  roles:
    - role: instalacao
      fase: fleet_servers
      when: acao in ['instalar', 'renovar_certificados'] and 'fleet' in componentes

# ---- validacao (somente leitura) ----------------------------------------------------------------
- name: "Validar o ambiente instalado"
  hosts: elastic
  gather_facts: "{{ acao == 'validar' }}"
  vars_files: [vault.yml]
  roles:
    - role: validacao
      when: acao == 'validar'

- name: "Validade dos certificados instalados (validar, renovar_certificados)"
  hosts: elastic
  gather_facts: false
  vars_files: [vault.yml]
  roles:
    - role: manutencao
      fase: cert_validade
      when: acao in ['validar', 'renovar_certificados']

# ---- adicao de UM node (survey: acao=adicao, node_ip, node_funcao) --------------------------------
# Os grupos vm_survey e vm_novo so existem nesta acao (nas outras, estes plays nao tem servidor e sao pulados).
- name: "Adicao de node - ler os recursos da VM (gather_facts) e definir nome, grupo e heap"
  hosts: vm_survey
  gather_facts: "{{ acao == 'adicao' }}"
  roles:
    - role: manutencao
      fase: no_identificar
      when: acao == 'adicao'

- name: "Adicao de node - precheck, disco de dados, sistema e certificados"
  hosts: vm_novo
  gather_facts: true
  vars_files: [vault.yml]
  roles:
    - role: precheck
      storage_volumes: []       # o disco do node novo e tratado na fase no_disco (qualquer disco vazio)
    - role: manutencao
      fase: no_disco
    - role: infra
      storage_volumes: []
    - role: manutencao
      fase: no_certificado

- name: "Adicao de node - instalar e esperar entrar no cluster (green) ou no Fleet (HEALTHY)"
  hosts: vm_novo
  gather_facts: false
  vars_files: [vault.yml]
  roles:
    - role: instalacao
      fase: es_nos
      when: node_funcao != 'Integration'
    - role: instalacao
      fase: fleet_servers
      when: node_funcao == 'Integration'

# ---- remocao de UM node (survey: acao=remocao, node_ip, node_funcao) ------------------------------
- name: "Remocao de node - tirar os shards, parar o servico e lembrar do F5"
  hosts: es_master[0]
  gather_facts: false
  vars_files: [vault.yml]
  roles:
    - role: manutencao
      fase: no_remover
      when: acao == 'remocao'

# ---- adicao/remocao de Hot: Kibana e output do Fleet passam a usar a lista nova de Hot (es_hot_ips) ----
- name: "Adicao/remocao de Hot - Kibana com a lista nova de Hot, UM por vez"
  hosts: kibana
  gather_facts: false
  vars_files: [vault.yml]
  serial: 1
  any_errors_fatal: true
  roles:
    - role: instalacao
      fase: kibana
      when: acao in ['adicao', 'remocao'] and node_funcao == 'Hot'

- name: "Adicao/remocao de Hot - output padrao do Fleet com a lista nova de Hot"
  hosts: kibana
  gather_facts: false
  vars_files: [vault.yml]
  roles:
    - role: instalacao
      fase: fleet_kibana
      when: acao in ['adicao', 'remocao'] and node_funcao == 'Hot'

- name: "Adicao de node - lembrete do F5 e do inventory.yml"
  hosts: vm_novo
  gather_facts: false
  roles:
    - role: manutencao
      fase: no_lembrete


- name: "Resumo de acesso"
  hosts: es_master[0]
  gather_facts: false
  tasks:
    - name: Mostrar URLs e usuário
      ansible.builtin.debug:
        msg:
          - "Elasticsearch: https://{{ es_public_name }}:9200 (F5) ou https://{{ ansible_host }}:9200 (direto)"
          - "Kibana: https://{{ kibana_public_name }} (F5) ou https://{{ hostvars[groups['kibana'][0]].ansible_host }}:5601 (direto)"
          - "Fleet: https://{{ fleet_public_name if fleet_public_name | length > 0 else hostvars[groups['integration'][0]].ansible_host }}:{{ fleet_port }}"
          - "Usuário: elastic. A senha é a es_elastic_password do vault (não é exibida no log)."
      when: acao in ['instalar', 'validar']