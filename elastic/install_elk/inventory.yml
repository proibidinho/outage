---
# =============================================================================
#  INVENTARIO: SOMENTE servidores e grupos.
#  As variaveis do ambiente estao em group_vars/ (all.yml, es_master.yml, es_hot.yml, ...).
#  Para mudar tamanho de disco, heap, papeis do no, bastion, acao, etc., edite la.
# =============================================================================
all:
  children:
    # O bastion nao faz parte do cluster: so e usado como salto e (acao=usuario) para entrar como root.
    bastion:
      hosts:
        bastion:
          ansible_host: "{{ bastion_host }}"
          ansible_user: "{{ bastion_user }}"
          ansible_ssh_common_args: ""        # o bastion e acessado direto, sem passar por ele mesmo

    elastic:
      children:

        elasticsearch:
          children:

            # ---- 3 masters dedicados (quorum tolera 1 falha) ----
            es_master:
              hosts:
                cbl2am53296.corp.clarobr: {ansible_host: 10.29.88.223}
                cbl2am52901.corp.clarobr: {ansible_host: 10.29.88.224}
                cbl2am94434.corp.clarobr: {ansible_host: 10.29.88.226}

            # ---- 8 nos hot: recebem escrita; data_content e obrigatorio (indices de sistema) ----
            es_hot:
              hosts:
                cbl2am59521.claro.com.br: {ansible_host: 10.29.88.188}
                cbl2am82385.claro.com.br: {ansible_host: 10.29.88.189}
                cbl2am33867.claro.com.br: {ansible_host: 10.29.88.190}
                cbl2am05740.claro.com.br: {ansible_host: 10.29.88.202}
                cbl2am04384.claro.com.br: {ansible_host: 10.29.88.203}
                cbl2am22244.claro.com.br: {ansible_host: 10.29.88.204}
                cbl2am62244.claro.com.br: {ansible_host: 10.29.88.205}
                cbl2am46040.claro.com.br: {ansible_host: 10.29.88.206}

            es_cold:
              hosts:
                cbl2am24120.claro.com.br: {ansible_host: 10.29.88.212}
                cbl2am78817.claro.com.br: {ansible_host: 10.29.88.213}

            es_frozen:                               # no unico = sem redundancia
              hosts:
                cbl2am91456.claro.com.br: {ansible_host: 10.29.88.211}

            es_ml:
