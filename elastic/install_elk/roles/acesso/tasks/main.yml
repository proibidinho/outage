---
# =============================================================================
#  ROLE acesso  —  chave para entrar nos servidores atravessando o bastion
#
#  O SSH do exec node ate os servidores passa pelo bastion, mas quem se autentica no servidor e a chave que o
#  JOB tem. Como so o bastion tem chave trocada com os servidores, aqui o job copia essa chave do bastion.
#    fase: buscar   (antes de tudo)  copia a chave (chave_bastion_vms) para o job, com permissao 0600
#    fase: limpar   (no fim)         apaga a copia
#  O site.yml so chama este role quando chave_bastion_vms nao esta vazia.
# =============================================================================
- name: Copiar a chave do bastion para o job e usar nas conexoes
  when: fase == 'buscar'
  block:
    - name: Buscar a chave no bastion
      ansible.builtin.fetch:
        src: "{{ chave_bastion_vms }}"
        dest: "{{ chave_vms_local }}"
        flat: true
      delegate_to: bastion
      run_once: true
      no_log: true

    - name: Restringir a permissão da cópia (o ssh exige 0600)
      ansible.builtin.file:
        path: "{{ chave_vms_local }}"
        mode: "0600"
      delegate_to: localhost
      run_once: true

    - name: Usar essa chave para entrar nos servidores
      ansible.builtin.set_fact:
        ansible_ssh_private_key_file: "{{ chave_vms_local }}"

- name: Apagar a cópia temporária da chave
  ansible.builtin.file:
    path: "{{ chave_vms_local }}"
    state: absent
  delegate_to: localhost
  run_once: true
  when: fase == 'limpar'
