---
# ROLE validacao: SOMENTE LEITURA. Confere se o ambiente ficou como o inventory.yml e o group_vars descrevem (um assert por item).

# ---------------------------------------------------------------- todos: discos
- name: Volumes do inventário estão montados em XFS
  when: storage_volumes is defined
  block:
    - name: Ler o tipo de filesystem de cada ponto de montagem
      ansible.builtin.command: "findmnt -n -o FSTYPE {{ item.mount }}"
      loop: "{{ storage_volumes }}"
      loop_control:
        label: "{{ item.mount }}"
      register: fs
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Conferir (xfs e presente no /etc/fstab)
      ansible.builtin.assert:
        that: item.stdout == 'xfs'
        fail_msg: "{{ item.item.mount }} nao esta montado como xfs em {{ inventory_hostname }}"
        quiet: true
      loop: "{{ fs.results }}"
      loop_control:
        label: "{{ item.item.mount }}"

# ---------------------------------------------------------------- Elasticsearch: cluster (uma vez)
- name: Estado do cluster Elasticsearch
  delegate_to: "{{ es_api_host }}"
  run_once: true
  module_defaults:
    ansible.builtin.uri:
      url_username: elastic
      url_password: "{{ es_elastic_password }}"
      force_basic_auth: true
      ca_path: "{{ es_tls_dir }}/http_ca.crt"
      return_content: true
  block:
    - name: Saúde do cluster
      ansible.builtin.uri:
        url: "{{ es_api_url }}/_cluster/health"
      register: saude
      changed_when: false

    - name: Nós e papéis
      ansible.builtin.uri:
        url: "{{ es_api_url }}/_cat/nodes?h=name,node.role&format=json"
      register: nos
      changed_when: false

    - name: Licença
      ansible.builtin.uri:
        url: "{{ es_api_url }}/_license"
      register: licenca
      changed_when: false

    - name: Mostrar o resumo do cluster
      ansible.builtin.debug:
        msg:
          cluster: "{{ saude.json.cluster_name }}"
          status: "{{ saude.json.status }}"
          nos_esperados: "{{ groups['elasticsearch'] | length }}"
          nos_no_cluster: "{{ saude.json.number_of_nodes }}"
          licenca: "{{ licenca.json.license.type }} ({{ licenca.json.license.status }})"

    - name: Conferir o cluster
      ansible.builtin.assert:
        that:
          - saude.json.cluster_name == es_cluster_name
          - saude.json.status == 'green'
          - saude.json.number_of_nodes | int == groups['elasticsearch'] | length
          # cada servidor do inventario aparece no cluster com o nome curto
          - groups['elasticsearch'] | map('regex_replace', '[.].*$', '') | difference(nos.json | map(attribute='name') | list) | length == 0
        fail_msg: "Cluster divergente do inventario (status/nos). Veja o resumo acima."
        quiet: true

# ---------------------------------------------------------------- Elasticsearch: em cada no
- name: Serviço Elasticsearch ativo e habilitado
  when: inventory_hostname in groups['elasticsearch']
  block:
    - name: Ler o estado do serviço
      ansible.builtin.command: "systemctl is-active elasticsearch"
      register: es_ativo
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Ler se está habilitado no boot
      ansible.builtin.command: "systemctl is-enabled elasticsearch"
      register: es_habilitado
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Conferir
      ansible.builtin.assert:
        that:
          - es_ativo.stdout == 'active'
          - es_habilitado.stdout == 'enabled'
        fail_msg: "elasticsearch em {{ inventory_hostname }}: ativo={{ es_ativo.stdout }} habilitado={{ es_habilitado.stdout }}"
        quiet: true

# ---------------------------------------------------------------- Kibana
- name: Kibana disponível (cada servidor)
  when: inventory_hostname in groups['kibana']
  ansible.builtin.uri:
    url: "https://{{ ansible_host }}:5601/api/status"
    url_username: elastic
    url_password: "{{ es_elastic_password }}"
    force_basic_auth: true
    ca_path: /etc/kibana/tls/http_ca.crt
    return_content: true
  register: kb
  failed_when: kb.json.status.overall.level != 'available'
  changed_when: false

# ---------------------------------------------------------------- Fleet
- name: Fleet Server saudável (cada servidor integration)
  when: inventory_hostname in groups['integration']
  ansible.builtin.uri:
    url: "https://{{ ansible_host }}:{{ fleet_port }}/api/status"
    ca_path: /etc/fleet-server-tls/http_ca.crt
    return_content: true
  register: fleet
  failed_when: fleet.json.status != 'HEALTHY'
  changed_when: false

# ---------------------------------------------------------------- Fleet visto pelo Kibana (uma vez)
- name: Fleet Servers vistos pelo Kibana
  delegate_to: "{{ groups['kibana'][0] }}"
  run_once: true
  block:
    - name: Listar os agentes registrados no Fleet
      ansible.builtin.uri:
        url: "https://{{ hostvars[groups['kibana'][0]].ansible_host }}:5601/api/fleet/agents?perPage=100"
        url_username: elastic
        url_password: "{{ es_elastic_password }}"
        force_basic_auth: true
        ca_path: /etc/kibana/tls/http_ca.crt
        return_content: true
        headers:
          kbn-xsrf: "true"
      register: agentes
      changed_when: false

    - name: Conferir que os Fleet Servers estão online na política
      vars:
        lista: "{{ agentes.json['items'] | default(agentes.json['list'] | default([])) }}"
        online: "{{ lista | selectattr('policy_id', 'eq', 'fleet-server-policy') | selectattr('status', 'eq', 'online') | list }}"
      ansible.builtin.assert:
        that: online | length == groups['integration'] | length
        fail_msg: "Fleet Servers online no Kibana: {{ online | length }} de {{ groups['integration'] | length }}."
        quiet: true
