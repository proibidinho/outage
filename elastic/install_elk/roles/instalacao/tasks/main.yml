---
# ROLE instalacao: um arquivo dividido em FASES (variavel "fase", passada pelo site.yml; cada fase tem "when: fase == ...").
# Fases: es_decidir, es_nos, es_final, kibana, fleet_kibana, fleet_servers.
# Configuracao alterada -> notify "reiniciar servico" -> o handler so reinicia se algo mudou.

# ---- FASE es_decidir: o cluster e novo? (nos 3 masters) ----
# 0 masters com a marca /etc/elasticsearch/.cluster_uuid = NOVO (exige es_bootstrap_allowed=true); 3 = ja existe; 1 ou 2 = para.
- name: FASE es_decidir
  when: fase == 'es_decidir'
  block:
    - name: Ver se este master tem a marca de "cluster formado"
      ansible.builtin.stat:
        path: "{{ es_marker }}"
      register: marca

    - name: Contar quantos masters tem a marca
      ansible.builtin.set_fact:
        masters_com_marca: "{{ groups['es_master'] | map('extract', hostvars, ['marca', 'stat', 'exists']) | select | list | length }}"

    - name: Parar se a marca estiver em apenas alguns masters
      ansible.builtin.assert:
        that: masters_com_marca | int in [0, groups['es_master'] | length]
        fail_msg: "{{ masters_com_marca }} de {{ groups['es_master'] | length }} masters tem a marca {{ es_marker }}. Estado inconsistente: verifique manualmente."
        quiet: true

    - name: Parar se o cluster e novo e o bootstrap nao foi autorizado
      ansible.builtin.assert:
        that: masters_com_marca | int > 0 or es_bootstrap_allowed | bool
        fail_msg: "Cluster NOVO detectado. Para forma-lo rode com:  -e es_bootstrap_allowed=true  (somente na primeira vez)."
        quiet: true

    - name: Guardar a decisao
      ansible.builtin.set_fact:
        cluster_novo: "{{ masters_com_marca | int == 0 }}"

# ---- PACOTE (es_nos, kibana): RPM fixado, repo desabilitado, versionlock; nunca faz upgrade/downgrade nem inicia o servico ----
- name: PACOTE (Elasticsearch ou Kibana)
  when: fase in ['es_nos', 'kibana']
  vars:
    pacote: "{{ 'elasticsearch' if inventory_hostname in groups['elasticsearch'] else 'kibana' }}"
    proxy_env: "{{ {'https_proxy': elastic_repo_proxy} if elastic_repo_proxy | length > 0 else {} }}"
  block:
    - name: Importar a chave GPG oficial da Elastic (fingerprint conferido)
      ansible.builtin.rpm_key:
        key: https://artifacts.elastic.co/GPG-KEY-elasticsearch
        fingerprint: "46095ACC8548582C1A2699A9D27D666CD88E42B4"
        state: present
      environment: "{{ proxy_env }}"

    - name: Configurar o repositório da Elastic (desabilitado por padrão)
      ansible.builtin.yum_repository:
        name: elasticsearch
        description: "Elastic repository for {{ elastic_version.split('.')[0] }}.x packages"
        baseurl: "https://artifacts.elastic.co/packages/{{ elastic_version.split('.')[0] }}.x/yum"
        gpgcheck: true
        gpgkey: https://artifacts.elastic.co/GPG-KEY-elasticsearch
        enabled: false
        proxy: "{{ elastic_repo_proxy if elastic_repo_proxy | length > 0 else omit }}"

    - name: Ler pacotes já instalados
      ansible.builtin.package_facts:
        manager: rpm

    - name: Parar se já houver OUTRA versão instalada (o projeto não faz upgrade/downgrade)
      ansible.builtin.assert:
        that: (ansible_facts.packages[pacote] | map(attribute='version') | list) == [elastic_version]
        fail_msg: "{{ pacote }} ja instalado em outra versao que nao {{ elastic_version }}. Trate como mudanca planejada."
        quiet: true
      when: pacote in ansible_facts.packages

    - name: "Instalar o pacote na versão fixada"
      ansible.builtin.dnf:
        name: "{{ pacote }}-{{ elastic_version }}"
        enablerepo: elasticsearch
        state: present
        disable_gpg_check: false
      environment: "{{ proxy_env }}"
      no_log: true        # o instalador do RPM imprime uma senha automatica (descartada por este projeto)

    - name: Travar a versão (dnf versionlock)
      ansible.builtin.shell: |
        if dnf -q versionlock list 2>/dev/null | grep -q "^{{ pacote }}-.*{{ elastic_version }}"; then
          echo JA_EXISTIA
        else
          dnf -q versionlock add {{ pacote }}-{{ elastic_version }} && echo ADICIONADO
        fi
      args:
        executable: /bin/bash
      register: trava
      changed_when: "'ADICIONADO' in trava.stdout"

# ---- CERTIFICADOS (es_nos, kibana, fleet_servers) ----
# Parte 1 (1o master): cria as 2 CAs internas (transport e http) e emite todos os certificados (SAN = nome, nome curto, IP).
# Parte 2 (cada servidor): copia so os arquivos dele. Os certificados da empresa ficam so no F5.
- name: CERTIFICADOS - PARTE 1 (emitir; so no servidor da CA, uma vez)
  when: fase in ['es_nos', 'kibana', 'fleet_servers']
  delegate_to: "{{ ca_host }}"
  run_once: true
  vars:
    certutil: "{{ es_bin }}/elasticsearch-certutil"
    # grupos de servidores que recebem certificado, e nomes extras (VIPs do F5) no SAN
    conjuntos:
      - {nome: es,     grupo: elasticsearch, dns_extra: ["{{ es_public_name }}"]}
      - {nome: kibana, grupo: kibana,        dns_extra: ["{{ kibana_public_name }}"]}
      - {nome: fleet,  grupo: integration,   dns_extra: "{{ [fleet_public_name] if fleet_public_name | length > 0 else [] }}"}
    # o que emitir: nome do pacote, grupo de servidores, qual CA assina, formato (pem = crt+key, senao .p12)
    emissoes:
      - {nome: es_transport, conjunto: es,     ca: transport, pem: false}
      - {nome: es_http,      conjunto: es,     ca: http,      pem: false}
      - {nome: kibana_http,  conjunto: kibana, ca: http,      pem: false}
      - {nome: fleet_http,   conjunto: fleet,  ca: http,      pem: true}
  block:
    - name: Pasta das CAs (somente root)
      ansible.builtin.file:
        path: "{{ ca_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Criar as duas CAs (validade 10 anos; chave protegida pela senha do vault)
      ansible.builtin.command:
        argv:
          - "{{ certutil }}"
          - ca
          - --silent
          - --pem
          - --days
          - "3650"
          - --pass
          - "{{ tls_ca_password }}"
          - --out
          - "{{ ca_dir }}/ca_{{ item }}.zip"
        creates: "{{ ca_dir }}/ca_{{ item }}.zip"
      loop: [transport, http]
      no_log: true

    - name: "Extrair as CAs (arquivos ca_http/ca/ca.crt e ca_http/ca/ca.key)"
      ansible.builtin.command:
        cmd: "unzip -oq {{ ca_dir }}/ca_{{ item }}.zip -d {{ ca_dir }}/ca_{{ item }}"
        creates: "{{ ca_dir }}/ca_{{ item }}/ca/ca.crt"
      loop: [transport, http]

    - name: Listar os servidores de cada grupo (instances.yml do certutil)
      ansible.builtin.copy:
        dest: "{{ ca_dir }}/instancias_{{ item.nome }}.yml"
        owner: root
        group: root
        mode: "0600"
        content: |
          instances:
          {% for h in groups[item.grupo] %}
            - name: "{{ h.split('.')[0] }}"
              dns: {{ ([h, h.split('.')[0], 'localhost'] + item.dns_extra) | to_json }}
              ip: {{ [hostvars[h].ansible_host, '127.0.0.1'] | to_json }}
          {% endfor %}
      loop: "{{ conjuntos }}"
      loop_control:
        label: "{{ item.nome }}"

    - name: Emitir os certificados (validade 3 anos)
      vars:
        base:
          - "{{ certutil }}"
          - cert
          - --silent
          - --days
          - "1095"
          - --ca-cert
          - "{{ ca_dir }}/ca_{{ item.ca }}/ca/ca.crt"
          - --ca-key
          - "{{ ca_dir }}/ca_{{ item.ca }}/ca/ca.key"
          - --ca-pass
          - "{{ tls_ca_password }}"
          - --in
          - "{{ ca_dir }}/instancias_{{ item.conjunto }}.yml"
          - --out
          - "{{ ca_dir }}/{{ item.nome }}.zip"
        # .p12 leva a senha tls_p12_password; PEM (Fleet Server) sai sem senha na chave
        formato: "{{ ['--pem'] if item.pem else ['--pass', tls_p12_password] }}"
      ansible.builtin.command:
        argv: "{{ base + formato }}"
        creates: "{{ ca_dir }}/{{ item.nome }}.zip"
      loop: "{{ emissoes }}"
      loop_control:
        label: "{{ item.nome }}"
      no_log: true

    - name: "Extrair os certificados (arquivos emitidos/<pacote>/<servidor>/<servidor>.p12|.crt|.key)"
      ansible.builtin.command:
        cmd: "unzip -oq {{ ca_dir }}/{{ item.nome }}.zip -d {{ ca_dir }}/emitidos/{{ item.nome }}"
        creates: "{{ ca_dir }}/emitidos/{{ item.nome }}"
      loop: "{{ emissoes }}"
      loop_control:
        label: "{{ item.nome }}"

- name: CERTIFICADOS - PARTE 2 (copiar os arquivos deste servidor)
  when: fase in ['es_nos', 'kibana', 'fleet_servers']
  vars:
    c: "{{ inventory_hostname.split('.')[0] }}"
    cert_dir: "{{ es_tls_dir if inventory_hostname in groups['elasticsearch'] else ('/etc/kibana/tls' if inventory_hostname in groups['kibana'] else '/etc/fleet-server-tls') }}"
    cert_grupo: "{{ 'elasticsearch' if inventory_hostname in groups['elasticsearch'] else ('kibana' if inventory_hostname in groups['kibana'] else 'root') }}"
    # cada item: [origem dentro de /root/elastic-ca, nome do arquivo no servidor, permissao]
    cert_arquivos: >-
      {{ ([['emitidos/es_transport/' ~ c ~ '/' ~ c ~ '.p12', 'transport.p12', '0640'],
           ['emitidos/es_http/' ~ c ~ '/' ~ c ~ '.p12', 'http.p12', '0640'],
           ['ca_http/ca/ca.crt', 'http_ca.crt', '0644']]
          if inventory_hostname in groups['elasticsearch'] else
          ([['emitidos/kibana_http/' ~ c ~ '/' ~ c ~ '.p12', 'kibana.p12', '0640'],
            ['ca_http/ca/ca.crt', 'http_ca.crt', '0644']]
           if inventory_hostname in groups['kibana'] else
           [['emitidos/fleet_http/' ~ c ~ '/' ~ c ~ '.crt', 'fleet.crt', '0644'],
            ['emitidos/fleet_http/' ~ c ~ '/' ~ c ~ '.key', 'fleet.key', '0600'],
            ['ca_http/ca/ca.crt', 'http_ca.crt', '0644']])) }}
  block:
    - name: Pasta de certificados do servidor
      ansible.builtin.file:
        path: "{{ cert_dir }}"
        state: directory
        owner: root
        group: "{{ cert_grupo }}"
        mode: "0750"

    - name: Buscar os arquivos no servidor da CA (passam por uma pasta temporaria do controlador)
      ansible.builtin.fetch:
        src: "{{ ca_dir }}/{{ item[0] }}"
        dest: "{{ cert_staging }}/{{ inventory_hostname }}/{{ item[1] }}"
        flat: true
      delegate_to: "{{ ca_host }}"
      loop: "{{ cert_arquivos }}"
      loop_control:
        label: "{{ item[1] }}"
      no_log: true

    - name: Instalar os arquivos no servidor (certificado novo = reiniciar o servico)
      ansible.builtin.copy:
        src: "{{ cert_staging }}/{{ inventory_hostname }}/{{ item[1] }}"
        dest: "{{ cert_dir }}/{{ item[1] }}"
        owner: root
        group: "{{ cert_grupo }}"
        mode: "{{ item[2] }}"
      loop: "{{ cert_arquivos }}"
      loop_control:
        label: "{{ item[1] }}"
      notify: reiniciar servico
      no_log: true

    - name: Apagar a pasta temporaria do controlador (contem chaves privadas)
      ansible.builtin.file:
        path: "{{ cert_staging }}/{{ inventory_hostname }}"
        state: absent
      delegate_to: localhost
      become: false

# ---- FASE es_nos: configura e inicia UM no (serial: 1) e espera ele entrar no cluster green ----
# Masters de cluster NOVO nao esperam (o cluster so forma com os 3 no ar).
- name: FASE es_nos
  when: fase == 'es_nos'
  block:
    - name: Pastas de dados e de logs (donas do usuario elasticsearch)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: elasticsearch
        group: elasticsearch
        mode: "0750"
      loop: [/var/lib/elasticsearch, /var/log/elasticsearch]

    - name: Heap do JVM (Xms = Xmx, definido por grupo em group_vars/)
      ansible.builtin.copy:
        dest: /etc/elasticsearch/jvm.options.d/heap.options
        content: |
          -Xms{{ es_heap_size }}
          -Xmx{{ es_heap_size }}
        owner: root
        group: elasticsearch
        mode: "0640"
      notify: reiniciar servico

    - name: elasticsearch.yml
      # "cluster.initial_master_nodes" so aparece nos masters, na formacao de um cluster NOVO
      vars:
        es_render_initial_masters: "{{ inventory_hostname in groups['es_master'] and cluster_novo | default(false) | bool }}"
      ansible.builtin.template:
        src: elasticsearch.yml.j2
        dest: /etc/elasticsearch/elasticsearch.yml
        owner: root
        group: elasticsearch
        mode: "0660"
      notify: reiniciar servico

    - name: Gravar as senhas no keystore (somente se mudaram)
      # senhas dos .p12 e bootstrap.password vao para o keystore; .keystore_stamp (hash) evita reiniciar a toa
      ansible.builtin.shell: |
        set -eu
        KS={{ es_bin }}/elasticsearch-keystore
        STAMP={{ (tls_p12_password ~ es_elastic_password) | hash('sha256') }}
        [ -f /etc/elasticsearch/elasticsearch.keystore ] || "$KS" create
        if [ "$(cat /etc/elasticsearch/.keystore_stamp 2>/dev/null || true)" = "$STAMP" ]; then echo SEM_MUDANCA; exit 0; fi
        add() { printf %s "$2" | "$KS" add --stdin --force "$1"; }
        add xpack.security.transport.ssl.keystore.secure_password "$P12"
        add xpack.security.transport.ssl.truststore.secure_password "$P12"
        add xpack.security.http.ssl.keystore.secure_password "$P12"
        [ -f /etc/elasticsearch/.security_ok ] || add bootstrap.password "$ELASTIC"
        chgrp elasticsearch /etc/elasticsearch/elasticsearch.keystore
        chmod 660 /etc/elasticsearch/elasticsearch.keystore
        echo "$STAMP" > /etc/elasticsearch/.keystore_stamp
        echo ALTERADO
      args:
        executable: /bin/bash
      environment:
        P12: "{{ tls_p12_password }}"
        ELASTIC: "{{ es_elastic_password }}"
      register: keystore
      changed_when: "'ALTERADO' in keystore.stdout"
      notify: reiniciar servico
      no_log: true

    - name: Aplicar agora os reinícios pendentes (só reinicia se algo mudou)
      ansible.builtin.meta: flush_handlers

    - name: Garantir o serviço no ar e habilitado no boot
      ansible.builtin.systemd_service:
        name: elasticsearch
        state: started
        enabled: true

    - name: Esperar este nó entrar no cluster e o cluster ficar green
      when: not (cluster_novo | default(false) | bool and inventory_hostname in groups['es_master'])
      delegate_to: "{{ es_api_host }}"
      module_defaults:
        ansible.builtin.uri:
          url_username: elastic
          url_password: "{{ es_elastic_password }}"
          force_basic_auth: true
          ca_path: "{{ es_tls_dir }}/http_ca.crt"
          return_content: true
          status_code: [-1, 200, 401, 503]
      block:
        - name: Nó aparece na lista de nós do cluster
          ansible.builtin.uri:
            url: "{{ es_api_url }}/_cat/nodes?h=name&format=json"
          register: nos
          until: nos.status == 200 and (inventory_hostname.split('.')[0] in (nos.json | map(attribute='name') | list))
          retries: 30
          delay: 10
          changed_when: false

        - name: Cluster green (todos os shards alocados)
          ansible.builtin.uri:
            url: "{{ es_api_url }}/_cluster/health"
          register: saude
          until: saude.status == 200 and saude.json.status == 'green'
          retries: 60
          delay: 10
          changed_when: false

# ---- FASE es_final: depois que todos os nos entraram (nos 16) ----
# Cluster novo: grava a marca .cluster_uuid e tira initial_master_nodes. Define as senhas definitivas e remove bootstrap.password.
- name: FASE es_final
  when: fase == 'es_final'
  module_defaults:
    ansible.builtin.uri:
      url_username: elastic
      url_password: "{{ es_elastic_password }}"
      force_basic_auth: true
      ca_path: "{{ es_tls_dir }}/http_ca.crt"
      return_content: true
  block:
    - name: Ler o identificador (uuid) do cluster recém-formado
      when: cluster_novo | default(false) | bool
      delegate_to: "{{ es_api_host }}"
      run_once: true
      ansible.builtin.uri:
        url: "{{ es_api_url }}/"
      register: raiz
      changed_when: false

    - name: Gravar a marca "cluster formado" em cada master
      ansible.builtin.copy:
        dest: "{{ es_marker }}"
        content: "{{ raiz.json.cluster_uuid }}\n"
        owner: root
        group: elasticsearch
        mode: "0640"
      when: inventory_hostname in groups['es_master'] and cluster_novo | default(false) | bool

    - name: Regravar o elasticsearch.yml sem cluster.initial_master_nodes
      vars:
        es_render_initial_masters: false
      ansible.builtin.template:
        src: elasticsearch.yml.j2
        dest: /etc/elasticsearch/elasticsearch.yml
        owner: root
        group: elasticsearch
        mode: "0660"
      when: inventory_hostname in groups['es_master'] and cluster_novo | default(false) | bool

    - name: Senha definitiva do usuário elastic
      delegate_to: "{{ es_api_host }}"
      run_once: true
      ansible.builtin.uri:
        url: "{{ es_api_url }}/_security/user/elastic/_password"
        method: POST
        body_format: json
        body:
          password: "{{ es_elastic_password }}"
        status_code: 200
      no_log: true

    - name: Senha do usuário kibana_system (usado pelo Kibana)
      delegate_to: "{{ es_api_host }}"
      run_once: true
      ansible.builtin.uri:
        url: "{{ es_api_url }}/_security/user/kibana_system/_password"
        method: POST
        body_format: json
        body:
          password: "{{ es_kibana_system_password }}"
        status_code: 200
      no_log: true

    - name: Remover bootstrap.password do keystore deste nó
      ansible.builtin.shell: |
        set -eu
        KS={{ es_bin }}/elasticsearch-keystore
        if "$KS" list | grep -qx bootstrap.password; then
          "$KS" remove bootstrap.password
          chgrp elasticsearch /etc/elasticsearch/elasticsearch.keystore
          chmod 660 /etc/elasticsearch/elasticsearch.keystore
          echo REMOVIDO
        fi
        touch /etc/elasticsearch/.security_ok
      args:
        executable: /bin/bash
        creates: /etc/elasticsearch/.security_ok
      register: remocao
      changed_when: "'REMOVIDO' in remocao.stdout"

# ---- FASE kibana: configura e inicia UM Kibana (serial: 1); precisa do Elasticsearch concluido ----
- name: FASE kibana
  when: fase == 'kibana'
  block:
    - name: Pasta de dados do Kibana
      ansible.builtin.file:
        path: /var/lib/kibana
        state: directory
        owner: kibana
        group: kibana
        mode: "0750"

    - name: kibana.yml
      ansible.builtin.template:
        src: kibana.yml.j2
        dest: /etc/kibana/kibana.yml
        owner: root
        group: kibana
        mode: "0660"
      notify: reiniciar servico

    - name: Gravar os segredos no keystore do Kibana (somente se mudaram)
      # senhas e as 3 chaves de criptografia ficam no keystore (as chaves NAO podem mudar depois); o stamp evita regravar
      ansible.builtin.shell: |
        set -eu
        KS=/usr/share/kibana/bin/kibana-keystore
        STAMP={{ (es_kibana_system_password ~ tls_p12_password ~ kibana_encryption_key_security ~ kibana_encryption_key_saved_objects ~ kibana_encryption_key_reporting) | hash('sha256') }}
        [ -f /etc/kibana/kibana.keystore ] || "$KS" create
        if [ "$(cat /etc/kibana/.keystore_stamp 2>/dev/null || true)" = "$STAMP" ]; then echo SEM_MUDANCA; exit 0; fi
        add() { printf %s "$2" | "$KS" add --stdin --force "$1"; }
        add elasticsearch.password "$KBSYS"
        add server.ssl.keystore.password "$P12"
        add xpack.security.encryptionKey "$K_SEC"
        add xpack.encryptedSavedObjects.encryptionKey "$K_OBJ"
        add xpack.reporting.encryptionKey "$K_REP"
        chown root:kibana /etc/kibana/kibana.keystore
        chmod 660 /etc/kibana/kibana.keystore
        echo "$STAMP" > /etc/kibana/.keystore_stamp
        echo ALTERADO
      args:
        executable: /bin/bash
      environment:
        KBSYS: "{{ es_kibana_system_password }}"
        P12: "{{ tls_p12_password }}"
        K_SEC: "{{ kibana_encryption_key_security }}"
        K_OBJ: "{{ kibana_encryption_key_saved_objects }}"
        K_REP: "{{ kibana_encryption_key_reporting }}"
      register: keystore_kb
      changed_when: "'ALTERADO' in keystore_kb.stdout"
      notify: reiniciar servico
      no_log: true

    - name: Aplicar agora os reinícios pendentes (só reinicia se algo mudou)
      ansible.builtin.meta: flush_handlers

    - name: Garantir o Kibana no ar e habilitado no boot
      ansible.builtin.systemd_service:
        name: kibana
        state: started
        enabled: true

    - name: Esperar o Kibana ficar disponível
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:5601/api/status"
        url_username: elastic
        url_password: "{{ es_elastic_password }}"
        force_basic_auth: true
        ca_path: /etc/kibana/tls/http_ca.crt
        return_content: true
        status_code: [-1, 200, 401, 503]
      register: status_kb
      until: status_kb.status == 200 and status_kb.json.status.overall.level == 'available'
      retries: 30
      delay: 10
      changed_when: false

# ---- FASE fleet_kibana: configura o Fleet pela API do Kibana (setup, URLs, output padrao, politica fleet-server-policy) ----
- name: FASE fleet_kibana
  when: fase == 'fleet_kibana'
  delegate_to: "{{ groups['kibana'][0] }}"
  run_once: true
  vars:
    kb: "https://{{ hostvars[groups['kibana'][0]].ansible_host }}:5601"
    # impressao digital (SHA-256) da CA http: os agentes confiam nela para falar com o Elasticsearch
    fingerprint: "{{ fp.stdout }}"
    fleet_urls: >-
      {{ ['https://' ~ fleet_public_name ~ ':' ~ fleet_port] if fleet_public_name | length > 0
         else groups['integration'] | map('extract', hostvars, 'ansible_host') | map('regex_replace', '^', 'https://') | map('regex_replace', '$', ':' ~ fleet_port) | list }}
    es_urls: "{{ groups['es_hot'] | map('extract', hostvars, 'ansible_host') | map('regex_replace', '^', 'https://') | map('regex_replace', '$', ':9200') | list }}"
  module_defaults:
    ansible.builtin.uri:
      url_username: elastic
      url_password: "{{ es_elastic_password }}"
      force_basic_auth: true
      ca_path: /etc/kibana/tls/http_ca.crt
      body_format: json
      return_content: true
      headers:
        kbn-xsrf: "true"
  block:
    - name: Calcular a impressão digital da CA http
      ansible.builtin.shell: >-
        openssl x509 -in {{ ca_dir }}/ca_http/ca/ca.crt -noout -fingerprint -sha256
        | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f'
      delegate_to: "{{ ca_host }}"
      register: fp
      changed_when: false
      check_mode: false

    - name: 1) Fleet setup
      ansible.builtin.uri:
        url: "{{ kb }}/api/fleet/setup"
        method: POST
        body: {}
      changed_when: false

    - name: 2) Ver se a URL dos Fleet Servers já existe
      ansible.builtin.uri:
        url: "{{ kb }}/api/fleet/fleet_server_hosts/fleet-server-aiops"
        status_code: [200, 404]
      register: hosts_atual
      changed_when: false

    - name: 2) Criar a URL dos Fleet Servers
      ansible.builtin.uri:
        url: "{{ kb }}/api/fleet/fleet_server_hosts"
        method: POST
        body:
          id: fleet-server-aiops
          name: Fleet Servers
          host_urls: "{{ fleet_urls }}"
          is_default: true
      when: hosts_atual.status == 404

    - name: 2) Atualizar a URL dos Fleet Servers (se já existia)
      ansible.builtin.uri:
        url: "{{ kb }}/api/fleet/fleet_server_hosts/fleet-server-aiops"
        method: PUT
        body:
          name: Fleet Servers
          host_urls: "{{ fleet_urls }}"
          is_default: true
      when: hosts_atual.status == 200

    - name: 3) Output padrão dos agentes (os 8 hot, CA http por fingerprint)
      ansible.builtin.uri:
        url: "{{ kb }}/api/fleet/outputs/fleet-default-output"
        method: PUT
        body:
          name: default
          type: elasticsearch
          hosts: "{{ es_urls }}"
          is_default: true
          is_default_monitoring: true
          ca_trusted_fingerprint: "{{ fingerprint }}"

    - name: 4) Ver se a política dos Fleet Servers já existe
      ansible.builtin.uri:
        url: "{{ kb }}/api/fleet/agent_policies/fleet-server-policy"
        status_code: [200, 404]
      register: politica
      changed_when: false

    - name: 4) Criar a política dos Fleet Servers
      ansible.builtin.uri:
        url: "{{ kb }}/api/fleet/agent_policies"
        method: POST
        body:
          id: fleet-server-policy
          name: Fleet Server policy
          namespace: default
          has_fleet_server: true
          monitoring_enabled: [logs, metrics]
      when: politica.status == 404

# ---- FASE fleet_servers: instala o Fleet Server (Elastic Agent, porta 8220) nos servidores integration ----
# Um service token por servidor (nao e o enrollment token). Agente ja instalado = servidor pulado (o token nao e recriado).
- name: FASE fleet_servers
  when: fase == 'fleet_servers'
  block:
    - name: Ver se o Elastic Agent já está instalado
      ansible.builtin.stat:
        path: /opt/Elastic/Agent/elastic-agent
      register: agente

    - name: Instalar o Fleet Server neste servidor
      when: not agente.stat.exists
      vars:
        curto: "{{ inventory_hostname.split('.')[0] }}"
        pacote_agente: "elastic-agent-{{ elastic_version }}-linux-x86_64"
        url_pacote: "https://artifacts.elastic.co/downloads/beats/elastic-agent/{{ pacote_agente }}.tar.gz"
        token_url: "{{ es_api_url }}/_security/service/elastic/fleet-server/credential/token/fleet-{{ curto }}"
        hot_url: "https://{{ hostvars[groups['es_hot'][0]].ansible_host }}:9200"
        proxy_env: "{{ {'https_proxy': elastic_repo_proxy} if elastic_repo_proxy | length > 0 else {} }}"
      block:
        - name: Baixar o pacote do Elastic Agent (confere SHA-512)
          ansible.builtin.get_url:
            url: "{{ url_pacote }}"
            checksum: "sha512:{{ url_pacote }}.sha512"
            dest: "/root/{{ pacote_agente }}.tar.gz"
            mode: "0600"
          environment: "{{ proxy_env }}"

        - name: Extrair o pacote
          ansible.builtin.unarchive:
            src: "/root/{{ pacote_agente }}.tar.gz"
            dest: /root
            remote_src: true
            creates: "/root/{{ pacote_agente }}/elastic-agent"

        - name: Criar o service token deste Fleet Server (apaga um antigo de mesmo nome, se houver)
          # Seguro: so chega aqui se o agente NAO esta instalado, entao nenhum token em uso e revogado.
          delegate_to: "{{ es_api_host }}"
          module_defaults:
            ansible.builtin.uri:
              url_username: elastic
              url_password: "{{ es_elastic_password }}"
              force_basic_auth: true
              ca_path: "{{ es_tls_dir }}/http_ca.crt"
              return_content: true
          block:
            - name: Apagar token antigo (404 = não existia, tudo bem)
              ansible.builtin.uri:
                url: "{{ token_url }}"
                method: DELETE
                status_code: [200, 404]
              no_log: true

            - name: Criar o token
              ansible.builtin.uri:
                url: "{{ token_url }}"
                method: POST
                status_code: 200
              register: token
              no_log: true

        - name: Instalar o Elastic Agent como Fleet Server
          # --url: endereco que este Fleet Server anuncia; --fleet-server-es: Elasticsearch e CA; token/policy: criados acima; cert/key: porta 8220
          ansible.builtin.command:
            argv:
              - "/root/{{ pacote_agente }}/elastic-agent"
              - install
              - --non-interactive
              - "--url=https://{{ ansible_host }}:{{ fleet_port }}"
              - "--fleet-server-es={{ hot_url }}"
              - "--fleet-server-es-ca=/etc/fleet-server-tls/http_ca.crt"
              - "--fleet-server-service-token={{ token.json.token.value }}"
              - "--fleet-server-policy=fleet-server-policy"
              - "--fleet-server-port={{ fleet_port }}"
              - "--fleet-server-cert=/etc/fleet-server-tls/fleet.crt"
              - "--fleet-server-cert-key=/etc/fleet-server-tls/fleet.key"
              - "--certificate-authorities=/etc/fleet-server-tls/http_ca.crt"
            creates: /opt/Elastic/Agent/elastic-agent
          no_log: true

        - name: Apagar o instalador (o agente já está em /opt/Elastic/Agent)
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "/root/{{ pacote_agente }}"
            - "/root/{{ pacote_agente }}.tar.gz"

    - name: Esperar o Fleet Server responder na porta do Fleet
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:{{ fleet_port }}/api/status"
        ca_path: /etc/fleet-server-tls/http_ca.crt
        return_content: true
        status_code: [-1, 200, 503]
      register: status_fleet
      until: status_fleet.status == 200 and status_fleet.json.status == 'HEALTHY'
      retries: 30
      delay: 10
      changed_when: false
