---
# =============================================================================
#  infra / usuario  —  cria o usuario de servico "aiops" (acao=usuario, UMA vez)
#
#  O BASTION e quem tem root nos servidores. Fluxo, em 2 partes (o site.yml chama este arquivo 2 vezes):
#
#   PARTE 1 (host: bastion)   (como root) no BASTION: cria o aiops, libera sudo sem senha, autoriza a(s) chave(s)
#                             do exec node para o exec node entrar no bastion como aiops, e gera o par de chaves
#                             do aiops (ed25519) que ele usara para entrar nos servidores.
#   PARTE 2 (hosts: servidores) para cada servidor, o BASTION (delegate_to) entra como root, cria o aiops
#                             (senha bloqueada), grava a chave publica do aiops do bastion em
#                             /home/aiops/.ssh/authorized_keys e libera sudo sem senha (visudo valida).
#
#  Depois disso, as demais acoes entram no bastion como aiops (chave do exec node) e nos servidores como aiops, com
#  a chave do aiops do bastion (o site.yml a busca no bastion no inicio de cada execucao). Nada e instalado ou copiado no bastion; nada muda no AAP.
#  (Na parte 2 sao comandos ssh executados no bastion: um modulo com delegate_to rodaria no proprio
#  bastion, nao no servidor.)  Pode repetir quando quiser (idempotente).
# =============================================================================

# ------------------------------- PARTE 1: no bastion ------------------------
- name: PARTE 1 - aiops no bastion, com a chave SSH dele
  when: inventory_hostname in groups['bastion']
  block:
    - name: Criar o usuário {{ aiops_user }} no bastion e gerar o par de chaves (se ainda não existir)
      ansible.builtin.user:
        name: "{{ aiops_user }}"
        shell: /bin/bash
        comment: "Usuario de servico - automacao ELK"
        password: "*"
        generate_ssh_key: true
        ssh_key_type: ed25519
        ssh_key_file: .ssh/id_ed25519       # (o padrao do modulo seria id_rsa)
        ssh_key_comment: "{{ aiops_user }}@bastion"

    - name: Sudo completo e sem senha para o {{ aiops_user }} no bastion (visudo valida antes de gravar)
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ aiops_user }}"
        content: "{{ aiops_user }} ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"

    # --- chave com que o exec node entra no bastion como aiops (a mesma com que hoje entra como root) ---
    - name: Ler as chaves autorizadas do root no bastion (são as que o exec node já usa)
      ansible.builtin.slurp:
        src: /root/.ssh/authorized_keys
      register: chaves_root
      when: exec_node_public_key | length == 0

    - name: Definir quais chaves entram no bastion como {{ aiops_user }}
      ansible.builtin.set_fact:
        chaves_exec_node: >-
          {{ [exec_node_public_key] if exec_node_public_key | length > 0 else
             (chaves_root.content | b64decode).splitlines() | map('trim') | reject('equalto', '') | reject('match', '^#') | list }}

    - name: Conferir que há ao menos uma chave
      ansible.builtin.assert:
        that: chaves_exec_node | length > 0
        fail_msg: "Nenhuma chave encontrada em /root/.ssh/authorized_keys do bastion. Informe exec_node_public_key em group_vars/all.yml."
        quiet: true

    - name: Autorizar essas chaves para o {{ aiops_user }} no bastion (não duplica)
      ansible.posix.authorized_key:
        user: "{{ aiops_user }}"
        key: "{{ item }}"
        state: present
      loop: "{{ chaves_exec_node }}"
      loop_control:
        label: "{{ item.split()[-1] }}"

    - name: Ajustar o contexto SELinux do .ssh (se houver)
      ansible.builtin.command: "restorecon -R /home/{{ aiops_user }}/.ssh"
      changed_when: false
      failed_when: false

    - name: Ler a chave pública
      ansible.builtin.slurp:
        src: "{{ aiops_key_path }}.pub"
      register: chave_pub

    - name: Guardar a chave pública (a parte 2 usa)
      ansible.builtin.set_fact:
        aiops_chave_publica: "{{ chave_pub.content | b64decode | trim }}"

# ------------------------------- PARTE 2: nos servidores --------------------
- name: PARTE 2 - aiops nos servidores (o bastion entra como root em cada um)
  when: inventory_hostname in groups['elastic']
  block:
    - name: Conferir que a chave pública do bastion foi lida (rode a PARTE 1 antes)
      ansible.builtin.assert:
        that: hostvars['bastion'].aiops_chave_publica | default('') is match('^ssh-')
        fail_msg: "Chave publica do aiops do bastion nao encontrada."
        quiet: true

    - name: Criar o usuário {{ aiops_user }} (comandos executados NO BASTION, que entra como root no servidor)
      delegate_to: bastion
      ansible.builtin.shell: |
        ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new root@{{ ansible_host }} 'bash -s' <<'REMOTO'
        set -eu
        id {{ aiops_user }} >/dev/null 2>&1 || { useradd -m -s /bin/bash -c "Usuario de servico - automacao ELK" {{ aiops_user }}; echo CRIADO; }
        usermod -p '*' {{ aiops_user }}
        home=$(getent passwd {{ aiops_user }} | cut -d: -f6)
        install -d -m 700 -o {{ aiops_user }} -g {{ aiops_user }} "$home/.ssh"
        cat > "$home/.ssh/authorized_keys" <<'CHAVES'
        {{ hostvars['bastion'].aiops_chave_publica }}
        CHAVES
        chown {{ aiops_user }}:{{ aiops_user }} "$home/.ssh/authorized_keys"
        chmod 600 "$home/.ssh/authorized_keys"
        echo "{{ aiops_user }} ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/{{ aiops_user }}.novo
        chmod 440 /etc/sudoers.d/{{ aiops_user }}.novo
        visudo -cf /etc/sudoers.d/{{ aiops_user }}.novo >/dev/null
        mv /etc/sudoers.d/{{ aiops_user }}.novo /etc/sudoers.d/{{ aiops_user }}
        if command -v getenforce >/dev/null 2>&1 && [ "$(getenforce)" != "Disabled" ]; then restorecon -R "$home/.ssh"; fi
        REMOTO
      args:
        executable: /bin/bash
      register: criacao
      changed_when: "'CRIADO' in criacao.stdout"
