---
# =============================================================================
#  VARIAVEIS DO AMBIENTE (valem para todos os servidores)
#
#  Aqui ficam: o que executar (acao), versao, bastion, nomes do F5, Fleet e constantes.
#  Variaveis que mudam por grupo de servidores estao nos outros arquivos desta pasta
#  (es_master.yml, es_hot.yml, ...: papeis do no, heap e discos).
#  Os segredos NAO ficam aqui: ficam no vault.yml (veja vault.yml.example).
# =============================================================================
# ------------------------------------------------------------ O QUE EXECUTAR (condicao)
# acao escolhe o que o site.yml faz; troque na linha de comando:  -e acao=validar
#   usuario   cria o usuario aiops (UMA vez; o bastion entra como root em cada servidor)
#   precheck  confere o ambiente (somente leitura)                          <- padrao, nao altera nada
#   ensaio    mostra quais discos seriam formatados (somente leitura)
#   instalar  pre-check + discos + sistema + componentes abaixo
#   validar   confere o ambiente instalado (somente leitura)
acao: precheck
# componentes que a acao "instalar" executa (tire um da lista para pular)
componentes: [elasticsearch, kibana, fleet]

# ------------------------------------------------------------ versao e cluster
elastic_version: "9.5.5"
es_cluster_name: elasticsearch_corp      # NAO pode mudar depois do bootstrap

# ------------------------------------------------------------ como chegar nos servidores
# Fluxo:  AAP -> exec node (Lapa) -> bastion -> servidores do cluster.
# O bastion cria o usuario aiops nele mesmo (com um par de chaves) e nos servidores (acao=usuario, uma vez).
# Depois, os playbooks entram nos servidores como aiops, com a chave do aiops do bastion
# (o site.yml busca essa chave no bastion no inicio de cada execucao e apaga no fim).
aiops_user: aiops
aiops_key_path: "/home/{{ aiops_user }}/.ssh/id_ed25519"      # chave privada do aiops, NO BASTION
aiops_key_local: /tmp/elastic-certs-staging/aiops_key         # copia temporaria dentro do job
bastion_host: 10.29.148.161              # vazio = conexao direta, sem bastion
bastion_user: root
# Chave usada para entrar no bastion como root: por padrao, a que o exec node ja usa (vazio).
# Se o job nao a enxergar, informe aqui o caminho dela DENTRO do job (veja o README).
bastion_key_file: ""
# Usuario de conexao nos servidores: sempre aiops (vale mesmo que a credencial do job tenha outro usuario).
ansible_user: "{{ aiops_user }}"
# Aplicado a todos os servidores: a conexao SSH atravessa o bastion.
ansible_ssh_common_args: >-
  {{ '' if bastion_host | length == 0 else
     '-o ProxyCommand="ssh -W %h:%p -q -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null'
     ~ (' -o IdentitiesOnly=yes -i ' ~ bastion_key_file if bastion_key_file | length > 0 else '')
     ~ ' ' ~ bastion_user ~ '@' ~ bastion_host ~ '"' }}

# ------------------------------------------------------------ nomes publicados no F5
es_public_name: elastic.claro.com.br
kibana_public_name: kibana.claro.com.br
kibana_public_base_url: "https://kibana.claro.com.br"
f5_vips:                                 # o precheck confere se o DNS aponta para o VIP
  kibana.claro.com.br: 10.29.177.75
  elastic.claro.com.br: 10.29.177.76

# ------------------------------------------------------------ Fleet (servidores "integration")
fleet_port: 8220
# Opcional: nome do VIP no F5 que balanceia os 2 Fleet Servers (ex.: fleet.claro.com.br).
# Vazio = os agentes recebem as duas URLs (IP de cada servidor), sem F5.
fleet_public_name: ""

# ------------------------------------------------------------ pacotes
elastic_repo_proxy: ""                   # ex.: http://proxy:3128 (vazio = internet direta)

# ------------------------------------------------------------ seguranca do bootstrap
# Cluster NOVO so e formado com:  -e es_bootstrap_allowed=true  (somente na primeira vez)
es_bootstrap_allowed: false

# ------------------------------------------------------------ constantes (nao mexer)
es_api_host: "{{ groups['es_master'][0] }}"      # no usado para chamar a API
es_api_url: "https://{{ hostvars[groups['es_master'][0]].ansible_host }}:9200"
es_tls_dir: /etc/elasticsearch/tls
es_bin: /usr/share/elasticsearch/bin
es_marker: /etc/elasticsearch/.cluster_uuid       # marca "este cluster ja foi formado"
ca_host: "{{ groups['es_master'][0] }}"           # servidor onde ficam as CAs internas
ca_dir: /root/elastic-ca
cert_staging: /tmp/elastic-certs-staging          # area temporaria no controlador
