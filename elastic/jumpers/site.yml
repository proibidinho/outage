---
- name: Identificar o alerta, o servidor e o jumper do datacenter
  hosts: localhost
  gather_facts: false
  roles:
    - role: alvo

- name: Ler o uso de disco do servidor do alerta a partir do jumper, só com acessar_servidor true
  hosts: jumper
  gather_facts: false
  roles:
    - role: diagnostico

- name: Enviar o e-mail ao time solucionador
  hosts: localhost
  gather_facts: false
  roles:
    - role: notificacao

- name: Devolver o resultado ao Splunk
  hosts: localhost
  gather_facts: false
  roles:
    - role: devolucao

- name: Encerrar o job com falha se o e-mail não foi enviado
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Conferir o envio do e-mail
      ansible.builtin.include_role:
        name: notificacao
        tasks_from: conferir.yml
