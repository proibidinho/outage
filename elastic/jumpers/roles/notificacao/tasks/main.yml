---
- name: Juntar o resultado do diagnóstico feito no jumper
  ansible.builtin.set_fact:
    notificacao_diagnostico: "{{ (hostvars[alvo_jumper_nome].diagnostico_resultado | default({}, true)) if ((alvo_jumper_nome | length) > 0 and alvo_jumper_nome in hostvars) else {} }}"

- name: Definir a situação do alerta
  ansible.builtin.set_fact:
    notificacao_situacao: "{{ 'hypervisor' if (alvo_hypervisor | default(false) | bool) else ('processo' if (alvo_processo | default(false) | bool) else ('windows' if (alvo_windows | default(false) | bool) else ((('linux' if (alvo_linux | default(false) | bool) else 'servidor') if not (alvo_acessar_servidor | default(false) | bool) else ('sem_acesso' if (alvo_motivo_sem_acesso | length) > 0 else ('ok' if (notificacao_diagnostico.acesso_ok | default(false) | bool) else 'falha')))))) }}"
    notificacao_tipo_destino: "{{ 'hypervisor' if (alvo_hypervisor | default(false) | bool) else ('windows' if (alvo_windows | default(false) | bool) else ('linux' if (alvo_linux | default(false) | bool) else '')) }}"
    notificacao_lista_teste: "{{ (([notificacao_destinatarios_teste] if notificacao_destinatarios_teste is string else (notificacao_destinatarios_teste | default([], true) | list)) | map('string') | map('trim') | reject('equalto', '') | list) if notificacao_destinatarios_teste is not none else [] }}"

- name: Definir os destinatários do time pelo tipo do alerta
  ansible.builtin.set_fact:
    notificacao_para_times: "{{ notificacao_destinatarios_por_tipo[notificacao_tipo_destino] if notificacao_tipo_destino in notificacao_destinatarios_por_tipo else notificacao_destinatarios_copia }}"
    notificacao_cc_times: "{{ notificacao_destinatarios_copia if notificacao_tipo_destino in notificacao_destinatarios_por_tipo else [] }}"

- name: Definir os destinatários deste envio
  ansible.builtin.set_fact:
    notificacao_modo_envio: "{{ 'teste' if (notificacao_lista_teste | length) > 0 else ('times' if (notificacao_enviar_aos_times | bool) else 'validacao') }}"
    notificacao_para: "{{ notificacao_lista_teste if (notificacao_lista_teste | length) > 0 else (notificacao_para_times if (notificacao_enviar_aos_times | bool) else notificacao_destinatarios_validacao) }}"
    notificacao_cc: "{{ [] if (notificacao_lista_teste | length) > 0 else (notificacao_cc_times if (notificacao_enviar_aos_times | bool) else []) }}"

- name: Destinatários do e-mail
  ansible.builtin.debug:
    msg:
      - "Modo do envio: {{ {'teste': 'teste (notificacao_destinatarios_teste)', 'times': 'times solucionadores (notificacao_enviar_aos_times: true)', 'validacao': 'validação (notificacao_enviar_aos_times: false)'}[notificacao_modo_envio] }}"
      - "Para: {{ notificacao_para | join(', ') }}"
      - "Cc: {{ notificacao_cc | join(', ') if (notificacao_cc | length) > 0 else 'nenhum' }}"
      - "Destinatários do time pelo tipo do alerta: Para {{ notificacao_para_times | join(', ') }}; Cc {{ notificacao_cc_times | join(', ') if (notificacao_cc_times | length) > 0 else 'nenhum' }}"
      - "{{ ('Sistema operacional do alerta (' ~ (alvo_alerta.entityOS | default('não informado', true) | string | trim) ~ ') não é LINUX nem WINDOWS: com o envio aos times ligado, o e-mail vai só para ' ~ (notificacao_destinatarios_copia | join(', ')) ~ '.') if (notificacao_tipo_destino | length) == 0 else 'Tipo do destinatário: ' ~ notificacao_tipo_destino }}"

- name: Ler os campos do alerta
  ansible.builtin.set_fact:
    notificacao_host: "{{ alvo_alerta.entityHost | default('', true) | string | trim }}"
    notificacao_ic: "{{ alvo_alerta.entityIC | default('', true) | string | trim }}"
    notificacao_problem_id: "{{ alvo_alerta.problemId | default(alvo_alerta.alertToolId | default('', true), true) | string | trim }}"
    notificacao_display_id: "{{ alvo_alerta.displayId | default('', true) | string | trim }}"
    notificacao_episodio: "{{ (alvo_alerta.episodeId | default('', true) | string).split('|||')[0] | trim }}"
    notificacao_inicio_epoch: "{{ (alvo_alerta.startTime | default('', true) | string) if (alvo_alerta.startTime | default('', true) | string) is match('^[0-9]+$') else '' }}"
    notificacao_registro_epoch: "{{ (alvo_alerta.indexTime | default('', true) | string) if (alvo_alerta.indexTime | default('', true) | string) is match('^[0-9]+$') else '' }}"
    notificacao_recebido_utc: "{{ ((alvo_alerta.meta | default({}, true)).received_at | default('', true) | string | replace('T', ' '))[:19] }}"

- name: Definir o servidor do processo e converter os horários para o horário de São Paulo
  ansible.builtin.set_fact:
    notificacao_servidor_processo: "{{ notificacao_ic if ((notificacao_ic | length) > 0 and (notificacao_ic | lower) != (notificacao_host | lower)) else '' }}"
    notificacao_inicio: "{{ ('%d/%m/%Y %H:%M:%S' | ansible.builtin.strftime((notificacao_inicio_epoch | int) // 1000)) if (notificacao_inicio_epoch | string | length) > 0 else '' }}"
    notificacao_registro: "{{ ('%d/%m/%Y %H:%M:%S' | ansible.builtin.strftime(notificacao_registro_epoch | int)) if (notificacao_registro_epoch | string | length) > 0 else '' }}"
    notificacao_recebido: "{{ ('%d/%m/%Y %H:%M:%S' | ansible.builtin.strftime(((notificacao_recebido_utc | ansible.builtin.to_datetime('%Y-%m-%d %H:%M:%S')) - ('1970-01-01 00:00:00' | ansible.builtin.to_datetime('%Y-%m-%d %H:%M:%S'))).total_seconds() | int)) if notificacao_recebido_utc is match('^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$') else '' }}"

- name: Definir o nome do servidor e o IC do alerta
  ansible.builtin.set_fact:
    notificacao_nome_servidor: "{{ notificacao_servidor_processo if notificacao_situacao == 'processo' else notificacao_host }}"
    notificacao_nome_ic: "{{ '' if notificacao_situacao == 'processo' else notificacao_ic }}"

- name: Conferir se o IC é o mesmo servidor do alerta
  ansible.builtin.set_fact:
    notificacao_ic_mesmo_servidor: "{{ (notificacao_nome_servidor | length) > 0 and (notificacao_nome_ic | length) > 0 and (((notificacao_nome_servidor | lower) == (notificacao_nome_ic | lower)) or (notificacao_nome_servidor is not match(notificacao_regex_ipv4) and notificacao_nome_ic is not match(notificacao_regex_ipv4) and (notificacao_nome_servidor.split('.')[0] | lower) == (notificacao_nome_ic.split('.')[0] | lower))) }}"

- name: Juntar os nomes do mesmo servidor
  ansible.builtin.set_fact:
    notificacao_nomes: "{{ ([notificacao_nome_servidor] + ([notificacao_nome_ic] if (notificacao_ic_mesmo_servidor | bool) else [])) | reject('equalto', '') | list }}"
    notificacao_ic_cmdb: "{{ notificacao_nome_ic if ((notificacao_nome_ic | length) > 0 and not (notificacao_ic_mesmo_servidor | bool)) else '' }}"

- name: Separar o FQDN do servidor
  ansible.builtin.set_fact:
    notificacao_fqdn: "{{ ((notificacao_nomes | select('search', '[.]') | reject('match', notificacao_regex_ipv4) | list) + [''])[0] }}"

- name: Separar o hostname do servidor
  ansible.builtin.set_fact:
    notificacao_hostname: "{{ ((notificacao_nomes | reject('search', '[.]') | list) + [notificacao_fqdn.split('.')[0] if (notificacao_fqdn | length) > 0 else notificacao_nome_servidor])[0] }}"

- name: Montar os dados do e-mail
  ansible.builtin.set_fact:
    notificacao_frase: "{{ notificacao_frases[notificacao_situacao] }}"
    notificacao_disco: "{{ notificacao_diagnostico.disco | default({}, true) }}"
    notificacao_linhas:
      - rotulo: Título do alerta
        valor: "{{ alvo_titulo if (alvo_titulo | length) > 0 else 'não informado' }}"
      - rotulo: Tipo
        valor: "{{ 'Hypervisor (ESXi)' if notificacao_situacao == 'hypervisor' else ('Processo' if notificacao_situacao == 'processo' else ('Servidor Windows' if notificacao_situacao == 'windows' else 'Servidor')) }}"
      - rotulo: Processo
        valor: "{{ (notificacao_host if (notificacao_host | length) > 0 else 'não informado') if notificacao_situacao == 'processo' else '' }}"
      - rotulo: Hostname
        valor: "{{ notificacao_hostname if (notificacao_hostname | length) > 0 else 'não informado' }}"
      - rotulo: FQDN
        valor: "{{ notificacao_fqdn }}"
      - rotulo: IC no CMDB
        valor: "{{ notificacao_ic_cmdb }}"
      - rotulo: IP
        valor: "{{ ('(' ~ (alvo_ips | join(', ')) ~ ')') if (alvo_ips | length) > 0 else 'não informado' }}"
      - rotulo: Localidade
        valor: "{{ alvo_alerta.entityLocation | default('não informada', true) | string | trim }}"
      - rotulo: Ambiente
        valor: "{{ alvo_alerta.ambiente | default('', true) | string | trim }}"
      - rotulo: Disco
        valor: "{{ alvo_alerta.diskPath | default('não informado', true) | string | trim }}"
      - rotulo: Sistema operacional
        valor: "{{ alvo_alerta.entityOS | default('não informado', true) | string | trim }}"
      - rotulo: Origem do alerta
        valor: "{{ alvo_alerta.originTool | default('', true) | string | trim }}"
      - rotulo: Automação cadastrada no AIOps
        valor: "{{ alvo_alerta.automationName | default('', true) | string | trim }}"
      - rotulo: Início do alerta
        valor: "{{ notificacao_inicio if (notificacao_inicio | length) > 0 else 'não informado' }}"
      - rotulo: Registrado no Splunk
        valor: "{{ notificacao_registro }}"
      - rotulo: Recebido pelo Self-healing
        valor: "{{ notificacao_recebido }}"
      - rotulo: Problem
        valor: "{{ notificacao_display_id if (notificacao_display_id | length) > 0 else (notificacao_problem_id if (notificacao_problem_id | length) > 0 else 'não informado') }}"
      - rotulo: Entidade
        valor: "{{ alvo_alerta.entityId | default('', true) | string | trim }}"
      - rotulo: Episódio no ITSI
        valor: "{{ notificacao_episodio }}"

- name: Deixar só as linhas com valor
  ansible.builtin.set_fact:
    notificacao_dados: "{{ notificacao_linhas | rejectattr('valor', 'equalto', '') | list }}"

- name: Montar o e-mail em HTML e o resumo em texto
  ansible.builtin.set_fact:
    notificacao_corpo_html: "{{ lookup('ansible.builtin.template', 'corpo_email.html.j2') }}"
    notificacao_corpo: "{{ lookup('ansible.builtin.template', 'corpo_email.txt.j2') }}"

- name: Enviar e conferir o e-mail
  block:
    - name: Enviar o e-mail
      community.general.mail:
        host: "{{ notificacao_smtp_host }}"
        port: "{{ notificacao_smtp_porta | int }}"
        secure: never
        sender: "{{ notificacao_remetente }}"
        to: "{{ notificacao_para }}"
        cc: "{{ notificacao_cc }}"
        subject: "{{ notificacao_assunto }}"
        body: "{{ notificacao_corpo_html }}"
        subtype: html
        charset: utf-8
        timeout: 30
      register: notificacao_envio
      until: notificacao_envio is succeeded
      retries: "{{ notificacao_tentativas | int }}"
      delay: "{{ notificacao_intervalo | int }}"

    - name: E-mail enviado
      ansible.builtin.debug:
        msg: "{{ ['Assunto: ' ~ notificacao_assunto, 'Para: ' ~ (notificacao_para | join(', ')), 'Cc: ' ~ (notificacao_cc | join(', ') if (notificacao_cc | length) > 0 else 'nenhum'), 'Situação: ' ~ notificacao_situacao, 'Formato: HTML (resumo em texto abaixo)', ''] + notificacao_corpo.splitlines() }}"

  rescue:
    - name: Guardar o erro do e-mail para a devolução e para encerrar o job com falha no fim
      ansible.builtin.set_fact:
        notificacao_erro: "{{ ((ansible_failed_result.module_stderr | default('', true) | string).splitlines() | map('trim') | reject('equalto', '') | list | last | default(ansible_failed_result.msg | default('erro desconhecido', true), true)) | string | replace('\n', ' ') | trim }}"
