---
notificacao_texto_time: "O processo de solução automática está pronto, porém o alerta não foi resolvido, pois <b>precisamos da ajuda do time solucionador para definirmos juntos a ação adequada</b> para este alerta e incluí-la no código."
notificacao_frases:
  linux:
    titulo: "O Ansible Automation Platform recebeu este alerta de um servidor Linux."
    texto: "{{ notificacao_texto_time }}"
  windows:
    titulo: "O Ansible Automation Platform recebeu este alerta de um servidor Windows."
    texto: "{{ notificacao_texto_time }}"
  hypervisor:
    titulo: "O Ansible Automation Platform recebeu este alerta de um hypervisor (ESXi)."
    texto: "{{ notificacao_texto_time }}"
  processo:
    titulo: "O Ansible Automation Platform recebeu este alerta de um processo ({{ notificacao_host if (notificacao_host | length) > 0 else 'não informado' }}){{ (', que roda no servidor ' ~ notificacao_servidor_processo) if (notificacao_servidor_processo | length) > 0 else '' }}."
    texto: "{{ notificacao_texto_time }}"
  servidor:
    titulo: "O Ansible Automation Platform recebeu este alerta de um servidor."
    texto: "{{ notificacao_texto_time }}"
  ok:
    titulo: "O Self-healing recebeu este alerta e acessou o servidor."
    texto: "O acesso foi somente para consulta: <b>nenhuma alteração foi feita no ambiente</b>. Abaixo está a situação atual do disco que está alarmando."
  falha:
    titulo: "O Self-healing recebeu este alerta, mas não conseguiu acessar o servidor."
    texto: "Para que este alerta possa ser resolvido automaticamente, <b>precisamos da ajuda do time solucionador para liberar a regra de firewall ou o acesso ao servidor</b> para o Self-healing."
  sem_acesso:
    titulo: "O Self-healing recebeu este alerta, mas não acessou o servidor."
    texto: ""
notificacao_rodape: "Mensagem automática enviada pelo Ansible Automation Platform: nada foi criado, alterado ou apagado. A solução automática deste alerta é construída em conjunto pelo time de AIOps e pela área solucionadora. Procure-nos para desenvolvermos juntos a automação deste alerta."
notificacao_assunto: "[self-healing] {{ alvo_titulo if (alvo_titulo | length) > 0 else 'SLOW DISK' }} {{ alvo_alerta.entityHost | default('sem host', true) }} {{ alvo_localidade if (alvo_localidade | length) > 0 else 'sem localidade' }}"
notificacao_regex_ipv4: '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
notificacao_cores:
  faixa_ok: "#2e7d32"
  faixa_alerta: "#e8710a"
  uso_critico: "#c62828"
  uso_atencao: "#e8710a"
  uso_normal: "#2e7d32"
notificacao_uso_critico: 90
notificacao_uso_atencao: 80
