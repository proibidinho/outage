---
- name: Registrar o horário de início do job
  ansible.builtin.set_fact:
    alvo_inicio_epoch: "{{ now().timestamp() }}"

- name: Ler o alerta recebido
  ansible.builtin.set_fact:
    alvo_alerta: "{{ alerta if (alerta is mapping and (alerta | length) > 0) else (ansible_eda.event | default({}, true)) }}"

- name: Conferir se o alerta chegou ao job
  ansible.builtin.assert:
    that:
      - alvo_alerta is mapping
      - (alvo_alerta | length) > 0
    fail_msg: "O job foi lançado sem o alerta. Lançar pela activation do EDA ou informar a variável alerta com os campos do evento. Nenhum servidor foi acessado."
    quiet: true

- name: Normalizar os campos do alerta
  ansible.builtin.set_fact:
    alvo_titulo: "{{ alvo_alerta.alertTitle | default('', true) | string | trim }}"
    alvo_localidade: "{{ alvo_alerta.entityLocation | default('', true) | string | trim | upper | replace('_', '-') }}"
    alvo_host: "{{ alvo_alerta.entityHost | default((alvo_alerta.entityName | default('', true) | string).split('|')[0], true) | string | trim | lower }}"
    alvo_ips_texto: "{{ alvo_alerta.entityIp | default(((alvo_alerta.entityName | default('', true) | string).split('|') + [''])[1], true) | string }}"
    alvo_hypervisor: "{{ (alvo_alerta.entityId | default('', true) | string | trim) is match('HYPERVISOR-') }}"
    alvo_processo: "{{ alvo_alerta.entityId is defined and alvo_alerta.entityId is not none and (alvo_alerta.entityId | string | trim) is not match('(HOST|HYPERVISOR)-') }}"
    alvo_windows: "{{ (alvo_alerta.entityOS | default('', true) | string | trim | upper) == 'WINDOWS' }}"
    alvo_linux: "{{ (alvo_alerta.entityOS | default('', true) | string | trim | upper) == 'LINUX' }}"
    alvo_acessar_servidor: "{{ acessar_servidor | default(false) | bool }}"

- name: Definir se o job dispensa o acesso ao servidor
  ansible.builtin.set_fact:
    alvo_nao_acessa: "{{ (not (alvo_acessar_servidor | bool)) or (alvo_windows | bool) or (alvo_hypervisor | bool) or (alvo_processo | bool) }}"

- name: Separar o nome curto e os IPs do servidor
  ansible.builtin.set_fact:
    alvo_host_curto: "{{ '' if alvo_host is match(alvo_regex_ipv4) else alvo_host.split('.')[0] }}"
    alvo_ips: "{{ alvo_ips_texto.split(',') | map('trim') | select('match', alvo_regex_ipv4) | list }}"

- name: Definir a ordem das tentativas, primeiro o nome e depois o IP
  ansible.builtin.set_fact:
    alvo_tentativas: "{{ [] if (alvo_nao_acessa | bool) else (((([alvo_host, alvo_host_curto] | select('match', alvo_regex_hostname) | list) + alvo_ips) | unique | list)[:(alvo_maximo_tentativas | int)]) }}"

- name: Identificar o datacenter pela localidade do alerta
  ansible.builtin.set_fact:
    alvo_dc: "{{ alvo_datacenters[alvo_localidade] | default({}, true) }}"

- name: Definir se o servidor pode ser acessado
  ansible.builtin.set_fact:
    alvo_motivo_sem_acesso: >-
      {{ '' if (alvo_nao_acessa | bool) else
         ('A localidade ' ~ (alvo_localidade if (alvo_localidade | length) > 0 else '(vazia)') ~ ' não está mapeada para nenhum jumper. O servidor não foi acessado.')
         if (alvo_dc | length) == 0 else
         ('O alerta não traz nome nem IP válido do servidor. O servidor não foi acessado.' if (alvo_tentativas | length) == 0 else '') }}

- name: Guardar o nome do jumper usado
  ansible.builtin.set_fact:
    alvo_jumper_nome: "{{ alvo_dc.jumper_nome if ((alvo_motivo_sem_acesso | length) == 0 and not (alvo_nao_acessa | bool)) else '' }}"

- name: Incluir o jumper do datacenter no inventário da execução
  ansible.builtin.add_host:
    name: "{{ alvo_jumper_nome }}"
    groups: jumper
    ansible_host: "{{ alvo_dc.jumper_ip }}"
    ansible_user: "{{ alvo_usuario_jumper }}"
    ansible_ssh_timeout: "{{ alvo_jumper_timeout_conexao | int }}"
    ansible_ssh_retries: "{{ alvo_jumper_retentativas_ssh | int }}"
    alvo_tentativas: "{{ alvo_tentativas }}"
  changed_when: false
  when: (alvo_jumper_nome | length) > 0

- name: Dados do alerta e do acesso
  ansible.builtin.debug:
    msg:
      - "Alerta: {{ alvo_titulo if (alvo_titulo | length) > 0 else 'sem título' }}"
      - "{{ 'Processo' if (alvo_processo | bool) else 'Servidor' }}: {{ alvo_host if (alvo_host | length) > 0 else 'não informado' }}"
      - "IPs: {{ alvo_ips | join(', ') if (alvo_ips | length) > 0 else 'nenhum' }}"
      - "Localidade: {{ alvo_localidade if (alvo_localidade | length) > 0 else 'vazia' }}"
      - "Datacenter: {{ alvo_dc.datacenter | default('não mapeado') }}"
      - "Jumper: {{ (alvo_dc.jumper_nome ~ ' (' ~ alvo_dc.jumper_ip ~ ')') if (alvo_jumper_nome | length) > 0 else 'nenhum' }}"
      - "Endereços que serão tentados: {{ alvo_tentativas | join(', ') if (alvo_jumper_nome | length) > 0 else 'nenhum' }}"
      - "Acesso ao servidor: {{ 'ligado' if (alvo_acessar_servidor | bool) else 'desligado (acessar_servidor: false)' }}"
      - "{{ 'Acesso ao servidor desligado: nenhum ssh será feito, só o e-mail.' if not (alvo_acessar_servidor | bool) else ('Hypervisor (ESXi): o Self-healing não acessa hypervisor. Nenhum acesso será feito, só o e-mail.' if (alvo_hypervisor | bool) else ('Processo: o Self-healing ainda não trata alertas de processo. Nenhum acesso será feito, só o e-mail.' if (alvo_processo | bool) else ('Servidor Windows: o Self-healing ainda não acessa servidores Windows. Nenhum acesso será feito, só o e-mail.' if (alvo_windows | bool) else (alvo_motivo_sem_acesso if (alvo_motivo_sem_acesso | length) > 0 else 'O servidor será acessado pelo jumper, só com df -h.')))) }}"
