---
# =====================================================================
# Substitui o playbook.yml LEGADO pelo NOVO nos projetos do GitLab.
# Roda direto na CLI (não precisa do AAP). Arquivos usados:
#   files/playbook_legado.yml  -> como o playbook.yml é hoje
#   files/playbook_novo.yml    -> como ele deve ficar
#
#   export GITLAB_URL=https://gitlab.claro.com.br
#   # autenticação: use UMA das duas opções
#   export GITLAB_USER=seu.usuario GITLAB_PASSWORD='sua-senha'   # troca por token OAuth (ver aviso abaixo)
#   export GITLAB_TOKEN=glpat-xxxxxxxx                           # ou Personal Access Token (escopo "api")
#
#   Aviso: a API do GitLab não aceita usuário/senha direto; o playbook usa o fluxo OAuth
#   "password" (POST /oauth/token). Esse fluxo NÃO funciona com 2FA ativo, e foi marcado
#   para remoção nas versões self-managed 19.x. Se falhar, só com token.
#
#   ansible-playbook substituir.yml                                  # 1) SIMULAÇÃO (padrão, não altera nada)
#   ansible-playbook substituir.yml -e aplicar=true -e limite=3      # 2) piloto com 3 projetos
#   ansible-playbook substituir.yml -e aplicar=true                  # 3) execução real
#   ansible-playbook substituir.yml -e aplicar=true -e modo=mr       #    (ou abrindo um MR por projeto)
#
# Sem filtro, varre TODOS os projetos não arquivados que o token enxerga (com
# token de admin, são todos da instância). Para limitar a um grupo (com
# subgrupos): -e gitlab_grupo=nome/do/grupo. Token de usuário comum: use
# -e somente_membro=true para listar só projetos onde ele tem acesso Developer+.
#
# Segurança: só altera o projeto cujo playbook.yml for IGUAL ao legado
# (ignorando apenas CRLF/LF, espaços no fim de linha e linhas em branco no fim
# do arquivo). Qualquer outro conteúdo é preservado.
# Ao final grava relatorio_*.csv com o resultado de cada projeto.
# =====================================================================

- name: Substituir playbook.yml legado pelo novo nos projetos do GitLab
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    gitlab_url: "{{ lookup('env', 'GITLAB_URL') }}"
    gitlab_token: "{{ lookup('env', 'GITLAB_TOKEN') }}"
    gitlab_user: "{{ lookup('env', 'GITLAB_USER') }}"
    gitlab_password: "{{ lookup('env', 'GITLAB_PASSWORD') }}"
    validar_certs: false            # mesmo comportamento do main.yml (certificado interno)

    gitlab_grupo: ""                # opcional: restringe a um grupo (id ou path)
    somente_membro: false           # false = todos os projetos visíveis ao token (admin vê tudo);
                                    # true  = só onde o dono do token é membro (Developer+)
    arquivo_alvo: playbook.yml      # caminho do arquivo dentro de cada repositório
    limite: 0                       # 0 = todos; N = só os N primeiros (piloto)

    aplicar: false                  # false = simulação; true = altera de verdade
    modo: commit                    # commit = direto na branch padrão | mr = branch + Merge Request
    branch_mr: atualiza-playbook-yml
    pular_ci: false                 # true = adiciona [skip ci] no commit

    git_username: Ansible Automation
    git_email: aiops.centroexcelencia@claro.com.br
    commit_message: Atualiza playbook.yml para o novo padrão (tratamento de erro da role oracle_dml)
    mr_titulo: Atualiza playbook.yml para o novo padrão
    mr_descricao: Substituição do playbook.yml legado pelo novo padrão, executada via Ansible (CLI).

    arquivo_legado: "{{ playbook_dir }}/files/playbook_legado.yml"
    arquivo_novo: "{{ playbook_dir }}/files/playbook_novo.yml"

    api: "{{ gitlab_url | regex_replace('/+$', '') }}/api/v4"
    nl: "\n"
    url_listagem: >-
      {{ api }}/{{ ('groups/' ~ (gitlab_grupo | string | regex_replace('/', '%2F')) ~ '/projects?include_subgroups=true&archived=false')
                   if (gitlab_grupo | string | length) > 0
                   else ('projects?archived=false&membership=true&min_access_level=30' if (somente_membro | bool) else 'projects?archived=false') }}&per_page=100

  tasks:

    - name: Validar parâmetros
      ansible.builtin.assert:
        that:
          - gitlab_url | length > 0
          - (gitlab_token | length > 0) or ((gitlab_user | length > 0) and (gitlab_password | length > 0))
          - modo in ['commit', 'mr']
        fail_msg: Defina GITLAB_URL e GITLAB_TOKEN (ou GITLAB_USER + GITLAB_PASSWORD) e use modo=commit ou modo=mr.
        quiet: true

    - name: Obter token OAuth com usuário e senha
      when: gitlab_token | length == 0
      block:
        - name: Pedir token ao GitLab (fluxo password)
          ansible.builtin.uri:
            url: "{{ gitlab_url | regex_replace('/+$', '') }}/oauth/token"
            method: POST
            body_format: form-urlencoded
            body:
              grant_type: password
              username: "{{ gitlab_user }}"
              password: "{{ gitlab_password }}"
              scope: api
            validate_certs: "{{ validar_certs | bool }}"
            status_code: 200
          register: oauth_resp
          no_log: true

        - name: Guardar o token obtido
          ansible.builtin.set_fact:
            gitlab_token: "{{ oauth_resp.json.access_token }}"
          no_log: true
      rescue:
        - name: Falha ao autenticar com usuário e senha
          ansible.builtin.fail:
            msg: >-
              Não foi possível obter token com usuário/senha. Causas comuns: senha incorreta, conta com 2FA
              (o fluxo password é bloqueado), fluxo password desativado/removido nesta versão do GitLab, ou
              conta de SSO/LDAP. Nesses casos é necessário usar um token (GITLAB_TOKEN).

    # Normalização usada nas comparações (3 cópias idênticas: legado, novo e cada projeto):
    # remove BOM, converte CRLF/CR em LF, tira espaços no fim das linhas e linhas em branco no
    # fim do arquivo, e guarda só o SHA-256. Guardar só o hash evita que o {{ }} do conteúdo
    # dos playbooks seja interpretado como template pelo Ansible.
    - name: Calcular hash do playbook legado e do novo
      ansible.builtin.set_fact:
        hash_legado: >-
          {{ lookup('file', arquivo_legado)
             | regex_replace('^\\ufeff', '')
             | regex_replace('\\r\\n?', '\\n')
             | regex_replace('[ \\t]+$', '', multiline=True)
             | regex_replace('\\s+\\Z', '')
             | hash('sha256') }}
        hash_novo: >-
          {{ lookup('file', arquivo_novo)
             | regex_replace('^\\ufeff', '')
             | regex_replace('\\r\\n?', '\\n')
             | regex_replace('[ \\t]+$', '', multiline=True)
             | regex_replace('\\s+\\Z', '')
             | hash('sha256') }}

    - name: Garantir que legado e novo são diferentes
      ansible.builtin.assert:
        that: hash_legado != hash_novo
        fail_msg: files/playbook_legado.yml e files/playbook_novo.yml estão iguais; nada a substituir.
        quiet: true

    # ------------------------- 1) levantar os projetos -------------------------
    - name: Listar projetos - página 1
      ansible.builtin.uri:
        url: "{{ url_listagem }}&page=1"
        headers:
          Authorization: "Bearer {{ gitlab_token }}"
        validate_certs: "{{ validar_certs | bool }}"
        status_code: 200
      register: pagina_1

    - name: Validar paginação
      ansible.builtin.assert:
        that: pagina_1.x_total_pages is defined or (pagina_1.json | length) < 100
        fail_msg: A API não devolveu X-Total-Pages; não dá para garantir que todos os projetos foram listados.
        quiet: true

    - name: Listar projetos - demais páginas
      ansible.builtin.uri:
        url: "{{ url_listagem }}&page={{ item }}"
        headers:
          Authorization: "Bearer {{ gitlab_token }}"
        validate_certs: "{{ validar_certs | bool }}"
        status_code: 200
      loop: "{{ range(2, (pagina_1.x_total_pages | default(1) | int) + 1) | list }}"
      register: demais_paginas

    - name: Consolidar projetos (sem repositórios vazios)
      ansible.builtin.set_fact:
        projetos_alvo: >-
          {{ (pagina_1.json + (demais_paginas.results | map(attribute='json') | flatten))
             | unique(attribute='id')
             | rejectattr('default_branch', 'none')
             | sort(attribute='path_with_namespace')
             | list }}

    - name: Aplicar limite (piloto)
      ansible.builtin.set_fact:
        projetos_alvo: "{{ projetos_alvo if (limite | int) == 0 else projetos_alvo[:(limite | int)] }}"

    - name: Resumo do escopo
      ansible.builtin.debug:
        msg: >-
          {{ projetos_alvo | length }} projeto(s) a analisar.
          Modo: {{ 'APLICAR (' ~ modo ~ ')' if (aplicar | bool) else 'SIMULAÇÃO (nada será alterado)' }}.

    # ------------------------- 2) ler e comparar cada playbook -------------------------
    - name: Ler o playbook de cada projeto (branch padrão)
      ansible.builtin.uri:
        url: "{{ api }}/projects/{{ item.id }}/repository/files/{{ arquivo_alvo | regex_replace('/', '%2F') }}?ref={{ item.default_branch | regex_replace('/', '%2F') }}"
        headers:
          Authorization: "Bearer {{ gitlab_token }}"
        validate_certs: "{{ validar_certs | bool }}"
        status_code: [200, 404]
      failed_when: false
      loop: "{{ projetos_alvo }}"
      loop_control:
        label: "{{ item.path_with_namespace }}"
      register: arquivos

    - name: Inicializar tabela de hashes
      ansible.builtin.set_fact:
        info: {}

    - name: Calcular o hash do playbook de cada projeto
      ansible.builtin.set_fact:
        info: >-
          {{ info | combine({ (item.item.id | string): {
               'http': (item.status | default(0) | int),
               'commit': (item.json.last_commit_id | default('')),
               'sha': (((item.json.content | b64decode)
                        | regex_replace('^\\ufeff', '')
                        | regex_replace('\\r\\n?', '\\n')
                        | regex_replace('[ \\t]+$', '', multiline=True)
                        | regex_replace('\\s+\\Z', '')
                        | hash('sha256')) if (item.status | default(0) | int) == 200 else '')
             } }) }}
      loop: "{{ arquivos.results }}"
      loop_control:
        label: "{{ item.item.path_with_namespace }}"

    - name: Separar os projetos idênticos ao legado
      ansible.builtin.set_fact:
        ids_legado: "{{ info | dict2items | selectattr('value.sha', 'equalto', hash_legado) | map(attribute='key') | map('int') | list }}"

    - name: Lista final de projetos a substituir
      ansible.builtin.set_fact:
        alvos: "{{ projetos_alvo | selectattr('id', 'in', ids_legado) | list }}"

    - name: Resumo da comparação
      ansible.builtin.debug:
        msg: |-
          Analisados ................: {{ projetos_alvo | length }}
          Idênticos ao legado .......: {{ alvos | length }}   <- serão substituídos
          Já com o playbook novo ....: {{ info.values() | selectattr('sha', 'equalto', hash_novo) | list | length }}
          Sem {{ arquivo_alvo }} ....: {{ info.values() | selectattr('http', 'equalto', 404) | list | length }}
          Erro de leitura ...........: {{ info.values() | rejectattr('http', 'in', [200, 404]) | list | length }}
          Diferentes (preservados) ..: {{ (projetos_alvo | length) - (alvos | length) - (info.values() | selectattr('sha', 'equalto', hash_novo) | list | length) - (info.values() | selectattr('http', 'equalto', 404) | list | length) - (info.values() | rejectattr('http', 'in', [200, 404]) | list | length) }}

    # ------------------------- 3) aplicar -------------------------
    - name: Substituir via commit na branch padrão
      ansible.builtin.uri:
        url: "{{ api }}/projects/{{ item.id }}/repository/files/{{ arquivo_alvo | regex_replace('/', '%2F') }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ gitlab_token }}"
        body_format: json
        body:
          branch: "{{ item.default_branch }}"
          content: "{{ lookup('file', arquivo_novo) | trim }}{{ nl }}"
          commit_message: "{{ commit_message }}{{ ' [skip ci]' if (pular_ci | bool) else '' }}"
          author_name: "{{ git_username }}"
          author_email: "{{ git_email }}"
          last_commit_id: "{{ info[item.id | string].commit }}"
        validate_certs: "{{ validar_certs | bool }}"
        status_code: 200
      failed_when: false
      loop: "{{ alvos if ((aplicar | bool) and modo == 'commit') else [] }}"
      loop_control:
        label: "{{ item.path_with_namespace }}"
      register: commit_resp

    - name: Substituir em nova branch (start_branch cria a branch a partir da padrão)
      ansible.builtin.uri:
        url: "{{ api }}/projects/{{ item.id }}/repository/files/{{ arquivo_alvo | regex_replace('/', '%2F') }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ gitlab_token }}"
        body_format: json
        body:
          branch: "{{ branch_mr }}"
          start_branch: "{{ item.default_branch }}"
          content: "{{ lookup('file', arquivo_novo) | trim }}{{ nl }}"
          commit_message: "{{ commit_message }}{{ ' [skip ci]' if (pular_ci | bool) else '' }}"
          author_name: "{{ git_username }}"
          author_email: "{{ git_email }}"
          last_commit_id: "{{ info[item.id | string].commit }}"
        validate_certs: "{{ validar_certs | bool }}"
        status_code: 200
      failed_when: false
      loop: "{{ alvos if ((aplicar | bool) and modo == 'mr') else [] }}"
      loop_control:
        label: "{{ item.path_with_namespace }}"
      register: branch_resp

    - name: Definir projetos com branch criada
      ansible.builtin.set_fact:
        ids_branch_ok: "{{ branch_resp.results | selectattr('status', 'equalto', 200) | map(attribute='item.id') | list }}"

    - name: Criar Merge Request
      ansible.builtin.uri:
        url: "{{ api }}/projects/{{ item.id }}/merge_requests"
        method: POST
        headers:
          Authorization: "Bearer {{ gitlab_token }}"
        body_format: json
        body:
          source_branch: "{{ branch_mr }}"
          target_branch: "{{ item.default_branch }}"
          title: "{{ mr_titulo }}"
          description: "{{ mr_descricao }}"
          remove_source_branch: true
        validate_certs: "{{ validar_certs | bool }}"
        status_code: 201
      failed_when: false
      loop: "{{ alvos | selectattr('id', 'in', ids_branch_ok) | list }}"
      loop_control:
        label: "{{ item.path_with_namespace }}"
      register: mr_resp

    # ------------------------- 4) relatório -------------------------
    - name: Inicializar resultados
      ansible.builtin.set_fact:
        resultado: {}

    - name: Registrar resultado do commit / branch
      ansible.builtin.set_fact:
        resultado: >-
          {{ resultado | combine({ (item.item.id | string): {
               'resultado': (('SUBSTITUIDO' if modo == 'commit' else 'BRANCH_CRIADA') if (item.status | default(0) | int) == 200 else 'ERRO'),
               'mr_url': '',
               'detalhe': ('' if (item.status | default(0) | int) == 200
                           else ((item.json.message | default(item.msg | default(''))) | string | replace('{', '(') | replace('}', ')')))
             } }) }}
      loop: "{{ commit_resp.results + branch_resp.results }}"
      loop_control:
        label: "{{ item.item.path_with_namespace }}"

    - name: Registrar resultado do Merge Request
      ansible.builtin.set_fact:
        resultado: >-
          {{ resultado | combine({ (item.item.id | string): {
               'resultado': ('MR_CRIADO' if (item.status | default(0) | int) == 201 else 'ERRO'),
               'mr_url': (item.json.web_url | default('') if (item.status | default(0) | int) == 201 else ''),
               'detalhe': ('' if (item.status | default(0) | int) == 201
                           else ((item.json.message | default(item.msg | default(''))) | string | replace('{', '(') | replace('}', ')')))
             } }) }}
      loop: "{{ mr_resp.results }}"
      loop_control:
        label: "{{ item.item.path_with_namespace }}"

    - name: Gravar relatório CSV
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/relatorio_{{ 'aplicado' if (aplicar | bool) else 'simulacao' }}_{{ now(fmt='%Y%m%d_%H%M%S') }}.csv"
        mode: "0644"
        content: |-
          projeto;id;branch;estado;resultado;mr_url;detalhe
          {% for p in projetos_alvo -%}
          {% set i = info[p.id | string] -%}
          {% set e = 'ERRO_LEITURA' if i.http not in [200, 404] else ('SEM_PLAYBOOK' if i.http == 404 else ('IGUAL_AO_LEGADO' if i.sha == hash_legado else ('JA_ATUALIZADO' if i.sha == hash_novo else 'DIFERENTE_DO_LEGADO'))) -%}
          {% set r = resultado[p.id | string] | default({}) -%}
          {{ p.path_with_namespace }};{{ p.id }};{{ p.default_branch }};{{ e }};{{ r.resultado | default('A_SUBSTITUIR' if (e == 'IGUAL_AO_LEGADO' and not (aplicar | bool)) else '') }};{{ r.mr_url | default('') }};{{ r.detalhe | default('') | replace(';', ',') | replace('\n', ' ') }}
          {% endfor %}
      register: relatorio

    - name: Resultado final
      ansible.builtin.debug:
        msg: >-
          {{ 'Simulação concluída: nada foi alterado.' if not (aplicar | bool)
             else (resultado.values() | rejectattr('resultado', 'equalto', 'ERRO') | list | length) ~ ' projeto(s) processado(s) com sucesso, '
                  ~ (resultado.values() | selectattr('resultado', 'equalto', 'ERRO') | list | length) ~ ' com erro.' }}
          Relatório: {{ relatorio.dest }}

    - name: Falhar se algum projeto deu erro
      ansible.builtin.fail:
        msg: Houve projetos com ERRO (leitura ou escrita). Veja o relatório {{ relatorio.dest }}.
      when: >-
        (resultado.values() | selectattr('resultado', 'equalto', 'ERRO') | list | length) > 0
        or (info.values() | rejectattr('http', 'in', [200, 404]) | list | length) > 0
