#Método 2
## Self-Healing EDA — Método COMPLIANT Red Hat (Event Stream / AAP 2.5)

**Tipo:** Automação de Infra (Event-Driven Ansible no AAP 2.5+). Não é app web/mobile.

### Decisão: Event Stream (push durável) em vez de busca ativa
- **Compliant e suportado pela Red Hat** (doc oficial "Simplified Event Routing", AAP 2.5) + add-on oficial `ansible/splunk-eda-ta`.
- **Push, não polling.** O Splunk empurra o evento pro endpoint do Event Stream (com token/HMAC), com retry e autenticação nativos.
- **Descarta:** o source plugin Python custom e a busca ativa via REST 8089 (aquilo era não suportado).

### Mudança de premissa que você PRECISA aceitar
- O analista **não entrega só macro + token**. Ele precisa:
  1. Instalar/usar o **Splunk EDA Technical Add-on (TA)**.
  2. Configurar uma **alert action** (Custom Alert Action / Ansible Adaptive Response / Ansible Episode Action-ITSI) apontando pra **SUA URL do Event Stream**, usando o **token que o AAP gera**.
- **A macro dele continua sendo usada** — como o *search* do alerta agendado que dispara o push. Ele não precisa mudar a lógica de detecção, só o "para onde manda".
- **Inversão de papéis:** quem gera o token agora é o **AAP**, e **você entrega URL+token pro analista** (antes era o contrário).

---

### Arquitetura final
```
Splunk (macro do analista -> alerta) 
   --alert action (Splunk EDA TA, POST autenticado)-->
AAP Event Stream (URL + Token, durável/retry)
   --overlay no source da Rulebook Activation-->
Rulebook (suas rules) --> Workflow/Job Templates (self-healing)
```

---

### PASSO 1 — Rulebook (só o bloco `sources` muda)
As **rules permanecem idênticas** às que já te entreguei (todas com `throttle` por `episodeId`). Mantém o source como `webhook` no rulebook; no AAP o Event Stream faz o *overlay* desse source na ativação.

```yaml
---
- name: Regras para servidores Linux
  hosts: EDA

  # =====================================================================
  # SOURCE COMPLIANT (Event Stream / push)
  # No rulebook mantemos um webhook. Na Rulebook Activation do AAP voce
  # ANEXA o Event Stream, que SUBSTITUI (overlay) este source pelo
  # endpoint gerenciado/durável do AAP. NAO precisa de plugin Python.
  # =====================================================================
  sources:
    - name: splunk_event_stream            # nome usado no mapeamento do Event Stream
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5001
        # token/hmac ficam a cargo do Event Stream do AAP (nao hardcode aqui)

  rules:
    # >>> MANTENHA AQUI EXATAMENTE as 16 rules que te passei,
    #     cada uma com o bloco:
    #        throttle:
    #          once_within: 10 minutes
    #          group_by_attributes:
    #            - event.payload.episodeId
    #     O 'throttle' continua importante: no push o Splunk pode
    #     reenviar o mesmo alerta em ciclos, e o dedup por episodeId evita
    #     disparar o self-healing repetido dentro da janela.
    #
    # (NBA, /var Lapa, /var Campinas, /var Mackenzie, /opt/agent Brux,
    #  Tenable x3, CrowdStrike x3, Guardicore x3, e os 3 Fallbacks)
```

> O JSON que o Splunk TA envia cai em `event.payload.*`, então seus campos (`alertTitle, entityOS, diskPath, entityLocation, entityName, entityIC, episodeId`) continuam funcionando **desde que a macro/alerta do analista devolva esses nomes de campo**.

---

### PASSO 2 — Configurar no AAP 2.5 (lado seu)
Tudo em **Automation Decisions**:
1. **Credential:** Infrastructure > Credentials > Create credential → tipo **Token Event Stream** (ou **HMAC Event Stream** se preferir assinatura). Gere/defina o segredo.
2. **Event Stream:** Event Streams > Create event stream → tipo igual ao da credential → selecione a credential. Salve e **copie a URL gerada** (algo como `https://<aap-gateway>/eda-event-streams/api/eda/v1/external_event_stream/<uuid>/post/`).
3. **Projeto + Rulebook:** aponte o Project pro seu repo com o rulebook.
4. **Rulebook Activation:** Rulebook Activations > Create → selecione Project + rulebook → na seção de Event Streams, **anexe o Event Stream e mapeie ao source `splunk_event_stream`** (isso faz o overlay do webhook).
5. **Teste seguro:** deixe **"Forward events to rulebook activation" desligado** primeiro, dispare um evento e valide headers/payload sem acionar as rules. Depois ligue.

### PASSO 3 — Entregar pro analista Splunk (lado dele)
- **Instalar o Splunk EDA TA** (`ansible/splunk-eda-ta`, também no Splunkbase).
- Você fornece: **URL do Event Stream + Token** (e, se HMAC, o segredo compartilhado).
- Ele cria a **alert action** (Custom Alert Action / Adaptive Response / Episode Action-ITSI) no alerta que roda a **macro dele**, apontando pra sua URL com o token.
- **Content-Type: application/json.**
- Confirmar que o **payload JSON** traz os campos com os nomes que o rulebook lê. Se divergir, ele ajusta no SPL (`| rename ... as ...`).

### PASSO 4 — Validação antes de prod
- Dispare o alerta no Splunk em homologação e cheque no AAP se o Event Stream recebeu (contador/headers/payload).
- Ligue o forward e valide que a rule certa casou e chamou o Workflow certo.
- Force alerta repetido e confirme que o `throttle` (episodeId) segura a 2ª execução na janela.
- Teste autenticação negativa (token errado) e confirme rejeição.

### Notas de compliance / segurança
- **Gateway AAP 2.5+ só aceita OAuth token** (não basic auth) — use Token ou HMAC Event Stream.
- Token/segredo ficam no **Credential do AAP**, nunca no rulebook.
- Ganhos vs busca ativa: **retry, autenticação, endpoint gerenciado e suporte oficial** — resolve o teu problema original de "perda de eventos" de forma suportada.

### Assumções
- AAP 2.5 com Gateway (você confirmou 2.5+).
- Analista topa instalar/configurar o Splunk EDA TA (necessário — não tem como ser 100% compliant só com macro+token de polling).
- As 16 rules permanecem as já validadas, apenas com `throttle` de dedup.

### Aberto pra você decidir
- **Token Event Stream** (mais simples) x **HMAC Event Stream** (assinatura do payload, mais robusto). Recomendo HMAC se o Splunk atravessa rede menos confiável.