## Self-Healing EDA — Migração de Webhook (push) para Busca Ativa (polling no Splunk)

**Tipo:** Automação de Infra (Ansible / Event-Driven Ansible no AAP 2.5+). Não é app web/mobile.

### O que muda (resumo honesto)
- Hoje: `ansible.eda.webhook` = Splunk empurra o alerta. Padrão recomendado pela Red Hat.
- Novo pedido: EDA consulta o índice do Splunk via macro + token (REST API 8089) a cada 1 min = **busca ativa (scraper)**.
- **Não existe source nativo de polling do Splunk na Red Hat.** Precisa de **source plugin custom em Python**.
- **Aviso registrado:** busca ativa NÃO resolve "perda de eventos" melhor que webhook (ambos são in-memory; reinício da activation perde a janela em voo). Quem resolve isso de verdade no AAP 2.5 é **Event Stream** ou **Kafka**. Seguimos com busca ativa por decisão operacional (analista só entrega macro+token).

### Decisões travadas (suas respostas)
- Ambiente: AAP 2.5+ (usar Rulebook Activation + credencial pro token).
- Token: REST API do Splunk (Bearer), endpoint `search/jobs`.
- Intervalo: 60s. Rede até 8089 assumida OK.
- Dedup: `episode_id` é único/estável → chave de dedup. Remediação repetida (ex: limpar /var 2x) é aceitável, mas mesmo assim vamos deduplicar pra não spammar.

---

### Edge cases que você PRECISA tratar (já resolvidos no rulebook abaixo)
1. **Nomes de campo:** o search do Splunk tem que devolver os campos EXATAMENTE como o rulebook lê: `alertTitle, entityOS, diskPath, entityLocation, entityName, entityIC, episodeId`. Se no índice tiverem outro nome, renomeie no SPL (`| rename x as entityIC`).
2. **Gap de borda:** poll a cada 60s mas buscar `earliest=-90s` (janela maior que o intervalo) pra não perder evento na virada. O overlap gera duplicatas → resolvidas pelo `throttle`.
3. **Dedup:** `throttle: once_within` + `group_by_attributes: [event.payload.episodeId]` em toda rule. Evita disparar o mesmo self-healing repetido dentro da janela.
4. **Reinício da activation:** `throttle` também é in-memory → após restart pode haver 1 duplicata. Você disse que re-limpar /var é aceitável, então OK.
5. **SSL 8089:** normalmente cert self-signed → parametrizei `verify_ssl` (comece `false`, ideal apontar `cafile`).
6. **Token expira/rotaciona:** guarde como *credential* no AAP, não em texto puro no rulebook.
7. **Fuso/tempo:** `earliest/latest` usam o horário do servidor Splunk. Confirme com o analista.
8. **Volume:** se a macro retornar muitos eventos por ciclo, use search job normal com paginação (não `oneshot`).

---

### PASSO 1 — Source plugin custom (arquivo Python)
Coloque no projeto do AAP em: `extensions/eda/plugins/event_source/splunk_search.py`

```python
"""
Source plugin custom: BUSCA ATIVA no Splunk via REST API (search/jobs).
Roda a macro que o analista te passar, a cada <interval> segundos,
e joga cada resultado na fila do EDA como event.payload.*

Requisitos: aiohttp instalado no EE (Execution Environment).
"""
import asyncio
from typing import Any
import aiohttp

async def main(queue: asyncio.Queue, args: dict[str, Any]) -> None:
    host       = args["host"]                       # ex: splunk.suaempresa.com
    port       = int(args.get("port", 8089))        # REST API
    token      = args["token"]                      # Bearer da REST API (via credential)
    macro      = args["macro"]                      # macro que o analista passar (sem crases)
    interval   = int(args.get("interval", 60))      # 60s
    lookback   = args.get("lookback", "-90s")       # janela > intervalo (evita gap)
    verify_ssl = bool(args.get("verify_ssl", False))

    base    = f"https://{host}:{port}"
    headers = {"Authorization": f"Bearer {token}"}
    # A macro é invocada com crases. Garanta que ela devolve os campos
    # alertTitle, entityOS, diskPath, entityLocation, entityName, entityIC, episodeId
    spl = f"search `{macro}` earliest={lookback} latest=now"

    while True:
        try:
            async with aiohttp.ClientSession(headers=headers) as sess:
                data = {"search": spl, "output_mode": "json", "exec_mode": "oneshot"}
                async with sess.post(f"{base}/services/search/jobs",
                                     data=data, ssl=verify_ssl) as resp:
                    resp.raise_for_status()
                    body = await resp.json()
            for row in body.get("results", []):
                await queue.put({"payload": row})   # vira event.payload no rulebook
        except Exception as e:
            # loga e segue; nao deixa a main morrer (isso pararia o rulebook)
            print(f"[splunk_search] erro no ciclo: {e}")
        await asyncio.sleep(interval)
```

