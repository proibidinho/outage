- name: Regras para servidores Linux
  hosts: EDA

  # =====================================================================
  # FONTE: BUSCA ATIVA (polling) no Splunk via REST API 8089
  # Antes era ansible.eda.webhook (push). Agora o EDA vai buscar sozinho.
  # >>> PREENCHER host / port / token(credential) / macro <<<
  # =====================================================================
  sources:
    - name: splunk_busca_ativa
      # caminho do plugin custom: extensions/eda/plugins/event_source/splunk_search.py
      ansible.eda.splunk_search:          # <-- ajuste p/ o namespace/coleção onde você publicar o plugin
        host: "{{ SPLUNK_HOST }}"         # ex: splunk.suaempresa.com
        port: 8089                        # REST API do Splunk
        token: "{{ SPLUNK_REST_TOKEN }}"  # Bearer -> usar CREDENTIAL do AAP, nao hardcode
        macro: "{{ SPLUNK_MACRO }}"       # macro que o analista te passar (sem crases)
        interval: 60                      # de quanto em quanto tempo busca (segundos)
        lookback: "-90s"                  # janela MAIOR que interval p/ nao perder evento na borda
        verify_ssl: false                 # ideal: apontar cafile e ligar validacao

  rules:

    # ---- DEDUP GLOBAL: cada rule usa episode_id como chave -------------
    # 'once_within' = nao redispara o mesmo episodeId dentro da janela.
    # Ajuste a janela conforme quanto tempo o alerta persiste no indice.

