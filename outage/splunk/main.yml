### PASSO 3 — Configurar no AAP 2.5+
1. **Credential:** crie um Credential (tipo custom/secret) guardando o token da REST API → injete como `SPLUNK_REST_TOKEN`. Não deixe o token no rulebook.
2. **EE (Execution Environment):** garanta `aiohttp` instalado no EE usado pela activation (o source custom depende dele).
3. **Projeto:** commit do `splunk_search.py` em `extensions/eda/plugins/event_source/` + o rulebook.
4. **Decision Environment / Rulebook Activation:** aponte pro rulebook, defina as variáveis `SPLUNK_HOST`, `SPLUNK_MACRO`, e amarre o Credential.
5. **Pede pro analista:** a macro DEVE devolver os campos com os nomes que o rulebook lê (`alertTitle, entityOS, diskPath, entityLocation, entityName, entityIC, episodeId`). Confirme fuso de `earliest/latest`.

### PASSO 4 — Testes antes de ligar em prod
- Rode a macro manual no Splunk e cheque os nomes dos campos no JSON.
- Teste o source isolado com `ansible-rulebook -r rulebook.yml -i inventory --verbose` (fora do AAP) num índice de homologação.
- Force um alerta repetido e valide que o `throttle` segura a 2ª execução dentro da janela.
- Simule reinício da activation e confirme comportamento (pode gerar 1 duplicata — aceitável no seu caso).

### Assumções
- Rede EDA→Splunk:8089 liberada (você disse "entenda como se chegasse").
- `oneshot` search aguenta o volume; se não, migrar pra search job com paginação.
- Você mantém o `fallback-splunk` como está; só confirme a interação fallback x rule específica sob polling.

### Recomendação que fica na mesa (não obrigatória)
Se o objetivo real for **não perder evento**, o caminho certo no AAP 2.5 é **Event Stream (push durável)** ou **Kafka**, não polling custom. Considere isso numa fase 2.





