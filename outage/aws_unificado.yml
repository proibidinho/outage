--- FILE: ./aw/playbooks/sync_aws_cmdb.yml
# =============================================================================
# Playbook: Sincronizacao AWS (via AAP) -> Jira Assets (CMDB)
# =============================================================================
# Uso:
#   ansible-playbook playbooks/sync_aws_cmdb.yml -e "sync_mode=full"
#   ansible-playbook playbooks/sync_aws_cmdb.yml -e "dry_run=true"
# =============================================================================
---
- name: Sincronizacao AWS (via AAP) -> Jira Assets CMDB
  hosts: localhost
  connection: local
  gather_facts: true

  pre_tasks:
    - name: Incluir variaveis do role
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "{{ playbook_dir }}/../roles/integration_assets_aws/vars/main.yml"
        - "{{ playbook_dir }}/../roles/integration_assets_aws/vars/modelo_servidor_map_aws.yml"

    - name: Definir modo de sincronizacao
      ansible.builtin.set_fact:
        _sync_mode: "{{ sync_mode | default('full') }}"
        _enable_deactivation: "{{ enable_deactivation | default(false) }}"
        _dry_run: "{{ dry_run | default(false) | bool }}"

    - name: Verificar credenciais Jira
      ansible.builtin.assert:
        that:
          - jira_user is defined and jira_user | length > 0
          - jira_password is defined and jira_password | length > 0
        fail_msg: "Defina JIRA_USER e JIRA_PASSWORD"

    - name: Exibir configuracao
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════════════"
          - "          SINCRONIZACAO AWS (AAP) -> JIRA ASSETS (CMDB)"
          - "════════════════════════════════════════════════════════════════"
          - "AAP Host: {{ aap_host }}"
          - "Inventario ID: {{ aap_inventory_id }}"
          - "Modo: {{ _sync_mode }} | Dry Run: {{ _dry_run }}"
          - "Modelos mapeados: {{ modelo_servidor_map | length }}"
          - "VM Specs mapeados: {{ aws_vm_specs | length }}"
          - "════════════════════════════════════════════════════════════════"

  roles:
    - role: integration_assets_aws
      vars:
        sync_mode: "{{ _sync_mode }}"
        enable_deactivation: "{{ _enable_deactivation }}"
        dry_run: "{{ _dry_run }}"
        modelo_servidor_map: "{{ modelo_servidor_map }}"
        aws_vm_specs: "{{ aws_vm_specs }}"
        owner_ids: "{{ owner_ids }}"

  post_tasks:
    - name: Resumo final
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════════════"
          - "                    SINCRONIZACAO FINALIZADA"
          - "════════════════════════════════════════════════════════════════"
          - "Timestamp: {{ ansible_date_time.iso8601 }}"
--- FILE: ./aw/playbooks/sync_single_aws.yml
# =============================================================================
# Playbook: Testar sincronizacao AWS com servidores selecionados
# =============================================================================
# Uso:
#   ansible-playbook playbooks/sync_single_aws.yml \
#     -e '{"test_servers": ["i-abc.sa-east-1.compute.internal"]}'
#
#   ansible-playbook playbooks/sync_single_aws.yml -e "test_limit=5"
#
#   ansible-playbook playbooks/sync_single_aws.yml \
#     -e "test_limit=5" \
#     -e "dry_run=true"
# =============================================================================
---
- name: Testar sincronizacao AWS com servidores selecionados
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    test_servers: []
    test_limit: 0
    dry_run: false

  pre_tasks:
    - name: Incluir variaveis do role
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop:
        - "{{ playbook_dir }}/../roles/integration_assets_aws/vars/main.yml"
        - "{{ playbook_dir }}/../roles/integration_assets_aws/vars/mapeamento_aws_cmdb.yml"
        - "{{ playbook_dir }}/../roles/integration_assets_aws/vars/modelo_servidor_map_aws.yml"

    - name: Verificar credenciais Jira
      ansible.builtin.assert:
        that:
          - jira_user is defined and jira_user | length > 0
          - jira_password is defined and jira_password | length > 0
        fail_msg: "Defina JIRA_USER e JIRA_PASSWORD"

    - name: Verificar parametros
      ansible.builtin.assert:
        that:
          - test_servers | length > 0 or test_limit | int > 0
        fail_msg: "Defina test_servers (lista) ou test_limit (numero)"

    - name: Exibir configuracao
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════════════"
          - "          TESTE: SINCRONIZACAO AWS → JIRA ASSETS"
          - "════════════════════════════════════════════════════════════════"
          - "Servidores: {{ test_servers if test_servers | length > 0 else 'primeiros ' ~ test_limit }}"
          - "Dry Run: {{ dry_run }}"
          - "Modelos mapeados: {{ modelo_servidor_map | length }}"
          - "VM Specs mapeados: {{ aws_vm_specs | length }}"
          - "Owner IDs: prod_linux={{ owner_ids.prod_linux | default('') }} | prod_windows={{ owner_ids.prod_windows | default('') }}"
          - "════════════════════════════════════════════════════════════════"

  tasks:
    # =========================================================================
    # FASE 1: Buscar hosts do AAP
    # =========================================================================
    - name: Buscar hosts do AAP
      ansible.builtin.uri:
        url: "{{ aap_host }}/api/controller/v2/inventories/{{ aap_inventory_id }}/hosts/?page_size=500"
        method: GET
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: "{{ aap_verify_ssl | default(false) }}"
        return_content: yes
      register: aap_hosts

    - name: Transformar todos os hosts (batch - com skip EKS + ef_cmdb + Modelo do Servidor)
      ansible.builtin.set_fact:
        all_cloud_data: >-
          {{ aap_hosts.json.results | batch_transform_aws_hosts(
               modelo_servidor_map | default({}),
               aws_vm_specs        | default({}),
               owner_ids           | default({})
             ) }}

    - name: "Log - hosts ignorados (EKS + sem ef_cmdb + desabilitados + invalidos)"
      ansible.builtin.debug:
        msg: "Hosts do AAP: {{ aap_hosts.json.results | length }} | Elegiveis para sync: {{ all_cloud_data | length }} | Ignorados: {{ aap_hosts.json.results | length - all_cloud_data | length }}"

    # =========================================================================
    # SELECAO
    # =========================================================================
    - name: Selecionar por lista de nomes
      ansible.builtin.set_fact:
        selected_servers: "{{ all_cloud_data | selectattr('name_cloud', 'in', test_servers) | list }}"
      when: test_servers | length > 0

    - name: Selecionar por limite
      ansible.builtin.set_fact:
        selected_servers: "{{ all_cloud_data[:test_limit | int] }}"
      when: test_limit | int > 0 and test_servers | length == 0

    - name: Resumo dos servidores selecionados
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════════════"
          - "                 {{ selected_servers | length }} SERVIDORES SELECIONADOS"
          - "════════════════════════════════════════════════════════════════"
          - "{% for s in selected_servers %}{{ s.name_cloud }} ({{ s.modelo_servidor_cloud | default('N/A') }}, {{ s.sistema_operacional_cloud }})\n{% endfor %}"

    - name: Exibir cloud_data de cada servidor
      ansible.builtin.debug:
        msg: "{{ item | to_nice_yaml }}"
      loop: "{{ selected_servers }}"
      loop_control:
        label: "{{ item.name_cloud }}"

    - name: Parar se dry_run
      ansible.builtin.meta: end_play
      when: dry_run | bool

    # =========================================================================
    # EXECUCAO REAL
    # =========================================================================
    - name: Inicializar logs
      ansible.builtin.set_fact:
        sync_log_create: []
        sync_log_skip: []
        sync_log_errors: []

    # -------------------------------------------------------------------------
    # CMDB - BUSCA DIRECIONADA PELOS Names SELECIONADOS
    #
    # Nao carregamos mais os 20.000+ objetos do CMDB. Consultamos somente os
    # Names dos servidores selecionados neste teste, em lotes de 200.
    #
    # A busca continua GLOBAL no Object Type 121, sem filtro de Datacenter,
    # para impedir CREATE quando o mesmo Name ja existir em qualquer origem.
    # -------------------------------------------------------------------------
    - name: Extrair Names selecionados para consulta no CMDB
      ansible.builtin.set_fact:
        cloud_server_names: >-
          {{
            selected_servers
            | map(attribute='name_cloud')
            | unique
            | list
          }}

    - name: Dividir Names em lotes de 200
      ansible.builtin.set_fact:
        cloud_server_name_batches: "{{ cloud_server_names | batch(200) | map('list') | list }}"

    - name: Buscar no CMDB somente os Names selecionados
      ansible.builtin.uri:
        url: "{{ jira_url }}/object/aql?startAt=0&maxResults=200"
        method: POST
        headers:
          Accept: "application/json"
          Content-Type: "application/json"
        force_basic_auth: yes
        user: "{{ jira_user }}"
        password: "{{ jira_password }}"
        body:
          qlQuery: 'objectTypeId = 121 AND Name IN ({{ item | map("to_json") | join(", ") }})'
        body_format: json
        status_code: [200]
        timeout: 60
      register: cmdb_name_batches_result
      environment: "{{ proxy_env | default({}) }}"
      loop: "{{ cloud_server_name_batches }}"
      loop_control:
        label: "Lote com {{ item | length }} Names"
      retries: 3
      delay: 5
      until: cmdb_name_batches_result.status == 200
      when: item | length > 0

    - name: Inicializar lista de Names encontrados no CMDB
      ansible.builtin.set_fact:
        cmdb_server_names: []

    - name: Consolidar Names encontrados no CMDB
      ansible.builtin.set_fact:
        cmdb_server_names: >-
          {{
            cmdb_server_names
            + (item.json['values'] | default([]) | map(attribute='label') | list)
          }}
      loop: "{{ cmdb_name_batches_result.results | default([]) }}"
      loop_control:
        label: "{{ item.json['values'] | default([]) | length }} Names encontrados"
      when:
        - not (item.skipped | default(false))
        - item.json is defined

    - name: Normalizar lista de Names encontrados no CMDB
      ansible.builtin.set_fact:
        cmdb_server_names: "{{ cmdb_server_names | unique | list }}"

    - name: Debug - Consulta direcionada por Name
      ansible.builtin.debug:
        msg:
          - "Names consultados: {{ cloud_server_names | length }}"
          - "Lotes AQL: {{ cloud_server_name_batches | length }}"
          - "Names ja existentes no CMDB: {{ cmdb_server_names | length }}"

    # -------------------------------------------------------------------------
    # CREATE / SKIP
    # -------------------------------------------------------------------------
    - name: Separar servidores a criar e existentes (skip)
      ansible.builtin.set_fact:
        servers_to_create: >-
          {{
            selected_servers
            | rejectattr('name_cloud', 'in', cmdb_server_names)
            | list
          }}

        servers_to_skip: >-
          {{
            selected_servers
            | selectattr('name_cloud', 'in', cmdb_server_names)
            | list
          }}

    - name: Resumo das acoes
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════════════"
          - "A CRIAR: {{ servers_to_create | length }}"
          - "{% for s in servers_to_create %}- {{ s.name_cloud }}\n{% endfor %}"
          - "EXISTENTES (skip): {{ servers_to_skip | length }}"
          - "{% for s in servers_to_skip %}- {{ s.name_cloud }} (preservando dados manuais)\n{% endfor %}"
          - "════════════════════════════════════════════════════════════════"

    # -------------------------------------------------------------------------
    # CREATE
    # -------------------------------------------------------------------------
    - name: Criar servidores
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/integration_assets_aws/tasks/create.yml"
      vars:
        current_cloud_data: "{{ item }}"
      loop: "{{ servers_to_create }}"
      loop_control:
        label: "{{ item.name_cloud }}"
      when: servers_to_create | length > 0

    # -------------------------------------------------------------------------
    # SKIP
    # -------------------------------------------------------------------------
    - name: Registrar servidores existentes (skip)
      ansible.builtin.set_fact:
        sync_log_skip: "{{ sync_log_skip + [item.name_cloud] }}"
      loop: "{{ servers_to_skip }}"
      loop_control:
        label: "{{ item.name_cloud }}"
      when: servers_to_skip | length > 0

    # -------------------------------------------------------------------------
    # RESULTADO
    # -------------------------------------------------------------------------
    - name: Resultado final
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════════════"
          - "                    TESTE CONCLUIDO"
          - "════════════════════════════════════════════════════════════════"
          - "Selecionados: {{ selected_servers | length }}"
          - "Criados: {{ sync_log_create | length }}"
          - "Existentes (skip): {{ sync_log_skip | length }}"
          - "Erros: {{ sync_log_errors | length }}"
          - "════════════════════════════════════════════════════════════════"

--- FILE: ./aw/roles/integration_assets_aws/filter_plugins/aws_cmdb_filters.py
# =============================================================================
# Filter Plugin: Transformação AWS → Jira Assets
# =============================================================================

from __future__ import absolute_import, division, print_function
__metaclass__ = type

import json
from typing import Dict, List, Optional


def search_attribute(value: str, object_attribute_map: List[Dict]) -> List[Dict]:
    """Busca um atributo no mapeamento pela chave_cloud."""
    return list(filter(lambda x: x.get("chave_cloud") == value, object_attribute_map))


def map_aws_status_to_cmdb(aws_state: str) -> str:
    """Mapeia o status da AWS para o status do CMDB."""
    status_map = {
        "running": "Em uso",
        "pending": "Reservado",
        "stopping": "Desativado",
        "stopped": "Desativado",
        "shutting-down": "Desativado",
        "terminated": "Desativado",
    }
    return status_map.get(aws_state.lower() if aws_state else "", "Em uso")


def extract_os_from_platform(platform: str) -> str:
    """Extrai o sistema operacional a partir do campo platform da AWS."""
    if not platform:
        return "Linux"

    platform_lower = platform.lower()
    if "windows" in platform_lower:
        return "Windows"

    return "Linux"


def is_eks_node(variables: Dict) -> bool:
    """
    Detecta se a instancia pertence a um cluster EKS.

    Fonte de verdade:
      - aws:eks:cluster-name
      - eks:cluster-name
      - eks:nodegroup-name
      - kubernetes.io/cluster/*
      - aws:autoscaling:groupName iniciado por eks-

    Nao utilizar IAM Instance Profile como criterio,
    pois existem EC2s comuns usando profiles eks-*.
    """

    if not variables:
        return False

    tags = variables.get("tags") or {}

    if not isinstance(tags, dict):
        return False

    #
    # Tags explicitas de EKS
    #
    if tags.get("aws:eks:cluster-name"):
        return True

    if tags.get("eks:cluster-name"):
        return True

    if tags.get("eks:nodegroup-name"):
        return True

    #
    # kubernetes.io/cluster/*
    #
    for key in tags:
        if str(key).startswith("kubernetes.io/cluster/"):
            return True

    #
    # ASG de nodegroup EKS
    #
    asg_name = str(tags.get("aws:autoscaling:groupName", "")).strip()

    if asg_name.startswith("eks-"):
        return True

    return False


def determine_ambiente_aws(variables: Dict) -> Optional[str]:
    """
    Determina o Ambiente com base nas tags ou environment.
    """
    tags = variables.get("tags", {})
    ambiente_tag = (
        tags.get("ef_ambiente") or
        tags.get("environment") or
        tags.get("Environment") or
        variables.get("environment") or
        ""
    )

    ambiente_lower = str(ambiente_tag).strip().lower()
    
    #Desenvolvimento
    if ambiente_lower in ["dsv", "dev", "desenvolvimento"]:
        return "Desenvolvimento"
    
    #Homologacao
    if ambiente_lower in ["hom", "hml", "homologacao", "homologação"]:
        return "Homologação"
    
    #Sem informacao
    if not ambiente_lower or ambiente_lower == "undefined":
        return "Produção"

    #Producao
    if ambiente_lower in ["prod", "prd", "production", "producao", "produção"]:
        return "Produção"

    # ambiente_lower = ambiente_tag.lower()

    # # Não produção - retorna None para não preencher
    # if any(x in ambiente_lower for x in ["nonprod", "non-prod", "dev", "hml", "staging", "homolog", "qa", "test", "sandbox"]):
    #     return None

    return "Produção"


def transform_aws_host(host_data: Dict,
                       modelo_servidor_map: Optional[Dict] = None,
                       aws_vm_specs: Optional[Dict] = None,
                       owner_ids: Optional[Dict] = None) -> Dict:
    """
    Transforma os dados de um host AWS (do AAP) para o formato cloud_data.

    Args:
        host_data: dict com o host vindo do AAP (contem 'variables' string JSON).
        modelo_servidor_map: opcional - mapa {instance_type: object_key}.
        aws_vm_specs: opcional - mapa {instance_type: {cpu, memory_gb}}.
        owner_ids: opcional - dict com prod_linux / prod_windows / nao_producao.
    """
    # Parsear variables (pode ser string JSON ou dict)
    variables_str = host_data.get("variables", "{}")
    try:
        variables = json.loads(variables_str) if isinstance(variables_str, str) else variables_str
    except json.JSONDecodeError:
        variables = {}

    if not variables:
        return {}

    tags = variables.get("tags", {})

    # ------------------------------------------------------------------
    # Disaster Recovery (tag ef_recuperacao_de_desastre / ef_dr; fallback false)
    # ------------------------------------------------------------------
    dr_tag = tags.get("ef_recuperacao_de_desastre") or tags.get("ef_dr") or ""
    dr_bool = str(dr_tag).strip().lower() in ("true", "sim", "yes", "1", "s", "y")

    # Instance ID (usado como fallback final para o Name)
    instance_id = variables.get("instance_id", "")

    # FQDN = private_dns_name (ex.: i-0abc.sa-east-1.compute.internal).
    # Continua sendo o nome DNS interno da AWS, no campo FQDN do CMDB.
    fqdn = variables.get("private_dns_name", "").strip()

    # ------------------------------------------------------------------
    # NAME (shortname para o CMDB)
    # Prioridade: tag Name -> vm_name -> host.name (AAP) -> instance_id.
    # NAO usar private_dns_name aqui, senao Name fica igual ao FQDN.
    # ------------------------------------------------------------------
    # name = (
    #     tags.get("Name", "").strip()
    #     or variables.get("vm_name", "").strip()
    #     or host_data.get("name", "").strip()
    #     or instance_id
    # )
    #Abaixo seta o vm_name primeiro, com instance_id como fallback
    # name = (
    #     variables.get("vm_name", "").strip()
    #     or host_data.get("name", "").stirp()
    #     or instance_id
    # )
    #Setando o name como instance_id
    name = instance_id

    # Account ID (Conta Cloud)
    account_id = variables.get("account_id") or variables.get("owner_id", "")

    # IPs - filtrar valores vazios e "N/A"
    private_ip = variables.get("private_ip") or variables.get("private_ip_address", "")
    public_ip = variables.get("public_ip") or variables.get("public_ip_address", "")

    ips = []
    if private_ip and private_ip not in ("", "N/A", "n/a"):
        ips.append({"tipo": "privado", "ip": private_ip})
    if public_ip and public_ip not in ("", "N/A", "n/a"):
        ips.append({"tipo": "publico", "ip": public_ip})

    # CPU - calcular vCPUs a partir de cpu_options (fallback)
    cpu_options = variables.get("cpu_options", {})
    core_count = cpu_options.get("core_count", 0)
    threads_per_core = cpu_options.get("threads_per_core", 1)
    vcpus = core_count * threads_per_core if core_count else None

    # Instance Type (Modelo do Servidor)
    instance_type = variables.get("instance_type", "")

    # ------------------------------------------------------------------
    # CPU / Memoria via aws_vm_specs (reutiliza estrutura ja existente).
    # aws_vm_specs eh a fonte de verdade preferencial. Se o instance_type
    # nao estiver em aws_vm_specs, mantem-se o fallback:
    #   - CPU: cpu_options (comportamento historico)
    #   - Memoria: nao envia (mesmo padrao Azure)
    # ------------------------------------------------------------------
    cpu_count = vcpus
    memoria_ram_mb = None
    if instance_type and aws_vm_specs:
        vm_spec = aws_vm_specs.get(instance_type) or {}
        if vm_spec.get("cpu") is not None:
            cpu_count = vm_spec.get("cpu")
        if vm_spec.get("memory_gb") is not None:
            # memory_gb pode ser float (ex.: 3.75, 0.5). Arredondar para int.
            memoria_ram_mb = int(round(float(vm_spec.get("memory_gb")) * 1024))
    # ------------------------------------------------------------------

    # Status
    state = variables.get("state", "running")

    # Sistema Operacional
    platform = variables.get("platform") or variables.get("platform_details") or ""
    so_normalizado = extract_os_from_platform(platform)

    # Grupo Solucionador - Infra (fixo por SO)
    grupo_solucionador = "CLBR-TI-INFRA-SUPORTE-WINDOWS" if so_normalizado == "Windows" else "CLBR-TI-INFRA-CLOUD-PUBLIC"

    # Ambiente
    ambiente = determine_ambiente_aws(variables)

    # ------------------------------------------------------------------
    # OWNER: Ambiente + SO + owner_ids -> USR-<id>
    # ef_owner NAO participa desta logica (nem existe no filter AWS).
    # ------------------------------------------------------------------
    # owner_usr = None
    # if ambiente == "Produção" and owner_ids:
    #     if so_normalizado == "Linux":
    #         _oid = owner_ids.get("prod_linux")
    #     elif so_normalizado == "Windows":
    #         _oid = owner_ids.get("prod_windows")
    #     else:
    #         _oid = None
    #     if _oid:
    #         owner_usr = "USR-{}".format(_oid)
    
    owner_usr = None
    if owner_ids:
        if ambiente == "Produção":
            if so_normalizado == "Linux":
                _oid = owner_ids.get("prod_linux")
            elif so_normalizado == "Windows":
                _oid = owner_ids.get("prod_windows")
            else:
                _oid = None
        else:
            _oid = owner_ids.get("nao_producao")
        if _oid:
            owner_usr = "USR-{}".format(_oid)
    # ------------------------------------------------------------------

    # Sistema (CMDB) - vem da tag ef_cmdb (ex.: "GDA-2730753").
    sistema_cmdb = tags.get("ef_cmdb", "").strip()

    # Região / AZ (para debug)
    region = variables.get("region", "")
    availability_zone = variables.get("availability_zone", "")

    # Montar cloud_data
    cloud_data = {
        # Conta Cloud (Account ID da AWS)
        "conta_cloud_cloud": account_id if account_id else None,

        # Ambiente
        "ambiente_cloud": ambiente,

        # Sistema (Reference no CMDB - passa objectKey vindo da tag ef_cmdb)
        "sistema_cloud": sistema_cmdb if sistema_cmdb else None,

        # Identificação
        "name_cloud": name,                        # shortname (tag Name / vm_name / instance_id)
        "fqdn_cloud": fqdn if fqdn else "Não informado",      # DNS interno da AWS (private_dns_name)

        # Sistema Operacional
        "sistema_operacional_cloud": so_normalizado,

        # Hardware (prioridade: aws_vm_specs; fallback: cpu_options)
        "cpu_count_cloud": str(cpu_count) if cpu_count is not None else None,

        # Memoria (aws_vm_specs[instance_type].memory_gb * 1024, em Mb)
        "memoria_ram_cloud": memoria_ram_mb,

        # Owner (Ambiente + SO + owner_ids; USR-*)
        "owner_cloud": owner_usr,

        # Modelo do Servidor (instance_type -> objectKey via modelo_servidor_map)
        "modelo_servidor_cloud": (
            (modelo_servidor_map or {}).get(instance_type) or instance_type
        ) if instance_type else None,

        # Rede
        "interface_rede_cloud": ips if ips else None,

        # Status
        "status_cloud": map_aws_status_to_cmdb(state),

        # Discovery (fixo)
        "status_discovery_cloud": "Running",

        # Booleanos fixos
        "sox_cloud": "false",
        "ipe_cloud": "false",

        # Disaster Recovery (tag; fallback false)
        "disaster_recovery_cloud": dr_bool,

        # Tipo de Servidor (select)
        "tipo_servidor_cloud": "Cloud Pública",

        # Tipo de Infraestrutura (referência)
        "tipo_infraestrutura_cloud": "CLOUD PUBLICA",

        # Datacenter
        "datacenter_cloud": "AWS",

        # Fornecedor (mesmo valor do Datacenter)
        "fornecedor_cloud": "AWS",

        # Grupo Solucionador - Infra (fixo por SO)
        "grupo_solucionador_infra_cloud": grupo_solucionador,

        # Last User (sempre Ansible)
        "last_user_cloud": "Ansible",

        # Metadados AWS (prefixo _ = não enviados ao CMDB)
        "_aws_instance_id": instance_id,
        "_aws_instance_type": instance_type,
        "_aws_region": region,
        "_aws_availability_zone": availability_zone,
        "_aws_tags_name": tags.get("Name", ""),
    }

    # Remover valores None
    # (isso automaticamente descarta owner_cloud/memoria_ram_cloud quando None)
    cloud_data = {k: v for k, v in cloud_data.items() if v is not None}

    return cloud_data


def batch_transform_aws_hosts(hosts: List[Dict],
                              modelo_servidor_map: Optional[Dict] = None,
                              aws_vm_specs: Optional[Dict] = None,
                              owner_ids: Optional[Dict] = None) -> List[Dict]:
    """Transforma uma lista de hosts AWS (do AAP) para o formato cloud_data."""
    results = []

    for host in hosts:
        if not host.get("enabled", True):
            continue

        # Parse rapido de variables para checar se eh no EKS (skip antecipado)
        variables_str = host.get("variables", "{}")
        try:
            variables = json.loads(variables_str) if isinstance(variables_str, str) else variables_str
        except json.JSONDecodeError:
            variables = {}

        # Nos de cluster EKS - ignorados ate o time CMDB definir tratamento
        if is_eks_node(variables):
            continue

        # Sem tag ef_cmdb -> nao vai pro CMDB
        tags = variables.get("tags") or {}
        if not isinstance(tags, dict) or not str(tags.get("ef_cmdb", "")).strip():
            continue

        cloud_data = transform_aws_host(
            host,
            modelo_servidor_map=modelo_servidor_map,
            aws_vm_specs=aws_vm_specs,
            owner_ids=owner_ids,
        )

        if cloud_data.get("name_cloud"):
            results.append(cloud_data)

    return results


def update_asset(cloud_data: Dict, object_attribute_map: List[Dict]) -> Dict:
    """Transforma cloud_data no formato de payload para criar/atualizar no Jira Assets."""
    data = {
        "attributes": [],
        "objectTypeId": 121
    }

    for field, value in cloud_data.items():
        if value is None or value == "":
            continue

        # Campos de metadados (começam com _) não são enviados ao CMDB
        if field.startswith("_"):
            continue

        obj_attr_list = search_attribute(field, object_attribute_map)

        if not obj_attr_list:
            continue

        obj_attr = obj_attr_list[0]
        attr_type = obj_attr.get("tipo", "text")
        attr_id = str(obj_attr.get("id"))

        attribute_entry = {
            "objectTypeAttributeId": attr_id,
            "objectAttributeValues": []
        }

        if attr_type == "objeto":
            valores = obj_attr.get("valores", [])
            # Sem lista de "valores" no YAML -> envia o value direto (Jira aceita
            # objectKey/objectId em campos Reference). Ex.: Owner "USR-149372".
            if not valores:
                attribute_entry["objectAttributeValues"] = [{"value": str(value)}]
            else:
                matched = next((v for v in valores if v.get("value") == value), None)
                if matched:
                    attribute_entry["objectAttributeValues"] = [
                        {"value": str(matched.get("referencedType"))}
                    ]
                else:
                    # Valor não encontrado - skip
                    continue

        elif attr_type == "status":
            valores = obj_attr.get("valores", [])
            matched = next((v for v in valores if v.get("value") == value), None)
            if matched:
                attribute_entry["objectAttributeValues"] = [
                    {"value": str(matched.get("referencedType"))}
                ]
            else:
                continue

        elif attr_type == "objeto_lista":
            # Interface de Rede é tratada separadamente
            continue

        elif attr_type == "boolean":
            attribute_entry["objectAttributeValues"] = [{"value": str(value).lower()}]

        elif attr_type == "integer":
            attribute_entry["objectAttributeValues"] = [{"value": str(value)}]

        elif attr_type == "select":
            # Select com validação - se tiver lista de valores, só inclui se existir
            valores = obj_attr.get("valores", [])
            if valores:
                # Tem lista de valores - verificar se existe
                matched = next((v for v in valores if v.get("value") == value), None)
                if matched:
                    attribute_entry["objectAttributeValues"] = [{"value": str(value)}]
                else:
                    # Valor não existe na lista - skip
                    continue
            else:
                # Sem lista de valores definida - skip para evitar erro
                continue

        else:
            # text e outros
            attribute_entry["objectAttributeValues"] = [{"value": str(value)}]

        if attribute_entry["objectAttributeValues"]:
            data["attributes"].append(attribute_entry)

    return data


class FilterModule(object):
    """Ansible filter plugin para transformação AWS → Jira Assets."""

    def filters(self):
        return {
            'update_asset': update_asset,
            'transform_aws_host': transform_aws_host,
            'batch_transform_aws_hosts': batch_transform_aws_hosts,
            'map_aws_status_to_cmdb': map_aws_status_to_cmdb,
            'extract_os_from_platform': extract_os_from_platform,
            'determine_ambiente_aws': determine_ambiente_aws,
            'is_eks_node': is_eks_node,
            'search_attribute': search_attribute,
        }
--- FILE: ./aw/roles/integration_assets_aws/tasks/create.yml
# =============================================================================
# Task: Criar objeto no Jira Assets (AWS)
# =============================================================================
---
- name: Validar campos obrigatorios antes de criar
  ansible.builtin.assert:
    that:
      - current_cloud_data.name_cloud is defined
      - current_cloud_data.name_cloud | length > 0
    fail_msg: "name_cloud ausente - servidor NAO sera criado"
    quiet: true

- name: Inicializar lista de IDs de interface de rede
  ansible.builtin.set_fact:
    interface_rede_ids: []

- name: Verificar/Criar Interface de Rede (se necessario)
  ansible.builtin.include_tasks: manage_network_interface.yml
  loop: "{{ current_cloud_data.interface_rede_cloud | default([]) }}"
  loop_control:
    loop_var: ip_info
  when:
    - current_cloud_data.interface_rede_cloud is defined
    - current_cloud_data.interface_rede_cloud | length > 0

- name: Gerar payload base para criacao
  ansible.builtin.set_fact:
    data_create: "{{ current_cloud_data | update_asset(object_attribute_map) }}"

- name: Adicionar Interface de Rede ao payload
  ansible.builtin.set_fact:
    data_create: >-
      {{ data_create | combine({
           'attributes': data_create.attributes + [{
             'objectTypeAttributeId': '3528',
             'objectAttributeValues': interface_rede_ids | map('regex_replace', '^(.*)$', '{"value": "\1"}') | map('from_json') | list
           }]
         })
      }}
  when: interface_rede_ids | length > 0

- name: DEBUG - Payload final de criacao
  ansible.builtin.debug:
    msg: "{{ data_create | to_json }}"

- name: Criar objeto no Assets (com retry e sem abortar batch)
  ansible.builtin.uri:
    url: "{{ jira_url }}/object/create"
    method: POST
    force_basic_auth: yes
    headers:
      Content-Type: "application/json"
      Accept: "application/json"
    user: "{{ jira_user }}"
    password: "{{ jira_password }}"
    body: "{{ data_create | to_json }}"
    body_format: json
    return_content: yes
    status_code: [200, 201]
    timeout: 30
  register: resultado_create
  environment: "{{ proxy_env | default({}) }}"
  failed_when: false
  retries: 3
  delay: 5
  until: resultado_create.status in [200, 201]

- name: Registrar SUCESSO
  ansible.builtin.set_fact:
    sync_log_create: "{{ sync_log_create | default([]) + [current_cloud_data.name_cloud] }}"
  when: resultado_create.status in [200, 201]

- name: Registrar ERRO (nao aborta)
  ansible.builtin.set_fact:
    sync_log_errors: >-
      {{ sync_log_errors | default([]) + [{
           'name': current_cloud_data.name_cloud,
           'status': resultado_create.status | default('unknown'),
           'msg': (resultado_create.json | default(resultado_create.msg) | default('sem detalhe')) | string
         }] }}
  when: resultado_create.status not in [200, 201]

- name: Debug - Resultado
  ansible.builtin.debug:
    msg: >-
      {{ 'OK: ' ~ current_cloud_data.name_cloud ~ ' (ID: ' ~ (resultado_create.json.id | default('?')) ~ ')'
         if resultado_create.status in [200, 201]
         else 'ERRO: ' ~ current_cloud_data.name_cloud ~ ' status=' ~ (resultado_create.status | string) }}
--- FILE: ./aw/roles/integration_assets_aws/tasks/deactivate.yml
# =============================================================================
# Task: Desativar servidor no CMDB (VM não existe mais na AWS)
# =============================================================================
---
- name: Preparar payload para desativação
  ansible.builtin.set_fact:
    data_deactivate:
      objectTypeId: "{{ object_type_id_servidor }}"
      attributes:
      - objectTypeAttributeId: "2957" # Status
        objectAttributeValues:
        - value: "19" # Desativado

- name: Desativar servidor no Assets
  ansible.builtin.uri:
    url: "{{ jira_url }}/object/{{ server_to_deactivate.id }}"
    method: PUT
    force_basic_auth: yes
    headers:
      Content-Type: "application/json"
      Accept: "application/json"
    user: "{{ jira_user }}"
    password: "{{ jira_password }}"
    body: "{{ data_deactivate | to_json }}"
    body_format: json
    return_content: yes
    status_code: [ 200 ]
  register: resultado_deactivate
  environment: "{{ proxy_env | default({}) }}"

- name: Debug - Resultado da desativação
  ansible.builtin.debug:
    msg: "Servidor '{{ server_to_deactivate.label }}' desativado no CMDB. ID: {{ server_to_deactivate.id }}"

- name: Registrar desativação no log
  ansible.builtin.set_fact:
    sync_log_deactivate: "{{ sync_log_deactivate | default([]) + [server_to_deactivate.label] }}"

--- FILE: ./aw/roles/integration_assets_aws/tasks/fetch_all_hosts.yml
# =============================================================================
# Task: Coleta paginada de hosts do AAP (segue .next ate acabar)
# =============================================================================
# Entrada:  aap_host, aap_inventory_id, aap_token
# Saida:    aap_all_hosts (list) - todos os hosts do inventario
# =============================================================================
---
- name: Inicializar coleta paginada
  ansible.builtin.set_fact:
    aap_all_hosts: []
    aap_next_url: "{{ aap_host }}/api/controller/v2/inventories/{{ aap_inventory_id }}/hosts/?page_size=200"
    aap_page_num: 0

- name: Coletar paginas do AAP (loop com teto de seguranca)
  ansible.builtin.include_tasks: _fetch_one_page.yml
  loop: "{{ range(0, 200) | list }}"   # 200 paginas x 200 hosts = 40.000 (teto de seguranca)
  loop_control:
    loop_var: _page_iter
    label: "pagina {{ (aap_page_num | int) + 1 }}"
  when:
    - aap_next_url is not none
    - (aap_next_url | default('') | length) > 0

- name: Debug - Total consolidado
  ansible.builtin.debug:
    msg: "Total de hosts coletados do AAP: {{ aap_all_hosts | length }} em {{ aap_page_num }} pagina(s)"
--- FILE: ./aw/roles/integration_assets_aws/tasks/main.yml
---
- name: Incluir variaveis de mapeamento AWS
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/mapeamento_aws_cmdb.yml"

- name: Inicializar logs de sincronizacao
  ansible.builtin.set_fact:
    sync_log_create: []
    sync_log_skip: []
    sync_log_deactivate: []
    sync_log_reactivate: []
    sync_log_update: []
    sync_log_errors: []


# ---------------------------------------------------------------------------
# FASE 1: Coletar hosts do AAP (paginado)
# ---------------------------------------------------------------------------
- name: "FASE 1 - Coletar hosts do inventario AWS no AAP (paginado)"
  ansible.builtin.debug:
    msg: "════════════════════════════════════════════════════════════════"

- name: Coletar todos os hosts (paginacao real)
  ansible.builtin.include_tasks: fetch_all_hosts.yml

- name: Transformar hosts AWS para formato cloud_data (batch - com skip EKS + ef_cmdb)
  ansible.builtin.set_fact:
    cloud_data_list: >-
      {{ aap_all_hosts | batch_transform_aws_hosts(
           modelo_servidor_map | default({}),
           aws_vm_specs        | default({}),
           owner_ids           | default({})
         ) }}

- name: Debug - Hosts transformados
  ansible.builtin.debug:
    msg: "{{ aap_all_hosts | length }} hosts coletados | {{ cloud_data_list | length }} elegiveis | {{ aap_all_hosts | length - cloud_data_list | length }} ignorados"

- name: Resumo dos hosts do AAP
  ansible.builtin.debug:
    msg:
      - "Total no AAP: {{ aap_all_hosts | length }}"
      - "{{ aap_all_hosts | map(attribute='name') | list }}"

- name: Listar hosts elegiveis
  ansible.builtin.debug:
    msg: >-
      {{
        cloud_data_list
        | map(attribute='name_cloud')
        | list
      }}

- name: Listar hosts ignorados
  ansible.builtin.debug:
    msg: >-
      {{
        (
          aap_all_hosts
          | map(attribute='name')
          | list
        )
        |
        difference(
          cloud_data_list
          | map(attribute='name_cloud')
          | list
        )
      }}

# ---------------------------------------------------------------------------
# FASE 2: Coletar dados do CMDB
# ---------------------------------------------------------------------------
- name: "FASE 2 - Coletar servidores AWS do CMDB"
  ansible.builtin.debug:
    msg: "════════════════════════════════════════════════════════════════"

# ---------------------------------------------------------------------------
# Consulta especifica AWS
#
# Esta consulta continua filtrada por Datacenter = "AWS".
#
# Ela e usada para montar cmdb_servers, que posteriormente participa
# exclusivamente da identificacao dos servidores que podem ser DESATIVADOS.
#
# NAO remover o filtro de Datacenter desta consulta.
# ---------------------------------------------------------------------------
- name: Buscar servidores AWS existentes no CMDB
  ansible.builtin.uri:
    url: "{{ jira_url }}/object/aql?startAt=0&maxResults=1000"
    method: POST
    headers:
      Accept: "application/json"
      Content-Type: "application/json"
    body_format: json
    force_basic_auth: yes
    user: "{{ jira_user }}"
    password: "{{ jira_password }}"
    body:
      qlQuery: 'objectTypeId = {{ object_type_id_servidor }} AND Datacenter = "AWS"'
    status_code: [200]
    timeout: 60
  register: cmdb_servers_result
  environment: "{{ proxy_env | default({}) }}"
  retries: 3
  delay: 5
  until: cmdb_servers_result.status == 200

- name: Parsear servidores AWS do CMDB
  ansible.builtin.set_fact:
    cmdb_servers: "{{ cmdb_servers_result.json['values'] | default([]) }}"

- name: Debug servidor com Last User do CMDB
  ansible.builtin.debug:
    msg: >-
      {{
        cmdb_servers
        | selectattr('id', 'equalto', '3562960')
        | list
      }}

- name: Debug - Servidores AWS encontrados no CMDB
  ansible.builtin.debug:
    msg: "Encontrados {{ cmdb_servers | length }} servidores AWS no CMDB"

# ---------------------------------------------------------------------------
# Consulta GLOBAL direcionada para verificacao de Name
#
# Em vez de carregar 20.000+ objetos do CMDB, consultamos somente os Names
# que realmente existem no inventario desta cloud.
#
# A consulta NAO possui filtro de Datacenter porque o atributo Name precisa
# ser verificado globalmente no Object Type Servidor.
#
# Os Names sao enviados em lotes de 200 para evitar uma AQL excessivamente
# grande. Cada lote retorna no maximo 200 objetos, portanto nao depende da
# paginacao global do CMDB.
#
# Esta lista e usada SOMENTE para CREATE/SKIP.
# A consulta anterior, filtrada por Datacenter, continua sendo usada para
# DEACTIVATE.
# ---------------------------------------------------------------------------
- name: Extrair Names da cloud para consulta no CMDB
  ansible.builtin.set_fact:
    cloud_server_names: >-
      {{
        cloud_data_list
        | map(attribute='name_cloud')
        | unique
        | list
      }}

- name: Dividir Names em lotes de 200
  ansible.builtin.set_fact:
    cloud_server_name_batches: "{{ cloud_server_names | batch(200) | map('list') | list }}"

- name: Buscar no CMDB somente os Names existentes no AAP
  ansible.builtin.uri:
    url: "{{ jira_url }}/object/aql?startAt=0&maxResults=200"
    method: POST
    headers:
      Accept: "application/json"
      Content-Type: "application/json"
    body_format: json
    force_basic_auth: yes
    user: "{{ jira_user }}"
    password: "{{ jira_password }}"
    body:
      qlQuery: 'objectTypeId = {{ object_type_id_servidor }} AND Name IN ({{ item | map("to_json") | join(", ") }})'
    status_code: [200]
    timeout: 60
  register: cmdb_name_batches_result
  environment: "{{ proxy_env | default({}) }}"
  loop: "{{ cloud_server_name_batches }}"
  loop_control:
    label: "Lote com {{ item | length }} Names"
  retries: 3
  delay: 5
  until: cmdb_name_batches_result.status == 200
  when: item | length > 0

- name: Inicializar lista de Names encontrados no CMDB
  ansible.builtin.set_fact:
    cmdb_server_names: []

- name: Consolidar Names encontrados no CMDB
  ansible.builtin.set_fact:
    cmdb_server_names: >-
      {{
        cmdb_server_names
        + (item.json['values'] | default([]) | map(attribute='label') | list)
      }}
  loop: "{{ cmdb_name_batches_result.results | default([]) }}"
  loop_control:
    label: "{{ item.json['values'] | default([]) | length }} Names encontrados"
  when:
    - not (item.skipped | default(false))
    - item.json is defined

- name: Normalizar lista de Names encontrados no CMDB
  ansible.builtin.set_fact:
    cmdb_server_names: "{{ cmdb_server_names | unique | list }}"

- name: Debug - Consulta direcionada por Name
  ansible.builtin.debug:
    msg:
      - "Names consultados: {{ cloud_server_names | length }}"
      - "Lotes AQL: {{ cloud_server_name_batches | length }}"
      - "Names ja existentes no CMDB: {{ cmdb_server_names | length }}"

# ---------------------------------------------------------------------------
# ALTERNATIVA FUTURA - NAO ATIVAR SEM VALIDACAO DO TIME DE CMDB
# ---------------------------------------------------------------------------
#
# COMPORTAMENTO ATUAL:
#
#   Se o Name ja existir em QUALQUER servidor do CMDB:
#       -> SKIP
#
# Isso evita:
#   "The attribute 'Name' has duplicated values"
#
#
# CASO O TIME DE CMDB DECIDA QUE O INVENTARIO CLOUD DEVE SER A VERDADE:
#
# Nao basta remover a verificacao global.
#
# O comportamento recomendado nesse caso seria:
#
#   1. verificar se Name existe globalmente;
#   2. verificar se pertence ao mesmo Datacenter;
#   3. se existir fora de AWS:
#        trocar temporariamente name_cloud por _aws_instance_id;
#   4. criar o novo CI;
#   5. posteriormente o time de CMDB realiza a reconciliacao.
#
# Exemplo:
#
#   Name existente:
#       servidor01
#
#   Novo CI AWS:
#       i-0123456789abcdef0
#
# NAO IMPLEMENTADO/ATIVO enquanto nao houver definicao do time de CMDB.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# FASE 3: Comparar
# ---------------------------------------------------------------------------
- name: Extrair nomes das instancias AWS
  ansible.builtin.set_fact:
    aws_instance_names: "{{ cloud_data_list | map(attribute='name_cloud') | list }}"

- name: Inicializar lista de hosts EKS protegidos
  ansible.builtin.set_fact:
    aws_protected_cluster_names: []

- name: Identificar hosts EKS no inventario AAP para proteger contra DEACTIVATE
  ansible.builtin.set_fact:
    aws_protected_cluster_names: "{{ aws_protected_cluster_names + [host_vars.instance_id] }}"
  loop: "{{ aap_all_hosts | default([]) }}"
  loop_control:
    label: "{{ host_vars.instance_id | default(item.name | default('sem_nome')) }}"
  vars:
    host_vars: >-
      {{
        (item.variables | from_json)
        if (item.variables is string)
        else (item.variables | default({}))
      }}
  when:
    - host_vars.instance_id is defined
    - host_vars.instance_id | length > 0
    - host_vars | is_eks_node

- name: Listar hosts EKS protegidos
  ansible.builtin.debug:
    msg: "{{ aws_protected_cluster_names }}"
  when: aws_protected_cluster_names | length > 0

- name: Inicializar lista de reativacao
  ansible.builtin.set_fact:
    servers_to_reactivate: []

- name: Identificar servidores desativados no CMDB que voltaram a aparecer na AWS
  ansible.builtin.set_fact:
    servers_to_reactivate: "{{ servers_to_reactivate + [item] }}"
  loop: "{{ cmdb_servers }}"
  loop_control:
    label: "{{ item.label }}"
  when:
    - item.label in aws_instance_names
    - item.label not in aws_protected_cluster_names
    - >
      (
        item.attributes
        | selectattr('objectTypeAttributeId', 'equalto', '2957')
        | first
      ).objectAttributeValues[0].status.id == '19'

    - >
      (
        item.attributes
        | selectattr('objectTypeAttributeId', 'equalto', '3357')
        | map(attribute='objectAttributeValues')
        | flatten
        | selectattr('value', 'equalto', 'Ansible')
        | list
        | length
      ) > 0

- name: Hosts a reativar
  ansible.builtin.debug:
    msg: "{{ servers_to_reactivate | map(attribute='label') | list }}"
  when:
    - servers_to_reactivate | length > 0


- name: Identificar servidores com modelo alterado no CMDB
  ansible.builtin.set_fact:
    servers_to_update: []

- name: Selecionar servidores cujo modelo mudou
  ansible.builtin.set_fact:
    servers_to_update: >-
      {{
        servers_to_update + [
          item | combine({
            '_cmdb_id': cmdb_match.id,
            '_cmdb_model': cmdb_model,
            '_new_model': item.modelo_servidor_cloud
          })
        ]
      }}
  loop: "{{ cloud_data_list }}"
  loop_control:
    label: "{{ item.name_cloud }}"
  vars:
    cmdb_match: >-
      {{
        (
          cmdb_servers
          | selectattr('label', 'equalto', item.name_cloud)
          | list
          | first
        ) | default({}, true)
      }}
    cmdb_model_attr: >-
      {{
        (
          cmdb_match.attributes | default([])
          | selectattr('objectTypeAttributeId', 'equalto', '15656')
          | list
          | first
        ) | default({}, true)
      }}
    cmdb_model_value: >-
      {{
        (
          cmdb_model_attr.objectAttributeValues | default([])
          | first
        ) | default({}, true)
      }}
    cmdb_model: >-
      {{
        cmdb_model_value.referencedObject.objectKey
        | default(cmdb_model_value.value | default(''), true)
      }}
  when:
    - cmdb_match.id is defined
    - item.modelo_servidor_cloud is defined
    - item.modelo_servidor_cloud | string | length > 0
    - cmdb_model | string | length > 0
    - cmdb_model | string != item.modelo_servidor_cloud | string
    - >
      (
        cmdb_match.attributes | default([])
        | selectattr('objectTypeAttributeId', 'equalto', '3357')
        | map(attribute='objectAttributeValues')
        | flatten
        | selectattr('value', 'equalto', 'Ansible')
        | list
        | length
      ) > 0

- name: Listar servidores com modelo alterado
  ansible.builtin.debug:
    msg:
      - "SERVIDORES A ATUALIZAR:"
      - "{{ servers_to_update | map(attribute='name_cloud') | list }}"

- name: Determinar acoes
  ansible.builtin.set_fact:

    # CREATE:
    # Somente servidores cujo Name NAO existe em nenhum objeto do CMDB.
    servers_to_create: >-
      {{
        cloud_data_list
        | rejectattr('name_cloud', 'in', cmdb_server_names)
        | list
      }}

    # SKIP:
    # Servidores cujo Name ja existe em qualquer objeto do CMDB,
    # independentemente do Datacenter.
    servers_to_skip: >-
      {{
        cloud_data_list
        | selectattr('name_cloud', 'in', cmdb_server_names)
        | rejectattr(
            'name_cloud',
            'in',
            servers_to_update | map(attribute='name_cloud') | list
          )
        | list
      }}

    # DEACTIVATE:
    # A lista sera montada abaixo, considerando somente CIs criados pelo Ansible.
    servers_to_deactivate: []

- name: Selecionar servidores AWS criados pelo Ansible para desativacao
  ansible.builtin.set_fact:
    servers_to_deactivate: "{{ servers_to_deactivate + [item] }}"
  loop: "{{ cmdb_servers }}"
  loop_control:
    label: "{{ item.label | default('?') }}"
  when:
    - item.label is defined
    - item.label not in aws_instance_names
    - item.label not in aws_protected_cluster_names
    - >
      (
        item.attributes
        | selectattr('objectTypeAttributeId', 'equalto', '3357')
        | map(attribute='objectAttributeValues')
        | flatten
        | selectattr('value', 'equalto', 'Ansible')
        | list
        | length
      ) > 0

- name: Hosts a criar
  ansible.builtin.debug:
    msg: "{{ servers_to_create | map(attribute='name_cloud') | list }}"

- name: Hosts ja existentes no CMDB
  ansible.builtin.debug:
    msg: "{{ servers_to_skip | map(attribute='name_cloud') | list }}"

- name: Listar servidores a reativar
  ansible.builtin.debug:
    msg:
      - "SERVIDORES A REATIVAR:"
      - "{{ servers_to_reactivate | map(attribute='label') | list }}"
  when: servers_to_reactivate | length > 0

- name: Listar servidores a desativar
  ansible.builtin.debug:
    msg:
      - "SERVIDORES A DESATIVAR:"
      - "{{ servers_to_deactivate | map(attribute='label') | list }}"
  when:
    - servers_to_deactivate | length > 0
    - enable_deactivation | default(false) | bool

- name: Resumo da comparacao
  ansible.builtin.debug:
    msg:
      - "════════════════════════════════════════════════════════════════"
      - "                    RESUMO DA SINCRONIZACAO"
      - "════════════════════════════════════════════════════════════════"
      - "Total instancias AWS: {{ cloud_data_list | length }}"
      - "Total servidores AWS no CMDB: {{ cmdb_servers | length }}"
      - "Total Names globais no CMDB: {{ cmdb_server_names | length }}"
      - "A CRIAR: {{ servers_to_create | length }}"
      - "A REATIVAR: {{ servers_to_reactivate | length }}"
      - "EKS PROTEGIDOS: {{ aws_protected_cluster_names | length }}"
      - "EXISTENTES (skip): {{ servers_to_skip | length }}"
      - "A DESATIVAR: {{ servers_to_deactivate | length if enable_deactivation else '(desativado)' }}"
      - "════════════════════════════════════════════════════════════════"

# ---------------------------------------------------------------------------
# DRY RUN - encerrar aqui
# ---------------------------------------------------------------------------
- name: "DRY RUN - encerrar antes de escrever no CMDB"
  ansible.builtin.meta: end_play
  when: dry_run | default(false) | bool

# ---------------------------------------------------------------------------
# FASE 4: Executar sincronizacao
# ---------------------------------------------------------------------------
- name: "FASE 4 - Executar sincronizacao"
  ansible.builtin.debug:
    msg: "════════════════════════════════════════════════════════════════"

- name: Reativar servidores que voltaram para AWS
  ansible.builtin.include_tasks: reactivate.yml
  vars:
    server_to_reactivate: "{{ server_item }}"
  loop: "{{ servers_to_reactivate }}"
  loop_control:
    loop_var: server_item
    label: "{{ server_item.label }}"
    pause: "{{ jira_create_delay_seconds | default(0.3) }}"
  when:
    - servers_to_reactivate | length > 0
    - sync_mode == 'full' or sync_mode == 'deactivate'
    - enable_deactivation | default(false) | bool


- name: Atualizar modelo dos servidores no CMDB
  ansible.builtin.uri:
    url: "{{ jira_url }}/object/{{ server_item._cmdb_id }}"
    method: PUT
    force_basic_auth: yes
    headers:
      Content-Type: "application/json"
      Accept: "application/json"
    user: "{{ jira_user }}"
    password: "{{ jira_password }}"
    body:
      objectTypeId: "{{ object_type_id_servidor }}"
      attributes:
        - objectTypeAttributeId: "15656"
          objectAttributeValues:
            - value: "{{ server_item._new_model }}"
    body_format: json
    return_content: yes
    status_code: [200]
  register: resultado_update
  environment: "{{ proxy_env | default({}) }}"
  loop: "{{ servers_to_update }}"
  loop_control:
    loop_var: server_item
    label: "{{ server_item.name_cloud }}"
    pause: "{{ jira_create_delay_seconds | default(0.3) }}"
  when:
    - servers_to_update | length > 0
    - sync_mode == 'full'

- name: Registrar servidores atualizados
  ansible.builtin.set_fact:
    sync_log_update: "{{ sync_log_update + [server_item.name_cloud] }}"
  loop: "{{ servers_to_update }}"
  loop_control:
    loop_var: server_item
    label: "{{ server_item.name_cloud }}"
  when:
    - servers_to_update | length > 0
    - sync_mode == 'full'

- name: Criar novos servidores no CMDB
  ansible.builtin.include_tasks: create.yml
  vars:
    current_cloud_data: "{{ server_item }}"
  loop: "{{ servers_to_create }}"
  loop_control:
    loop_var: server_item
    label: "{{ server_item.name_cloud }}"
    pause: "{{ jira_create_delay_seconds | default(0.3) }}"
  when:
    - servers_to_create | length > 0
    - sync_mode == 'full' or sync_mode == 'create'

- name: Registrar servidores existentes (skip)
  ansible.builtin.set_fact:
    sync_log_skip: "{{ sync_log_skip + [server_item.name_cloud] }}"
  loop: "{{ servers_to_skip }}"
  loop_control:
    loop_var: server_item
    label: "{{ server_item.name_cloud }}"
  when: servers_to_skip | length > 0

- name: Desativar servidores removidos da AWS
  ansible.builtin.include_tasks: deactivate.yml
  vars:
    server_to_deactivate: "{{ server_item }}"
  loop: "{{ servers_to_deactivate }}"
  loop_control:
    loop_var: server_item
    label: "{{ server_item.label }}"
    pause: "{{ jira_create_delay_seconds | default(0.3) }}"
  when:
    - servers_to_deactivate | length > 0
    - sync_mode == 'full' or sync_mode == 'deactivate'
    - enable_deactivation | default(false) | bool
    - server_item.label not in (aws_protected_cluster_names | default([]))



# ---------------------------------------------------------------------------
# FASE 5: Relatorio final
# ---------------------------------------------------------------------------
- name: "FASE 5 - Relatorio final"
  ansible.builtin.debug:
    msg:
      - "════════════════════════════════════════════════════════════════"
      - "                    SINCRONIZACAO CONCLUIDA"
      - "════════════════════════════════════════════════════════════════"
      - "Criados com sucesso: {{ sync_log_create | length }}"
      - "Atualizados: {{ sync_log_update | length }}"
      - "Ignorados (ja existentes): {{ sync_log_skip | length }}"
      - "Desativados: {{ sync_log_deactivate | length }}"
      - "Reativados: {{ sync_log_reactivate | length }}"
      - "ERROS: {{ sync_log_errors | length }}"
      - "────────────────────────────────────────────────────────────────"
      - "{% for e in sync_log_errors %}- {{ e.name }} | status={{ e.status }} | {{ e.msg }}\n{% endfor %}"
      - "════════════════════════════════════════════════════════════════"

- name: Falhar apenas se TODOS falharam
  ansible.builtin.fail:
    msg: "Sincronizacao falhou: TODOS os {{ servers_to_create | length }} servidores tiveram erro"
  when:
    - servers_to_create | length > 0
    - sync_log_create | length == 0
    - sync_log_errors | length == servers_to_create | length


