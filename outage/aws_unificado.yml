--- FILE: ./chat/roles/inventory/tasks/main.yml
---
# Cria em memória o host usado pelo connection plugin da
# community.zabbix. Nada é executado no Zabbix aqui.
#
# Se zabbix_habilitado for false, esta role não faz nada e o
# playbook segue normalmente (o Dynatrace nunca depende disso).

- name: Avisar que o Zabbix está desabilitado
  ansible.builtin.debug:
    msg: >-
      zabbix_habilitado=false: o host virtual não será criado e
      a role "outage" vai pular as tasks do Zabbix.
  when: not zabbix_habilitado

- name: Validar configuração de acesso ao Zabbix
  ansible.builtin.assert:
    that:
      - zabbix_host | length > 0
      - zabbix_user | length > 0
      - zabbix_password | length > 0
    fail_msg: >-
      Configure zabbix_host e forneça zabbix_user / zabbix_password
      pelo AAP antes de executar o playbook (ou defina
      zabbix_habilitado: false para pular o Zabbix).
  when: zabbix_habilitado

- name: Registrar host virtual para a API do Zabbix
  ansible.builtin.add_host:
    name: "{{ zabbix_inventory_host }}"
    ansible_host: "{{ zabbix_host }}"
    ansible_connection: community.zabbix.httpapi
    ansible_network_os: community.zabbix.zabbix
    ansible_httpapi_port: "{{ zabbix_port }}"
    ansible_httpapi_use_ssl: "{{ zabbix_use_ssl }}"
    ansible_httpapi_validate_certs: "{{ zabbix_validate_certs }}"
    ansible_zabbix_url_path: "{{ zabbix_url_path }}"
    ansible_user: "{{ zabbix_user }}"
    ansible_httpapi_pass: "{{ zabbix_password }}"
  changed_when: false
  when: zabbix_habilitado
--- FILE: ./chat/roles/outage/defaults/main.yml
---
# Dynatrace
# Informe a URL do seu ambiente, por exemplo:
# https://xxxxx.live.dynatrace.com
dynatrace_url: ""

# Token deve ser fornecido pelo AAP.
dynatrace_token: ""

# Durante os primeiros testes deixe true.
# Com true, a chamada é validada sem criar a janela.
dynatrace_validate_only: true

# Timezone da janela.
dynatrace_timezone: "America/Sao_Paulo"

--- FILE: ./chat/roles/outage/tasks/criar_outage_zabbix.yml
---
# Recebe a variável "gmud" (loop_var definido em main.yml).
# Só é incluída quando zabbix_habilitado for true (ver main.yml).

- name: Converter janela da GMUD para o formato do Zabbix
  ansible.builtin.set_fact:
    zbx_inicio: >-
      {{ (gmud.inicio | to_datetime('%Y-%m-%dT%H:%M:%S.%f%z')).strftime('%Y-%m-%d %H:%M') }}
    zbx_fim: >-
      {{ (gmud.fim | to_datetime('%Y-%m-%dT%H:%M:%S.%f%z')).strftime('%Y-%m-%d %H:%M') }}
    zbx_minutos: >-
      {{ ((
            (gmud.fim   | to_datetime('%Y-%m-%dT%H:%M:%S.%f%z'))
          - (gmud.inicio | to_datetime('%Y-%m-%dT%H:%M:%S.%f%z'))
         ).total_seconds() / 60) | round | int }}

- name: Validar duração da janela
  ansible.builtin.assert:
    that:
      - zbx_minutos | int > 0
    fail_msg: >-
      GMUD {{ gmud.chave }}: janela inválida
      ({{ gmud.inicio }} -> {{ gmud.fim }}).

- name: Localizar ativos no Zabbix
  community.zabbix.zabbix_host_info:
    host_name: "{{ item }}"
    exact_match: true
  loop: "{{ gmud.ativos }}"
  loop_control:
    label: "{{ item }}"
  delegate_to: "{{ zabbix_inventory_host }}"
  register: zbx_busca
  failed_when: false

- name: Montar lista de hosts encontrados
  ansible.builtin.set_fact:
    zbx_hosts: >-
      {{
        zbx_busca.results
        | selectattr('hosts', 'defined')
        | map(attribute='hosts')
        | flatten
        | map(attribute='host')
        | unique
        | list
      }}

- name: Definir se a GMUD é válida para o Zabbix
  ansible.builtin.set_fact:
    gmud_valida_zabbix: "{{ zbx_hosts | length == gmud.ativos | length }}"

- name: Informar GMUD ignorada por ativo não encontrado no Zabbix
  ansible.builtin.debug:
    msg: >-
      GMUD {{ gmud.chave }} ignorada no Zabbix: esperados
      {{ gmud.ativos | length }} ativos, encontrados {{ zbx_hosts | length }}
      ({{ zbx_hosts | join(', ') }}). Nenhuma maintenance será criada.
  when: not gmud_valida_zabbix

- name: Mostrar o que será colocado em manutenção no Zabbix
  ansible.builtin.debug:
    msg:
      gmud: "{{ gmud.chave }}"
      nome_maintenance: "GMUD {{ gmud.chave }}"
      inicio: "{{ zbx_inicio }}"
      fim: "{{ zbx_fim }}"
      duracao_minutos: "{{ zbx_minutos }}"
      hosts: "{{ zbx_hosts }}"
  when: gmud_valida_zabbix

- name: Criar maintenance no Zabbix
  community.zabbix.zabbix_maintenance:
    state: present
    name: "GMUD {{ gmud.chave }}"
    desc: >-
      Outage automático para a GMUD {{ gmud.chave }} - {{ gmud.resumo }}
    host_names: "{{ zbx_hosts }}"
    visible_name: "{{ zabbix_usar_visible_name }}"
    collect_data: "{{ zabbix_collect_data }}"
    active_since: "{{ zbx_inicio }}"
    active_till: "{{ zbx_fim }}"
    minutes: "{{ zbx_minutos }}"
  delegate_to: "{{ zabbix_inventory_host }}"
  environment: "{{ proxy_env }}"
  register: zbx_maintenance
  when:
    - gmud_valida_zabbix
    - not zabbix_validate_only

- name: Informar resultado do Zabbix
  ansible.builtin.debug:
    msg:
      gmud: "{{ gmud.chave }}"
      resultado: >-
        {{
          'VALIDAÇÃO OK - nenhuma maintenance foi criada'
          if zabbix_validate_only
          else 'Maintenance criada/atualizada no Zabbix'
        }}
  when: gmud_valida_zabbix
--- FILE: ./chat/roles/outage/tasks/main copy.yml
---
- name: Verificar se há GMUDs para processar
  ansible.builtin.debug:
    msg: "Nenhuma GMUD de Observabilidade encontrada."
  when: gmuds | default([]) | length == 0

# O Dynatrace roda sempre, independente do Zabbix estar habilitado
# ou não. Uma GMUD pode existir só no Dynatrace, só no Zabbix, ou
# nos dois — cada bloco decide por conta própria (gmud_valida /
# gmud_valida_zabbix), sem depender do resultado do outro.
- name: Processar GMUDs no Dynatrace
  ansible.builtin.include_tasks: criar_outage.yml
  loop: "{{ gmuds | default([]) }}"
  loop_control:
    loop_var: gmud
    label: "{{ gmud.chave }}"

- name: Processar GMUDs no Zabbix
  ansible.builtin.include_tasks: criar_outage_zabbix.yml
  loop: "{{ gmuds | default([]) }}"
  loop_control:
    loop_var: gmud
    label: "{{ gmud.chave }}"
  when: zabbix_habilitado
