--- FILE: ./aw/roles/integration_assets_aws/tasks/manage_network_interface.yml
# =============================================================================
# Task: Gerenciar Interface de Rede (criar se não existir)
# =============================================================================
---
- name: Buscar Interface de Rede existente
  ansible.builtin.uri:
    url: "{{ jira_url }}/object/aql?startAt=0&maxResults=1"
    method: POST
    headers:
      Accept: "application/json"
      Content-Type: "application/json"
    body_format: json
    force_basic_auth: yes
    user: "{{ jira_user }}"
    password: "{{ jira_password }}"
    body:
      qlQuery: 'objectTypeId = 230 AND Name = "{{ ip_info.ip }}"'
    status_code: [ 200 ]
  register: nic_search_result
  environment: "{{ proxy_env | default({}) }}"

- name: Verificar se Interface de Rede existe
  ansible.builtin.set_fact:
    nic_exists: "{{ nic_search_result.json.total | int > 0 }}"

- name: Extrair ID da Interface de Rede (se existir)
  ansible.builtin.set_fact:
    nic_id: "{{ nic_search_result.json['values'][0]['id'] }}"
  when: nic_search_result.json.total | int > 0

- name: Definir nic_id vazio se não existir
  ansible.builtin.set_fact:
    nic_id: ""
  when: nic_search_result.json.total | int == 0

- name: Criar Interface de Rede se não existir
  ansible.builtin.uri:
    url: "{{ jira_url }}/object/create"
    method: POST
    force_basic_auth: yes
    headers:
      Content-Type: "application/json"
      Accept: "application/json"
    user: "{{ jira_user }}"
    password: "{{ jira_password }}"
    body:
      objectTypeId: 230
      attributes:
      - objectTypeAttributeId: "{{ nic_name_attribute_id | default('1890') }}"
        objectAttributeValues:
        - value: "{{ ip_info.ip }}"
    body_format: json
    return_content: yes
    status_code: [ 200, 201 ]
  register: nic_create_result
  environment: "{{ proxy_env | default({}) }}"
  when: not nic_exists

- name: Atualizar ID da Interface de Rede
  ansible.builtin.set_fact:
    nic_id: "{{ nic_create_result.json.id }}"
  when: not nic_exists and nic_create_result is defined

- name: Acumular ID da Interface de Rede
  ansible.builtin.set_fact:
    interface_rede_ids: "{{ interface_rede_ids | default([]) + [nic_id] }}"

- name: Debug - Interface de Rede
  ansible.builtin.debug:
    msg: "Interface de Rede '{{ ip_info.ip }}': {{ 'Existente' if nic_exists else 'Criada' }} (ID: {{ nic_id }})"

--- FILE: ./aw/roles/integration_assets_aws/tasks/reactivate.yml
---
# =============================================================================
# Task: Reativar servidor no CMDB (EC2 voltou a existir na AWS)
# =============================================================================

- name: Validar que o CI nao pertence a EKS
  ansible.builtin.assert:
    that:
      - server_to_reactivate.label not in (aws_protected_cluster_names | default([]))
    fail_msg: >-
      Reativacao bloqueada: '{{ server_to_reactivate.label }}' foi identificado
      como host EKS e esta fora do escopo desta automacao.

- name: Preparar payload para reativacao
  ansible.builtin.set_fact:
    data_reactivate:
      objectTypeId: "{{ object_type_id_servidor }}"
      attributes:
        - objectTypeAttributeId: "2957" # Status
          objectAttributeValues:
            - value: "18" # Em uso

- name: Reativar servidor no Assets
  ansible.builtin.uri:
    url: "{{ jira_url }}/object/{{ server_to_reactivate.id }}"
    method: PUT
    force_basic_auth: yes
    headers:
      Content-Type: "application/json"
      Accept: "application/json"
    user: "{{ jira_user }}"
    password: "{{ jira_password }}"
    body: "{{ data_reactivate | to_json }}"
    body_format: json
    return_content: yes
    status_code: [200]
  register: resultado_reactivate
  environment: "{{ proxy_env | default({}) }}"

- name: Debug - Resultado da reativacao
  ansible.builtin.debug:
    msg: >-
      Servidor '{{ server_to_reactivate.label }}'
      reativado no CMDB. ID: {{ server_to_reactivate.id }}

- name: Registrar reativacao no log
  ansible.builtin.set_fact:
    sync_log_reactivate: >-
      {{
        sync_log_reactivate | default([])
        + [server_to_reactivate.label]
      }}

--- FILE: ./aw/roles/integration_assets_aws/tasks/_fetch_one_page.yml
# =============================================================================
# Task auxiliar: buscar UMA pagina do AAP e acumular
# =============================================================================
---

- name: Buscar pagina do AAP
  ansible.builtin.uri:
    url: >-
      {{
        aap_next_url
        if aap_next_url is match('^https?://')
        else aap_host ~ aap_next_url
      }}
    method: GET
    headers:
      Authorization: "Bearer {{ aap_token }}"
      Content-Type: "application/json"
    validate_certs: "{{ aap_verify_ssl | default(false) }}"
    return_content: true
    status_code:
      - 200
    timeout: 60
  register: aap_page_result
  retries: 3
  delay: 5
  until: aap_page_result.status == 200
  when:
    - aap_next_url is not none
    - (aap_next_url | default('') | length) > 0

- name: Acumular resultados e avancar next
  ansible.builtin.set_fact:
    aap_all_hosts: >-
      {{
        aap_all_hosts +
        (aap_page_result.json.results | default([]))
      }}
    aap_page_num: "{{ (aap_page_num | int) + 1 }}"
    aap_next_url: >-
      {{
        (
          aap_host ~ aap_page_result.json.next
          if not (aap_page_result.json.next is match('^https?://'))
          else aap_page_result.json.next
        )
        if (
          aap_page_result.json.next is not none
          and
          (aap_page_result.json.next | default('') | length) > 0
        )
        else none
      }}
  when:
    - aap_page_result is defined
    - aap_page_result.json is defined
