--- FILE: ./chat/roles/descoberta/defaults/main.yml
---
jira_base_url: "https://clarobr.atlassian.net"

projeto_jira: "GML"

executante_alvo: "OBSERVABILIDADE(APR)"

# Campos da GMUD
jira_ativos_field: "customfield_16348"
jira_inicio_field: "customfield_14318"
jira_fim_field: "customfield_14319"

# Proxy
http_proxy_url: "http://10.29.177.37:8080"
https_proxy_url: "http://10.29.177.37:8080"

proxy_env:
  http_proxy: "{{ http_proxy_url }}"
  https_proxy: "{{ https_proxy_url }}"
  HTTP_PROXY: "{{ http_proxy_url }}"
  HTTPS_PROXY: "{{ https_proxy_url }}"
--- FILE: ./chat/roles/descoberta/tasks/main copy.yml
---
# ============================================================
# 1. Buscar atividades que estão aguardando aprovação
# ============================================================

- name: Buscar atividades de Observabilidade
  ansible.builtin.uri:
    url: "{{ jira_base_url }}/rest/api/3/search/jql"
    method: POST
    force_basic_auth: true
    user: "{{ jira_user }}"
    password: "{{ jira_password }}"
    headers:
      Accept: application/json
      Content-Type: application/json
    body_format: json
    body:
      jql: >-
        project = {{ projeto_jira }}
        AND status = "Aguardando aprovação dos Executantes"
      maxResults: 1000
      fields:
        - summary
        - customfield_14998
        - issuelinks
    status_code: 200
  register: jira_search
  environment: "{{ proxy_env }}"
  no_log: true


# ============================================================
# 2. Filtrar somente as atividades de Observabilidade
# ============================================================

- name: Selecionar somente atividades de Observabilidade
  ansible.builtin.set_fact:
    atividades_observabilidade: >-
      {{
        jira_search.json.issues | default([])
        | selectattr('fields.customfield_14998', 'defined')
        | selectattr('fields.customfield_14998.value', 'defined')
        | selectattr(
            'fields.customfield_14998.value',
            'equalto',
            executante_alvo
          )
        | list
      }}


# ============================================================
# 3. Descobrir as GMUDs pai
# ============================================================

- name: Identificar as GMUDs pai
  ansible.builtin.set_fact:
    gmuds_pai: >-
      {{
        atividades_observabilidade
        | map(attribute='fields.issuelinks')
        | flatten
        | selectattr('inwardIssue', 'defined')
        | map(attribute='inwardIssue.key')
        | unique
        | list
      }}


# ============================================================
# 4. Buscar os dados completos de cada GMUD
# ============================================================

- name: Consultar dados completos das GMUDs
  ansible.builtin.uri:
    url: "{{ jira_base_url }}/rest/api/3/issue/{{ item }}?fields=*all"
    method: GET
    force_basic_auth: true
    user: "{{ jira_user }}"
    password: "{{ jira_password }}"
    headers:
      Accept: application/json
    status_code: 200
  loop: "{{ gmuds_pai }}"
  register: gmuds_jira
  environment: "{{ proxy_env }}"
  no_log: true
  loop_control:
    label: "{{ item }}"


# ============================================================
# 5. Inicializar resultado
# ============================================================

- name: Inicializar lista de GMUDs
  ansible.builtin.set_fact:
    gmuds: []


# ============================================================
# 6. Extrair informações das GMUDs
#
# O campo customfield_16348 é ADF.
#
# Estrutura observada:
#
# content
#   └── paragraph
#         └── content
#               ├── "Ativos Afetados:"
#               └── " brwin0291"
#
# Primeiro montamos o texto de cada parágrafo.
# ============================================================

- name: Processar cada GMUD
  ansible.builtin.set_fact:
    gmuds: >-
      {{
        gmuds + [
          {
            'chave': item.json.key,
            'resumo': item.json.fields.summary,
            'inicio': item.json.fields[jira_inicio_field],
            'fim': item.json.fields[jira_fim_field],
            'ativos': ativos_extraidos
          }
        ]
      }}
  loop: "{{ gmuds_jira.results }}"
  loop_control:
    label: "{{ item.json.key }}"
  vars:

    # Junta todos os textos existentes no ADF.
    texto_adf: >-
      {{
        item.json.fields[jira_ativos_field].content
        | default([])
        | map(attribute='content')
        | flatten
        | selectattr('text', 'defined')
        | map(attribute='text')
        | join(' ')
      }}

    # Pega somente o que está depois de "Ativos Afetados:"
    # e antes do próximo campo.
    texto_ativos: >-
      {{
        texto_adf
        | regex_replace(
            '^.*Ativos Afetados:\s*',
            ''
          )
        | regex_replace(
            '\s+Haverá indisponibilidade:.*$',
            ''
          )
        | trim
      }}

    # Permite múltiplos ativos separados por vírgula.
    ativos_extraidos: >-
      {{
        texto_ativos
        | split(',')
        | map('trim')
        | reject('equalto', '')
        | list
      }}

  no_log: true


# ============================================================
# 7. Validar resultado
# ============================================================

- name: Validar informações das GMUDs
  ansible.builtin.assert:
    that:
      - item.inicio is defined
      - item.inicio is not none
      - item.fim is defined
      - item.fim is not none
      - item.ativos is defined
      - item.ativos | length > 0
    fail_msg: >-
      A GMUD {{ item.chave }} não possui todos os dados necessários.
      Início: {{ item.inicio | default('não informado') }}
      Fim: {{ item.fim | default('não informado') }}
      Ativos: {{ item.ativos | default([]) }}
  loop: "{{ gmuds }}"
  loop_control:
    label: "{{ item.chave }}"


# ============================================================
# 8. Mostrar resultado da descoberta
# ============================================================

- name: Mostrar resultado da descoberta
  ansible.builtin.debug:
    msg:
      gmud: "{{ item.chave }}"
      resumo: "{{ item.resumo }}"
      inicio: "{{ item.inicio }}"
      fim: "{{ item.fim }}"
      ativos: "{{ item.ativos }}"
  loop: "{{ gmuds }}"
  loop_control:
    label: "{{ item.chave }}"
