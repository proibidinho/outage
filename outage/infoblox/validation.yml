      when: modo == 'pos-validacao'

    - name: EMAIL | Lista ERRO DE CONECTIVIDADE (pos-validacao)
      ansible.builtin.set_fact:
        lista_pos_conectividade: "{% for r in resultados if r.status | trim == 'ERRO DE CONECTIVIDADE' %}\n- {{ r.ip }} | {{ r.motivo | trim }}{% endfor %}"
      when: modo == 'pos-validacao'

    - name: RELATORIO | Exibir no console (pos-validacao)
      ansible.builtin.debug:
        msg: |
          ================================================================
          PARECER POS-VALIDACAO GMUD INFOBLOX - DNS LINUX
          ================================================================
          Data/Hora: {{ ansible_date_time.date }} {{ ansible_date_time.time }}
          Datacenter: {{ datacenter | default('N/A') }}
          RDM: {{ rdm | default('N/A') }}
          Total analisado: {{ total_hosts }}
          ----------------------------------------------------------------
          SUCESSO ({{ total_sucesso }}):{{ lista_pos_sucesso | default('\n  Nenhum') }}

          FALHA ({{ total_falha }}):{{ lista_pos_falha | default('\n  Nenhum') }}

          FORA DE ESCOPO ({{ total_fora_escopo }}):{{ lista_pos_fora_escopo | default('\n  Nenhum') }}

          ERRO DE CONECTIVIDADE ({{ total_erro_conectividade }}):{{ lista_pos_conectividade | default('\n  Nenhum') }}
          ================================================================
          Escopo da mudanca: apenas sistemas contemplados pelos roles de
          deploy do infoblox.yaml (Red Hat/CentOS/Oracle Linux e SunOS).
          Planilha: {{ relatorio_excel }}
          ================================================================
      when: modo == 'pos-validacao'

    # -------------------------------------------------------------------------
    # GERAR PLANILHA EXCEL (compartilhado - usa excel_matrix do modo ativo)
    # -------------------------------------------------------------------------
    - name: EXCEL | Criar planilha
      ans2dev.general.open_xl:
        op: n
        dest: "{{ relatorio_excel }}"
        sheet_name: "{{ 'Pos-Validacao Infoblox' if modo == 'pos-validacao' else 'Infoblox Linux' }}"
        updates_matrix: "{{ excel_matrix }}"

    # -------------------------------------------------------------------------
    # ENVIAR EMAIL - PRE-CHECK (MODO VALIDATION) - INALTERADO
    # -------------------------------------------------------------------------
    - name: EMAIL | Enviar relatório (pre-check)
      community.general.mail:
        host: vip_smtp.claro.com.br
        port: 25
        from: coeeaiops@claro.com.br
        to: "{{ email_destino }}"
        subject: "Relatorio Infoblox Linux - {{ datacenter | default('N/A') }} - {{ ansible_date_time.date }}"
        subtype: plain
        attach:
          - "{{ relatorio_excel }}"
        body: |
          Prezado(a),
          
          Segue o relatorio de validacao DNS Infoblox em servidores Linux.
          
          ================================================================
          RESUMO
          ================================================================
          Data/Hora: {{ ansible_date_time.date }} {{ ansible_date_time.time }}
          Datacenter: {{ datacenter | default('N/A') }}
          RDM: {{ rdm | default('N/A') }}
          Total de hosts: {{ total_hosts }}
          
          OK: {{ total_ok }}
          ================================================
          RESOLV.CONF JA CORRETO
          ================================================
          {{ lista_resolv_conf | default('\nNenhum') }}

          Firewall Porta 53: {{ total_firewall_53 }}
          Firewall Porta 22: {{ total_firewall_22 }}
          Permissao Root: {{ total_permissao }}
          Timeout: {{ total_timeout }}
          Outros: {{ total_outros }}
          
          ================================================================
          OK ({{ total_ok }})
          ================================================================{{ lista_ok | default('\nNenhum') }}
          
          ================================================================
          FIREWALL PORTA 53 ({{ total_firewall_53 }})
          ================================================================{{ lista_firewall_53 | default('\nNenhum') }}
          
          ACAO: Solicitar liberacao TCP/UDP para DNS Infoblox na porta 53

          OBSERVAÇÃO:

          A validação da porta 53 depende das ferramentas disponíveis no servidor, podendo utilizar dig, nc (netcat), telnet, nmap ou bash /dev/tcp.
          Em servidores que não possuam nenhuma dessas ferramentas, a validação poderá retornar falha sem necessariamente indicar bloqueio de firewall.

          Importante: o serviço DNS normalmente utiliza UDP/53 para as consultas. Porém, quando a validação é realizada através do bash (/dev/tcp), o teste passa a depender da comunicação TCP/53.
          Diferentemente do TCP, o UDP não possui confirmação de conexão, portanto o bash não consegue validar de forma confiável a comunicação utilizando /dev/udp. Por esse motivo, quando o servidor não possui ferramentas como dig, nc, telnet ou nmap, o teste pode acabar dependendo exclusivamente da conectividade TCP/53.

          Nestes casos, para que a validação seja concluída com sucesso, pode ser necessário que a comunicação TCP/53 também esteja liberada entre o servidor e os DNS Infoblox, mesmo que a aplicação do DNS utilize predominantemente UDP/53.
          
          ================================================================
          FIREWALL PORTA 22 ({{ total_firewall_22 }})
          ================================================================{{ lista_firewall_22 | default('\nNenhum') }}
          
          ACAO: Verificar conectividade SSH e solicitar liberacao na porta 22
          
          ================================================================
          PERMISSAO ROOT ({{ total_permissao }})
          ================================================================{{ lista_permissao | default('\nNenhum') }}
          
          ACAO: Verificar privilegios de root/sudo nos servidores
          
          ================================================================
          TIMEOUT ({{ total_timeout }})
          ================================================================{{ lista_timeout | default('\nNenhum') }}
          
          ACAO: Verificar bash_profile lento ou aumentar timeout SSH
          
          ================================================================
          OUTROS ({{ total_outros }})
          ================================================================{{ lista_outros | default('\nNenhum') }}
          
          ================================================================
          Planilha detalhada em anexo.
          
          Este e um email automatico gerado pelo Ansible.
      when:
        - modo == 'validation'
        - email_destino is defined
        - email_destino | length > 0

    # -------------------------------------------------------------------------
    # ENVIAR EMAIL - POS-VALIDACAO (MODO POS-VALIDACAO)
    # -------------------------------------------------------------------------
    - name: EMAIL | Enviar relatório (pos-validacao)
      community.general.mail:
        host: vip_smtp.claro.com.br
        port: 25
        from: coeeaiops@claro.com.br
        to: "{{ email_destino }}"
        subject: "PÓS-VALIDAÇÃO GMUD INFOBLOX - {{ datacenter | default('N/A') }} - RDM {{ rdm | default('N/A') }} - {{ ansible_date_time.date }}"
        subtype: plain
        attach:
          - "{{ relatorio_excel }}"
        body: |
          Prezado(a),

          Segue o parecer de PÓS-VALIDAÇÃO da GMUD INFOBLOX (DNS Linux),
          executado em modo SOMENTE LEITURA apos a janela da mudanca.

          ================================================================
          PÓS-VALIDAÇÃO GMUD INFOBLOX - RESUMO
          ================================================================
          Data/Hora: {{ ansible_date_time.date }} {{ ansible_date_time.time }}
          Datacenter: {{ datacenter | default('N/A') }}
          RDM: {{ rdm | default('N/A') }}

          Total analisado: {{ total_hosts }}
          Sucesso: {{ total_sucesso }}
          Falha: {{ total_falha }}
          Fora de escopo: {{ total_fora_escopo }}
          Erro de conectividade: {{ total_erro_conectividade }}

          ================================================================
          SUCESSO ({{ total_sucesso }})
          ================================================================{{ lista_pos_sucesso | default('\nNenhum') }}

          ================================================================
          FALHA ({{ total_falha }})
          ================================================================{{ lista_pos_falha | default('\nNenhum') }}

          ================================================================
          FORA DE ESCOPO ({{ total_fora_escopo }})
          ================================================================{{ lista_pos_fora_escopo | default('\nNenhum') }}

          ================================================================
          ERRO DE CONECTIVIDADE ({{ total_erro_conectividade }})
          ================================================================{{ lista_pos_conectividade | default('\nNenhum') }}

          ================================================================
          ESCOPO DA MUDANCA
          ================================================================
          Os sistemas atendidos pela mudanca sao exclusivamente aqueles
          contemplados pelos roles de deploy existentes no infoblox.yaml.
          A analise dos arquivos confirma que os roles de deploy contemplam
          sistemas da familia Red Hat (Red Hat, CentOS e Oracle Linux) e
          sistemas SunOS. Servidores de outros sistemas operacionais sao
          classificados como FORA DE ESCOPO e nao como falha da GMUD.
          Nenhum suporte a outros sistemas operacionais e afirmado alem
          do que esta implementado nos roles.

          ================================================================
          CRITERIOS VALIDADOS (fieis aos roles do infoblox.yaml)
          ================================================================
          - SSH: acessibilidade do servidor.
          - SO: deteccao via /etc/redhat-release, /etc/system-release ou uname -s.
          - DNS esperado presente no /etc/resolv.conf (nameservers do datacenter).
          - Comunicacao com os DNS na porta 53 (nc -z -w2 IP 53, com fallback
            telnet/dig/nmap - mesma logica dos roles).
          - Red Hat / CentOS / Oracle Linux: /etc/resolv.conf com os
            nameservers e atributo de imutabilidade (lsattr).
          - SunOS: /etc/resolv.conf com os nameservers e /etc/nsswitch.conf
            com "hosts: files dns".

          Observacao: esta pos-validacao NAO altera nenhum servidor
          (execucao somente leitura).

          Planilha detalhada em anexo.

          Este e um email automatico gerado pelo Ansible.
      when:
        - modo == 'pos-validacao'
        - email_destino is defined
        - email_destino | length > 0

