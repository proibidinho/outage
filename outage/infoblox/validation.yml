---
# =============================================================================
# PLAYBOOK ÚNICO - VALIDAÇÃO INFOBLOX DNS LINUX
# =============================================================================
# Variáveis do Survey:
#   - modo_validacao: validation | pos-validacao   (default: validation)
#       * validation   -> PRE-CHECK (comportamento atual, inalterado)
#       * pos-validacao -> POS-VALIDACAO da GMUD (somente leitura)
#   - servers: Lista de IPs (um por linha)
#   - datacenter: Mackenzie | Lapa | Campinas
#   - email_destino: Email para enviar relatório
#   - rdm: Número da RDM (opcional)
# =============================================================================

- name: Adicionar servidores ao inventory
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Adicionar servidores ao grupo unix
      ansible.builtin.add_host:
        name: "{{ item | trim }}"
        groups: unix
      loop: "{{ servers.splitlines() | map('trim') | select() | unique | list }}"
      run_once: true

# =============================================================================
# PLAY 2: VALIDAR CONEXÃO SSH E PORTA 53
# =============================================================================
- name: Validar conectividade SSH e DNS
  hosts: unix
  gather_facts: false
  ignore_unreachable: true
  ignore_errors: true

  vars:
    # Modo de execução controlado pelo Survey do AAP
    modo: "{{ modo_validacao | default('validation') }}"
    # IPs DNS por datacenter (fonte de verdade = roles do infoblox.yaml)
    dns_ips:
      Mackenzie:
        - "10.54.44.13"
        - "10.53.22.101"
      Lapa:
        - "10.29.177.81"
        - "10.53.22.102"
      Campinas:
        - "10.54.44.12"
        - "10.29.177.82"

  tasks:
    # -------------------------------------------------------------------------
    # ETAPA 1: TESTAR CONEXÃO SSH (compartilhado entre os dois modos)
    # -------------------------------------------------------------------------
    - name: SSH | Testar conexão SSH
      ansible.builtin.raw: echo "SSH_OK"
      register: ssh_test
      changed_when: false

    - name: SSH | Registrar status da conexão
      ansible.builtin.set_fact:
        ssh_ok: "{{ ssh_test.stdout is defined and 'SSH_OK' in ssh_test.stdout }}"
        ssh_erro_msg: "{{ ssh_test.msg | default('') }}"

    # -------------------------------------------------------------------------
    # ETAPA 2: DETECTAR SO (mesma lógica do infoblox.yaml)
    # -------------------------------------------------------------------------
    - name: SO | Detectar sistema operacional
      ansible.builtin.raw: cat /etc/redhat-release 2>/dev/null || cat /etc/system-release 2>/dev/null || uname -s 2>/dev/null
      register: so_detect
      when: ssh_ok | default(false)
      changed_when: false

    - name: SO | Registrar SO detectado (simplificado)
      ansible.builtin.set_fact:
        so_detectado: >-
          {%- if 'Red Hat' in so_detect.stdout -%}
            RHEL
          {%- elif 'SunOS' in so_detect.stdout -%}
            SunOS
          {%- elif 'CentOS' in so_detect.stdout -%}
            CentOS
          {%- elif 'Oracle' in so_detect.stdout -%}
            Oracle Linux
          {%- elif 'Ubuntu' in so_detect.stdout -%}
            Ubuntu
          {%- else -%}
            Linux
          {%- endif -%}
      when: ssh_ok | default(false)

    # -------------------------------------------------------------------------
    # ETAPA 3: TESTAR PORTA 53 (mesma lógica dos roles - nc/telnet/dig/nmap)
    # Compartilhado entre pre-check e pos-validacao.
    # -------------------------------------------------------------------------
    - name: DNS | Testar conectividade DNS - IP 1
      ansible.builtin.raw: |
        IP="{{ dns_ips[datacenter][0] }}"

        NC_OK=0
        TELNET_OK=0
        DIG_OK=0
        NMAP_OK=0

        # Teste com nc
        if command -v nc >/dev/null 2>&1 && nc -h 2>&1 | grep -q '\-z'; then
          nc -z -w2 $IP 53 >/dev/null 2>&1 && NC_OK=1
        fi

        # Fallback com telnet
        if command -v telnet >/dev/null 2>&1; then
          telnet_output=$(echo quit | telnet $IP 53 2>/dev/null)
          echo "$telnet_output" | grep -q "Escape character" && TELNET_OK=1
        fi

        # Teste com dig
        if command -v dig >/dev/null 2>&1; then
          dig @$IP google.com +time=2 +tries=1 2>/dev/null | grep -q "^;; SERVER:" && DIG_OK=1
        fi

        # Teste com nmap
        if command -v nmap >/dev/null 2>&1; then
          nmap -p 53 -Pn --host-timeout 5s $IP 2>/dev/null | grep "53/tcp" | grep -q "open" && NMAP_OK=1
        fi

        if [ "$NC_OK" -eq 1 ] || \
           [ "$TELNET_OK" -eq 1 ] || \
           [ "$DIG_OK" -eq 1 ] || \
           [ "$NMAP_OK" -eq 1 ]; then
          echo "DNS1_OK"
        else
          echo "DNS1_FALHA"
        fi
      register: dns1_test
      when: ssh_ok | default(false)
      changed_when: false

    - name: DNS | Testar conectividade DNS - IP 2
      ansible.builtin.raw: |
        IP="{{ dns_ips[datacenter][1] }}"

        NC_OK=0
        TELNET_OK=0
        DIG_OK=0
        NMAP_OK=0

        # Teste com nc
        if command -v nc >/dev/null 2>&1 && nc -h 2>&1 | grep -q '\-z'; then
          nc -z -w2 $IP 53 >/dev/null 2>&1 && NC_OK=1
        fi

        # Fallback com telnet
        if command -v telnet >/dev/null 2>&1; then
          telnet_output=$(echo quit | telnet $IP 53 2>/dev/null)
          echo "$telnet_output" | grep -q "Escape character" && TELNET_OK=1
        fi

        # Teste com dig
        if command -v dig >/dev/null 2>&1; then
          dig @$IP google.com +time=2 +tries=1 2>/dev/null | grep -q "^;; SERVER:" && DIG_OK=1
        fi

        # Teste com nmap
        if command -v nmap >/dev/null 2>&1; then
          nmap -p 53 -Pn --host-timeout 5s $IP 2>/dev/null | grep "53/tcp" | grep -q "open" && NMAP_OK=1
        fi

        if [ "$NC_OK" -eq 1 ] || \
           [ "$TELNET_OK" -eq 1 ] || \
           [ "$DIG_OK" -eq 1 ] || \
           [ "$NMAP_OK" -eq 1 ]; then
          echo "DNS2_OK"
        else
          echo "DNS2_FALHA"
        fi
      register: dns2_test
      when: ssh_ok | default(false)
      changed_when: false

    - name: DNS | Registrar status porta 53
      ansible.builtin.set_fact:
        dns1_ok: "{{ dns1_test.stdout is defined and 'DNS1_OK' in dns1_test.stdout }}"
        dns2_ok: "{{ dns2_test.stdout is defined and 'DNS2_OK' in dns2_test.stdout }}"
      when: ssh_ok | default(false)

    - name: DNS | Ler resolv.conf (somente leitura)
      ansible.builtin.raw: cat /etc/resolv.conf 2>/dev/null
      register: resolv_conf
      when: ssh_ok | default(false)
      changed_when: false

    - name: DNS | Validar nameservers Infoblox
      ansible.builtin.set_fact:
        resolv_conf_ok: >-
          {{
            dns_ips[datacenter][0] in (resolv_conf.stdout | default(''))
            and
            dns_ips[datacenter][1] in (resolv_conf.stdout | default(''))
          }}
      when: ssh_ok | default(false)

    # =========================================================================
    # ETAPA 3B: COLETAS ADICIONAIS - EXCLUSIVAS DA POS-VALIDACAO (READ-ONLY)
    # =========================================================================
    - name: POS | Ler atributos do resolv.conf (lsattr - somente leitura)
      ansible.builtin.raw: |
        if command -v lsattr >/dev/null 2>&1; then
          ATTRS=$(lsattr /etc/resolv.conf 2>/dev/null | awk '{print $1}')
          echo "ATTRS=$ATTRS"
          case "$ATTRS" in
            *i*) echo "IMMUT_YES" ;;
            *)   echo "IMMUT_NO" ;;
          esac
        else
          echo "LSATTR_NA"
        fi
      register: lsattr_result
      when:
        - modo == 'pos-validacao'
        - ssh_ok | default(false)
      changed_when: false

    - name: POS | Ler nsswitch.conf (linha hosts - somente leitura)
      ansible.builtin.raw: grep '^hosts:' /etc/nsswitch.conf 2>/dev/null || echo "NSSWITCH_SEM_HOSTS"
      register: nsswitch_result
      when:
        - modo == 'pos-validacao'
        - ssh_ok | default(false)
      changed_when: false

    - name: POS | Consolidar evidências da pós-validação
      ansible.builtin.set_fact:
        escopo_ok: "{{ ('Red Hat' in (so_detect.stdout | default(''))) or ('CentOS' in (so_detect.stdout | default(''))) or ('Oracle' in (so_detect.stdout | default(''))) or ('SunOS' in (so_detect.stdout | default(''))) }}"
        is_rhel: "{{ ('Red Hat' in (so_detect.stdout | default(''))) or ('CentOS' in (so_detect.stdout | default(''))) or ('Oracle' in (so_detect.stdout | default(''))) }}"
        is_sunos: "{{ 'SunOS' in (so_detect.stdout | default('')) }}"
        imutavel_ok: "{{ 'IMMUT_YES' in (lsattr_result.stdout | default('')) }}"
        nsswitch_line: "{{ (nsswitch_result.stdout | default('')) | trim }}"
        nsswitch_ok: "{{ ('dns' in (nsswitch_result.stdout | default(''))) and ('files' in (nsswitch_result.stdout | default(''))) }}"
        dns_encontrado: "{{ resolv_conf.stdout_lines | default([]) | select('search', '^nameserver') | map('replace', 'nameserver ', '') | map('trim') | list | join(', ') }}"
      when:
        - modo == 'pos-validacao'
        - ssh_ok | default(false)

    # -------------------------------------------------------------------------
    # ETAPA 4A: CLASSIFICAR RESULTADO - MODO VALIDATION (PRE-CHECK) - INALTERADO
    # -------------------------------------------------------------------------
    - name: RESULTADO | Classificar host (pre-check)
      ansible.builtin.set_fact:
        resultado_host:
          ip: "{{ inventory_hostname }}"
          so: "{{ so_detectado | default('Desconhecido') }}"
          datacenter: "{{ datacenter }}"
          resolv_conf_status: >-
            {%- if resolv_conf_ok | default(false) -%}
              RESOLV.CONF JA CORRETO
            {%- else -%}
              
            {%- endif -%}
          status: >-
            {%- if not (ssh_ok | default(false)) -%}
              FALHA
            {%- elif not (dns1_ok | default(false)) or not (dns2_ok | default(false)) -%}
              FALHA
            {%- else -%}
              OK
            {%- endif -%}
          tipo_erro: >-
            {%- set erro_msg = ssh_erro_msg | default('') -%}
            {%- if not (ssh_ok | default(false)) -%}
              {%- if 'Permission denied' in erro_msg -%}
                PERMISSAO_ROOT
              {%- elif 'Connection refused' in erro_msg -%}
                FIREWALL_22
              {%- elif 'Connection timed out' in erro_msg or 'No route to host' in erro_msg -%}
                FIREWALL_22
              {%- elif 'Timer expired' in erro_msg or 'timed out' in erro_msg -%}
                TIMEOUT
              {%- else -%}
                FIREWALL_22
              {%- endif -%}
            {%- elif not (dns1_ok | default(false)) or not (dns2_ok | default(false)) -%}
              FIREWALL_53
            {%- else -%}
              NENHUM
            {%- endif -%}
          mensagem: >-
            {%- set erro_msg = ssh_erro_msg | default('') -%}
            {%- if not (ssh_ok | default(false)) -%}
              {%- if 'Permission denied' in erro_msg -%}
                Sem acesso SSH - Permission denied
              {%- elif 'Connection refused' in erro_msg -%}
                Porta 22 bloqueada - Connection refused
              {%- elif 'Connection timed out' in erro_msg or 'No route to host' in erro_msg -%}
                Sem conectividade - Timeout ou rota inexistente
              {%- elif 'Timer expired' in erro_msg -%}
                Timeout SSH - bash_profile lento
              {%- else -%}
                Falha SSH - {{ erro_msg | regex_replace('\n', ' ') | truncate(80) }}
              {%- endif -%}
            {%- elif not (dns1_ok | default(false)) or not (dns2_ok | default(false)) -%}
              Porta 53 bloqueada - Solicitar regra de firewall para DNS Infoblox
            {%- else -%}
              OK - Conexao SSH e porta 53 validadas com sucesso
            {%- endif -%}
      when: modo == 'validation'

    # -------------------------------------------------------------------------
    # ETAPA 4B: CLASSIFICAR RESULTADO - MODO POS-VALIDACAO (fiel aos roles)
    # -------------------------------------------------------------------------
    - name: RESULTADO | Classificar host (pos-validacao)
      ansible.builtin.set_fact:
        resultado_host:
          ip: "{{ inventory_hostname }}"
          datacenter: "{{ datacenter }}"
          so: "{{ so_detectado | default('Desconhecido') }}"
          escopo: >-
            {%- if not (ssh_ok | default(false)) -%}
              INDETERMINADO
            {%- elif escopo_ok | default(false) -%}
              EM ESCOPO
            {%- else -%}
              FORA DE ESCOPO
            {%- endif -%}
          dns_esperado: "{{ dns_ips[datacenter] | join(', ') }}"
          dns_encontrado: "{{ dns_encontrado | default('') }}"
          teste_dns1: >-
            {%- if not (ssh_ok | default(false)) -%}
              N/A
            {%- elif dns1_ok | default(false) -%}
              OK
            {%- else -%}
              FALHA
            {%- endif -%}
          teste_dns2: >-
            {%- if not (ssh_ok | default(false)) -%}
              N/A
            {%- elif dns2_ok | default(false) -%}
              OK
            {%- else -%}
              FALHA
            {%- endif -%}
          resolv_conf: >-
            {%- if not (ssh_ok | default(false)) -%}
              N/A
            {%- elif resolv_conf_ok | default(false) -%}
              DNS esperado presente
            {%- else -%}
              DNS esperado ausente
            {%- endif -%}
          nsswitch: >-
            {%- if not (is_sunos | default(false)) -%}
              N/A
            {%- elif nsswitch_ok | default(false) -%}
              hosts: files dns
            {%- else -%}
              {{ nsswitch_line | default('ausente') }}
            {%- endif -%}
          imutabilidade: >-
            {%- if not (is_rhel | default(false)) -%}
              N/A
            {%- elif imutavel_ok | default(false) -%}
              IMUTAVEL
            {%- else -%}
              NAO IMUTAVEL
            {%- endif -%}
          status: >-
            {%- if not (ssh_ok | default(false)) -%}
              ERRO DE CONECTIVIDADE
            {%- elif not (escopo_ok | default(false)) -%}
              FORA DE ESCOPO
            {%- elif not (resolv_conf_ok | default(false)) -%}
              FALHA
            {%- elif not (dns1_ok | default(false)) or not (dns2_ok | default(false)) -%}
              FALHA
            {%- elif (is_rhel | default(false)) and not (imutavel_ok | default(false)) -%}
              FALHA
            {%- elif (is_sunos | default(false)) and not (nsswitch_ok | default(false)) -%}
              FALHA
            {%- else -%}
              SUCESSO
            {%- endif -%}
          motivo: >-
            {%- set erro_msg = ssh_erro_msg | default('') -%}
            {%- if not (ssh_ok | default(false)) -%}
              {%- if 'Permission denied' in erro_msg -%}
                SSH indisponível - Permission denied
              {%- elif 'Connection refused' in erro_msg -%}
                SSH indisponível - Porta 22 recusada (Connection refused)
              {%- elif 'timed out' in erro_msg or 'No route to host' in erro_msg or 'Timer expired' in erro_msg -%}
                SSH indisponível - Timeout ou sem rota
              {%- else -%}
                SSH indisponível
              {%- endif -%}
            {%- elif not (escopo_ok | default(false)) -%}
              Servidor fora do escopo dos roles de deploy (apenas Red Hat/CentOS/Oracle Linux e SunOS)
            {%- elif not (resolv_conf_ok | default(false)) -%}
              DNS esperado não encontrado no /etc/resolv.conf
            {%- elif not (dns1_ok | default(false)) -%}
              DNS {{ dns_ips[datacenter][0] }} não respondeu na porta 53
            {%- elif not (dns2_ok | default(false)) -%}
              DNS {{ dns_ips[datacenter][1] }} não respondeu na porta 53
            {%- elif (is_rhel | default(false)) and not (imutavel_ok | default(false)) -%}
              atributo de imutabilidade esperado não encontrado
            {%- elif (is_sunos | default(false)) and not (nsswitch_ok | default(false)) -%}
              nsswitch.conf não possui hosts: files dns
            {%- else -%}
              Pós-validação concluída com sucesso
            {%- endif -%}
          evidencia: >-
            {%- set ns = nsswitch_line | default('') -%}
            resolv=[{{ dns_encontrado | default('') }}];
            dns1={{ 'OK' if dns1_ok | default(false) else 'FALHA' }};
            dns2={{ 'OK' if dns2_ok | default(false) else 'FALHA' }};
            imut={{ 'sim' if imutavel_ok | default(false) else ('n/a' if not (is_rhel | default(false)) else 'nao') }};
            nsswitch={{ ns if ns else 'n/a' }}
      when: modo == 'pos-validacao'

# =============================================================================
# PLAY 3: GERAR RELATÓRIO E ENVIAR EMAIL
# =============================================================================
- name: Gerar relatorio e enviar email
  hosts: localhost
  gather_facts: true
  connection: local

  vars:
    modo: "{{ modo_validacao | default('validation') }}"
    relatorio_excel: "/tmp/infoblox_linux_{{ ansible_date_time.date }}_{{ ansible_date_time.hour }}{{ ansible_date_time.minute }}.xlsx"

  tasks:
    # -------------------------------------------------------------------------
    # COMPILAR RESULTADOS (compartilhado)
    # -------------------------------------------------------------------------
    - name: RELATORIO | Compilar todos os resultados
      ansible.builtin.set_fact:
        resultados: >-
          {{
            groups['unix'] | default([]) | map('extract', hostvars)
            | selectattr('resultado_host', 'defined')
            | map(attribute='resultado_host')
            | list
          }}

    - name: RELATORIO | Adicionar hosts não processados (pre-check)
      ansible.builtin.set_fact:
        resultados: >-
          {{
            resultados + [{
              'ip': item,
              'so': 'Desconhecido',
              'datacenter': datacenter | default('N/A'),
              'status': 'FALHA',
              'tipo_erro': 'NAO_PROCESSADO',
              'resolv_conf_status': '',
              'mensagem': 'Host nao foi processado - verificar logs'
            }]
          }}
      loop: "{{ groups['unix'] | default([]) }}"
      when:
        - modo == 'validation'
        - hostvars[item].resultado_host is not defined

    - name: RELATORIO | Adicionar hosts não processados (pos-validacao)
      ansible.builtin.set_fact:
        resultados: >-
          {{
            resultados + [{
              'ip': item,
              'datacenter': datacenter | default('N/A'),
              'so': 'Desconhecido',
              'escopo': 'INDETERMINADO',
              'dns_esperado': '',
              'dns_encontrado': '',
              'teste_dns1': 'N/A',
              'teste_dns2': 'N/A',
              'resolv_conf': 'N/A',
              'nsswitch': 'N/A',
              'imutabilidade': 'N/A',
              'status': 'ERRO DE CONECTIVIDADE',
              'motivo': 'Host nao foi processado - verificar logs',
              'evidencia': ''
            }]
          }}
      loop: "{{ groups['unix'] | default([]) }}"
      when:
        - modo == 'pos-validacao'
        - hostvars[item].resultado_host is not defined

    # =========================================================================
    # RAMO A: PRE-CHECK (MODO VALIDATION) - COMPORTAMENTO INALTERADO
    # =========================================================================
    - name: RELATORIO | Calcular contadores (pre-check)
      ansible.builtin.set_fact:
        total_hosts: "{{ resultados | length }}"
        total_ok: "{{ resultados | selectattr('status', 'equalto', 'OK') | list | length }}"
        total_firewall_22: "{{ resultados | selectattr('tipo_erro', 'equalto', 'FIREWALL_22') | list | length }}"
        total_firewall_53: "{{ resultados | selectattr('tipo_erro', 'equalto', 'FIREWALL_53') | list | length }}"
        total_permissao: "{{ resultados | selectattr('tipo_erro', 'equalto', 'PERMISSAO_ROOT') | list | length }}"
        total_timeout: "{{ resultados | selectattr('tipo_erro', 'equalto', 'TIMEOUT') | list | length }}"
        total_outros: "{{ resultados | selectattr('status', 'equalto', 'FALHA') | rejectattr('tipo_erro', 'in', ['FIREWALL_22', 'FIREWALL_53', 'PERMISSAO_ROOT', 'TIMEOUT']) | list | length }}"
      when: modo == 'validation'

    - name: EXCEL | Montar matriz (pre-check)
      ansible.builtin.set_fact:
        excel_matrix: >-
          {%- set matrix = [] -%}
          {%- set _ = matrix.append({'cell_row': 1, 'cell_col': 1, 'cell_value': 'RELATORIO INFOBLOX LINUX - VALIDACAO DNS'}) -%}
          {%- set _ = matrix.append({'cell_row': 3, 'cell_col': 1, 'cell_value': 'Data/Hora:'}) -%}
          {%- set _ = matrix.append({'cell_row': 3, 'cell_col': 2, 'cell_value': ansible_date_time.date ~ ' ' ~ ansible_date_time.time}) -%}
          {%- set _ = matrix.append({'cell_row': 4, 'cell_col': 1, 'cell_value': 'Datacenter:'}) -%}
          {%- set _ = matrix.append({'cell_row': 4, 'cell_col': 2, 'cell_value': datacenter | default('N/A')}) -%}
          {%- set _ = matrix.append({'cell_row': 5, 'cell_col': 1, 'cell_value': 'RDM:'}) -%}
          {%- set _ = matrix.append({'cell_row': 5, 'cell_col': 2, 'cell_value': rdm | default('N/A')}) -%}
          {%- set _ = matrix.append({'cell_row': 7, 'cell_col': 1, 'cell_value': 'RESUMO'}) -%}
          {%- set _ = matrix.append({'cell_row': 8, 'cell_col': 1, 'cell_value': 'Total:'}) -%}
          {%- set _ = matrix.append({'cell_row': 8, 'cell_col': 2, 'cell_value': total_hosts}) -%}
          {%- set _ = matrix.append({'cell_row': 9, 'cell_col': 1, 'cell_value': 'OK:'}) -%}
          {%- set _ = matrix.append({'cell_row': 9, 'cell_col': 2, 'cell_value': total_ok}) -%}
          {%- set _ = matrix.append({'cell_row': 10, 'cell_col': 1, 'cell_value': 'Firewall 53:'}) -%}
          {%- set _ = matrix.append({'cell_row': 10, 'cell_col': 2, 'cell_value': total_firewall_53}) -%}
          {%- set _ = matrix.append({'cell_row': 11, 'cell_col': 1, 'cell_value': 'Firewall 22:'}) -%}
          {%- set _ = matrix.append({'cell_row': 11, 'cell_col': 2, 'cell_value': total_firewall_22}) -%}
          {%- set _ = matrix.append({'cell_row': 12, 'cell_col': 1, 'cell_value': 'Permissao:'}) -%}
          {%- set _ = matrix.append({'cell_row': 12, 'cell_col': 2, 'cell_value': total_permissao}) -%}
          {%- set _ = matrix.append({'cell_row': 13, 'cell_col': 1, 'cell_value': 'Timeout:'}) -%}
          {%- set _ = matrix.append({'cell_row': 13, 'cell_col': 2, 'cell_value': total_timeout}) -%}
          {%- set _ = matrix.append({'cell_row': 14, 'cell_col': 1, 'cell_value': 'Outros:'}) -%}
          {%- set _ = matrix.append({'cell_row': 14, 'cell_col': 2, 'cell_value': total_outros}) -%}
          {%- set _ = matrix.append({'cell_row': 16, 'cell_col': 1, 'cell_value': 'IP'}) -%}
          {%- set _ = matrix.append({'cell_row': 16, 'cell_col': 2, 'cell_value': 'SO'}) -%}
          {%- set _ = matrix.append({'cell_row': 16, 'cell_col': 3, 'cell_value': 'STATUS'}) -%}
          {%- set _ = matrix.append({'cell_row': 16, 'cell_col': 4, 'cell_value': 'TIPO_ERRO'}) -%}
          {%- set _ = matrix.append({'cell_row': 16, 'cell_col': 5, 'cell_value': 'RESOLV.CONF'}) -%}
          {%- set _ = matrix.append({'cell_row': 16, 'cell_col': 6, 'cell_value': 'MENSAGEM'}) -%}
          {%- for item in resultados -%}
            {%- set row = loop.index + 16 -%}
