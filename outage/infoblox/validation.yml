            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 2, 'cell_value': item.datacenter | default('') | trim}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 3, 'cell_value': item.so | default('') | trim}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 4, 'cell_value': item.escopo | default('') | trim}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 5, 'cell_value': item.dns_esperado | default('') | trim}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 6, 'cell_value': item.dns_encontrado | default('') | trim}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 7, 'cell_value': item.teste_dns1 | default('') | trim}) -%}
