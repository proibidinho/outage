- name: Tornando o resolv.conf imutável para evitar sobrescrita
  ansible.builtin.raw: |
    if command -v chattr >/dev/null 2>&1; then
      chattr +i /etc/resolv.conf
    fi
  when: dns_one_sucesso and dns_two_sucesso and resolv_alterado.rc != 0

- name: 3-Extraindo os atributos do arquivo resolv.conf após todas as alterações 
  ansible.builtin.raw: lsattr /etc/resolv.conf
  register: atributos_final
  when: dns_one_sucesso and dns_two_sucesso and resolv_alterado.rc != 0

- name: 3-Exibindo os atributos do arquivo resolv.conf após todas as alterações 
  ansible.builtin.debug:
    msg: |
      "Atributos finais: {{ atributos_final.stdout_lines | select('search', '/etc/resolv.conf') | list | first }}"
  when: dns_one_sucesso and dns_two_sucesso and resolv_alterado.rc != 0

- name: Extraindo o conteúdo do resolv.conf depois das alterações
  ansible.builtin.raw: cat /etc/resolv.conf
  register: resolv_info
  when: dns_one_sucesso and dns_two_sucesso

- name: Convertendo o conteúdo do resolv.conf para uma variável
  set_fact:
    filtered_lines: >-
      {{
        resolv_info.stdout_lines
        | select('search', '^(search|nameserver) ')
        | list
      }}
  when: dns_one_sucesso and dns_two_sucesso

- name: Exibindo o conteúdo do resolv.conf depois das alterações
  ansible.builtin.debug:
    msg: "{{ filtered_lines  }}"
  when: dns_one_sucesso and dns_two_sucesso