- name: Extraindo o conteúdo do novo resolv.conf
  ansible.builtin.raw: cat /etc/resolv.conf
  register: resolv_info
  when: dns_one_sucesso and dns_two_sucesso and resolv_alterado.rc != 0

- name: Convertendo o conteúdo do resolv.conf para uma variável
  ansible.builtin.set_fact:
    filtered_lines: >-
      {{
        resolv_info.stdout_lines
        | select('search', '^(search|nameserver)')
        | list
      }}
  when: dns_one_sucesso and dns_two_sucesso and resolv_alterado.rc != 0  

- name: Exibindo o conteúdo do novo resolv.conf
  ansible.builtin.debug:
    msg: "{{ filtered_lines  }}"
  when: dns_one_sucesso and dns_two_sucesso and resolv_alterado.rc != 0 

- name: Capturando o conteúdo do arquivo nsswitch.conf após a modificação
  ansible.builtin.raw: grep '^hosts:' /etc/nsswitch.conf || true
  register: conteudo_nsswitch
  when: dns_one_sucesso and dns_two_sucesso and resolv_alterado.rc != 0

- name: Exibindo o conteúdo do arquivo nsswitch.conf após a modificação
  ansible.builtin.debug:
    msg: "{{ conteudo_nsswitch.stdout }}"
  when: dns_one_sucesso and dns_two_sucesso and resolv_alterado.rc != 0