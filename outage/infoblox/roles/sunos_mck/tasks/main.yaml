#Configurando o resolv.conf
- name: Alterando o /etc/resolv.conf
  ansible.builtin.raw: |
    cat > /etc/resolv.conf <<EOF
    # <!-- BEGIN ANSIBLE MANAGED BLOCK aap -->
    search claro.com.br corp.clarobr cpqcloud.corp.clarobr compute.cloud.corp.clarobr cloud.corp.clarobr nt.embratel.com.br embratel.com.br
    nameserver 10.53.22.101
    nameserver 10.54.44.13
    # <!-- END ANSIBLE MANAGED BLOCK aap -->
    EOF
  when: dns_one_sucesso and dns_two_sucesso and resolv_alterado.rc != 0

#Ajustando o nsswitch.conf
- name: Capturar o conteúdo do arquivo nsswitch.conf
  ansible.builtin.raw: grep '^hosts:' /etc/nsswitch.conf || true
  register: conteudo_nsswitch
  when: dns_one_sucesso and dns_two_sucesso and resolv_alterado.rc != 0

- name: Exibir o conteúdo do arquivo nsswitch.conf
  ansible.builtin.debug:
    msg: "{{ conteudo_nsswitch.stdout }}"
  when: dns_one_sucesso and dns_two_sucesso and resolv_alterado.rc != 0

- name: Ajustando o arquivo /etc/nsswitch.conf que não contém a consulta cluster
  ansible.builtin.raw: |
    grep -v '^hosts:' /etc/nsswitch.conf > /tmp/nsswitch.conf && mv /tmp/nsswitch.conf /etc/nsswitch.conf
  when: dns_one_sucesso and dns_two_sucesso and resolv_alterado.rc != 0 and ("cluster" not in conteudo_nsswitch.stdout)

- name: Ajustando o arquivo /etc/nsswitch.conf para consultar o dns infoblox
  ansible.builtin.raw: |
    echo hosts: files dns >> /etc/nsswitch.conf
  when: dns_one_sucesso and dns_two_sucesso and resolv_alterado.rc != 0 and ("cluster" not in conteudo_nsswitch.stdout)

