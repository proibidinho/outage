---
- name: Validar configuração do Dynatrace
  ansible.builtin.assert:
    that:
      - dynatrace_url | length > 0
      - dynatrace_token | length > 0
    fail_msg: >-
      Configure dynatrace_url e forneça dynatrace_token pelo AAP.

- name: Inicializar lista de entidades Dynatrace
  ansible.builtin.set_fact:
    dynatrace_entities: []

- name: Localizar ativos no Dynatrace
  ansible.builtin.uri:
    url: >-
      {{ (dynatrace_url | regex_replace('/+$', ''))
      ~ '/api/v2/entities?entitySelector=type(HOST),entityName.contains(%22'
      ~ item
      ~ '%22)&pageSize=100' }}
    method: GET
    headers:
      Authorization: "Api-Token {{ dynatrace_token }}"
      Accept: application/json
    status_code: 200
  loop: "{{ gmud.ativos }}"
  environment: "{{ proxy_env }}"
  register: dynatrace_busca
  no_log: true
  loop_control:
    label: "{{ item }}"
  failed_when: false

- name: Debug busca Dynatrace
  ansible.builtin.debug:
    var: dynatrace_busca.results

- name: Montar lista de Entity IDs
  ansible.builtin.set_fact:
    dynatrace_entities: >-
      {{
        dynatrace_entities +
        (
          item.json.entities | default([])
          | map(attribute='entityId')
          | list
        )
      }}
  loop: "{{ dynatrace_busca.results }}"
  no_log: false

- name: Debug entidades encontradas
  ansible.builtin.debug:
    var: dynatrace_entities

- name: Definir se a GMUD é válida para criação da Maintenance Window
  ansible.builtin.set_fact:
    gmud_valida: "{{ dynatrace_entities | length == gmud.ativos | length }}"

- name: Informar GMUD ignorada por ativo não encontrado no Dynatrace
  ansible.builtin.debug:
    msg: >-
      GMUD {{ gmud.chave }} ignorada: nem todos os ativos foram encontrados
      no Dynatrace. Nenhuma Maintenance Window será criada para esta GMUD.
  when: not gmud_valida

- name: Mostrar o que será colocado em manutenção
  ansible.builtin.debug:
    msg:
      gmud: "{{ gmud.chave }}"
      inicio: "{{ gmud.inicio }}"
      fim: "{{ gmud.fim }}"
      ativos: "{{ gmud.ativos }}"
      dynatrace_entities: "{{ dynatrace_entities }}"
  when: gmud_valida

- name: Criar ou validar Maintenance Window
  ansible.builtin.uri:
    url: >-
      {{ (dynatrace_url | regex_replace('/+$', ''))
      ~ '/api/v2/settings/objects?validateOnly='
      ~ (dynatrace_validate_only | string | lower) }}
    method: POST
    headers:
      Authorization: "Api-Token {{ dynatrace_token }}"
      Accept: application/json
      Content-Type: application/json
    body_format: json
    body:
      - schemaId: "builtin:alerting.maintenance-window"
        scope: "environment"
        value:
          enabled: true

          generalProperties:
            name: "GMUD {{ gmud.chave }}"
            description: >-
              Outage automático para a GMUD {{ gmud.chave }} -
              {{ gmud.resumo }}

            maintenanceType: "PLANNED"
            suppression: "DETECT_PROBLEMS_AND_ALERT"
            disableSyntheticMonitorExecution: false

          schedule:
            scheduleType: "ONCE"
            onceRecurrence:
              startTime: "{{ gmud.inicio | regex_replace('\\.000-0300$', '') }}"
              endTime: "{{ gmud.fim | regex_replace('\\.000-0300$', '') }}"
              timeZone: "{{ dynatrace_timezone }}"

          filters:
            - entityType: "HOST"
              entityId: "{{ dynatrace_entities | first }}"
    status_code:
      - 200
      - 201
      - 207
  environment: "{{ proxy_env }}"
  register: outage_result
  no_log: false
  when: gmud_valida

- name: Informar resultado
  ansible.builtin.debug:
    msg:
      gmud: "{{ gmud.chave }}"
      resultado: >-
        {{
          'VALIDAÇÃO OK - nenhuma janela foi criada'
          if dynatrace_validate_only
          else 'Maintenance Window criada com sucesso'
        }}
  when: gmud_valida