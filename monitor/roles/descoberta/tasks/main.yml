# ============================================================
# 1. Buscar chamados candidatos
#
# A JQL usa "~" (busca de texto, aproximada). Por isso ela só
# traz candidatos; o filtro exato por summary é feito no passo 2.
# Os dois resumos vêm do playbook (jira_resumo_atualizacao e
# jira_resumo_criacao), para JQL e filtro local nunca divergirem.
# ============================================================

- name: Buscar chamados de atualização e de criação de alerta
  ansible.builtin.uri:
    url: "{{ jira_base_url }}/rest/api/3/search/jql"
    method: POST
    force_basic_auth: true
    user: "{{ jira_user }}"
    password: "{{ jira_password }}"
    headers:
      Accept: application/json
      Content-Type: application/json
    body_format: json
    body:
      jql: >-
        {% if jira_chamado | length > 0 %}
        key = {{ jira_chamado }}
        {% else %}
        project = {{ projeto_jira }}
        AND (summary ~ "\"{{ jira_resumo_atualizacao }}\""
        OR summary ~ "\"{{ jira_resumo_criacao }}\"")
        AND statusCategory != Done
        {% endif %}
      maxResults: 1000
      fields:
        - summary
        - description
        - customfield_10238
    status_code: 200
  register: jira_search
  environment: "{{ proxy_env }}"

# ============================================================
# 2. Manter somente chamados válidos. O resumo (summary) do chamado
#    precisa CONTER o texto de jira_resumo_atualizacao ou de
#    jira_resumo_criacao (comparação tolerante, explicada abaixo). Isso decide se o chamado é de
#    atualização ou de criação.
# ============================================================

# ============================================================
# FUTURAMENTE REATIVAR:
#
# | selectattr('fields.customfield_10238', 'defined')
# | selectattr(
#     'fields.customfield_10238.name',
#     'equalto',
#     'CLBR-TI-OPS-IT_SERVICE_MONITORING'
#   )
#
# ============================================================

# CORREÇÃO: antes o filtro comparava com 'Atualização de alerta',
# texto diferente do resumo usado na JQL. Agora o filtro usa as mesmas
# variáveis da JQL. A comparação é tolerante a detalhes que não mudam o
# sentido: maiúsculas/minúsculas, espaços repetidos ou "não separáveis" e
# tipo de hífen/pontuação ("-", "–", "—"). Os dois textos são normalizados
# (minúsculas, tudo que não é letra/número vira um único espaço) e o resumo
# do chamado precisa conter o texto da variável. "Atualização de alerta"
# (resumo antigo, sem "de Certificado - Zabbix") NÃO casa.
- name: Selecionar tickets de atualização e de criação de alerta
  ansible.builtin.set_fact:
    tickets_atualizacao: >-
      {%- set alvo = jira_resumo_atualizacao | lower | regex_replace('[\\W_]+', ' ') | trim -%}
      {%- set r = namespace(lista=[]) -%}
      {%- for t in jira_search.json.issues -%}
      {%- if alvo in (t.fields.summary | default('') | lower | regex_replace('[\\W_]+', ' ') | trim) -%}
      {%- set r.lista = r.lista + [t] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ r.lista }}
    tickets_criacao: >-
      {%- set alvo = jira_resumo_criacao | lower | regex_replace('[\\W_]+', ' ') | trim -%}
      {%- set r = namespace(lista=[]) -%}
      {%- for t in jira_search.json.issues -%}
      {%- if alvo in (t.fields.summary | default('') | lower | regex_replace('[\\W_]+', ' ') | trim) -%}
      {%- set r.lista = r.lista + [t] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ r.lista }}

- name: Juntar os tickets selecionados
  ansible.builtin.set_fact:
    tickets_certificados: "{{ tickets_atualizacao + tickets_criacao }}"

# A JQL aproximada pode trazer chamados parecidos; avisa quais foram ignorados.
- name: Avisar sobre chamados retornados pela busca e ignorados
  ansible.builtin.debug:
    msg: "Ignorado (resumo diferente dos esperados): {{ item.key }} - {{ item.fields.summary }}"
  loop: >-
    {{
      jira_search.json.issues
      | rejectattr('key', 'in', tickets_certificados | map(attribute='key') | list)
      | list
    }}
  loop_control:
    label: "{{ item.key }}"

# Se a Survey informou o chamado e ele não foi aproveitado, diz o motivo provável.
- name: Avisar quando o chamado informado na Survey não foi aproveitado
  ansible.builtin.debug:
    msg: >-
      O chamado {{ jira_chamado }} não foi encontrado ou o resumo dele não contém
      "{{ jira_resumo_atualizacao }}" nem "{{ jira_resumo_criacao }}".
  when:
    - jira_chamado | length > 0
    - tickets_certificados | length == 0

# ============================================================
# 3. Mostrar resultado
# ============================================================

- name: Mostrar chamados encontrados
  ansible.builtin.debug:
    msg:
      ticket: "{{ item.key }}"
      resumo: "{{ item.fields.summary }}"
      blocos_adf: "{{ item.fields.description.content | default([]) | length }}"
  loop: "{{ tickets_certificados }}"
  loop_control:
    label: "{{ item.key }}"

# - name: Mostrar somente tipo dos blocos
#   debug:
#     msg:
#       tipo: "{{ bloco.type }}"
#       texto: "{{ bloco.content[0].text | default('') }}"
#   loop: "{{ tickets_certificados[0].fields.description.content }}"
#   loop_control:
