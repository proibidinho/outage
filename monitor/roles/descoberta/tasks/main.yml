# ============================================================
# 1. Buscar chamados candidatos
#
# A JQL usa "~" (busca de texto, aproximada). Por isso ela só
# traz candidatos; o filtro exato por summary é feito no passo 2.
# Os dois resumos vêm do playbook (jira_resumo_atualizacao e
# jira_resumo_criacao), para JQL e filtro local nunca divergirem.
# ============================================================

- name: Buscar chamados de atualização e de criação de alerta
  ansible.builtin.uri:
    url: "{{ jira_base_url }}/rest/api/3/search/jql"
    method: POST
    force_basic_auth: true
    user: "{{ jira_user }}"
    password: "{{ jira_password }}"
    headers:
      Accept: application/json
      Content-Type: application/json
    body_format: json
    body:
      jql: >-
        project = {{ projeto_jira }}
        AND (summary ~ "\"{{ jira_resumo_atualizacao }}\""
        OR summary ~ "\"{{ jira_resumo_criacao }}\"")
        AND statusCategory != Done
      maxResults: 1000
      fields:
        - summary
        - description
        - customfield_10238
    status_code: 200
  register: jira_search
  environment: "{{ proxy_env }}"

# ============================================================
# 2. Manter somente chamados válidos (summary exatamente igual
#    a um dos dois resumos)
# ============================================================

# ============================================================
# FUTURAMENTE REATIVAR:
#
# | selectattr('fields.customfield_10238', 'defined')
# | selectattr(
#     'fields.customfield_10238.name',
#     'equalto',
#     'CLBR-TI-OPS-IT_SERVICE_MONITORING'
#   )
#
# ============================================================

# CORREÇÃO: antes o filtro comparava com 'Atualização de alerta',
# texto diferente do resumo usado na JQL, então nenhum chamado
# passava. Agora o filtro usa as mesmas variáveis da JQL.
- name: Selecionar tickets de atualização e de criação de alerta
  ansible.builtin.set_fact:
    tickets_certificados: >-
      {{
        jira_search.json.issues
        | selectattr('fields.summary', 'in', [jira_resumo_atualizacao, jira_resumo_criacao])
        | list
      }}

# A JQL aproximada pode trazer chamados parecidos; avisa quais foram ignorados.
- name: Avisar sobre chamados retornados pela busca e ignorados
  ansible.builtin.debug:
    msg: "Ignorado (resumo diferente dos esperados): {{ item.key }} - {{ item.fields.summary }}"
  loop: >-
    {{
      jira_search.json.issues
      | rejectattr('fields.summary', 'in', [jira_resumo_atualizacao, jira_resumo_criacao])
      | list
    }}
  loop_control:
    label: "{{ item.key }}"

# ============================================================
# 3. Mostrar resultado
# ============================================================

- name: Mostrar chamados encontrados
  ansible.builtin.debug:
    msg:
      ticket: "{{ item.key }}"
      resumo: "{{ item.fields.summary }}"
      blocos_adf: "{{ item.fields.description.content | default([]) | length }}"
  loop: "{{ tickets_certificados }}"
  loop_control:
    label: "{{ item.key }}"

