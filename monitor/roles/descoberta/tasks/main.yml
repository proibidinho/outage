# ============================================================
# 4. Extrair certificados da descrição (ADF)
#
# Extração ADF preservada. Mudanças:
#   - cada certificado agora carrega 'ticket' e 'operacao'
#     (ATUALIZACAO ou CRIACAO, conforme o summary do chamado);
#   - o resultado vai para certificados_jira, que no passo 5 é
#     separado nas duas listas consumidas pelas roles.
# ============================================================

- name: Inicializar lista de certificados
  ansible.builtin.set_fact:
    certificados_jira: []

- name: Extrair hosts e validades das descrições do Jira
  ansible.builtin.set_fact:
    certificados_jira: >-
      {% set resultado = namespace(certificados=[]) %}
      {% for ticket in tickets_certificados | default([]) %}
      {% set estado = namespace(validade='', tipo='') %}
      {% set operacao = 'CRIACAO' if ticket.fields.summary == jira_resumo_criacao else 'ATUALIZACAO' %}
      {% for bloco in ticket.fields.description.content | default([]) %}
      {% if bloco.type == 'paragraph' %}
      {% set texto = bloco.content | default([])
         | selectattr('type', 'equalto', 'text')
         | map(attribute='text')
         | join('')
         | trim %}
      {% if texto | upper == 'EXTERNO' %}
      {% set estado.tipo = 'Externo' %}
      {% elif texto | upper in ['INTERNO', 'INTERNOS'] %}
      {% set estado.tipo = 'Interno' %}
      {% elif texto is match('^[0-9]{2}/[0-9]{2}/[0-9]{4}$') %}
      {% set estado.validade = texto %}
      {% endif %}
      {% elif bloco.type == 'bulletList' %}
      {% for item in bloco.content | default([]) %}
      {% for paragrafo in item.content | default([]) %}
      {% if paragrafo.type == 'paragraph' %}
      {% set host = (
        paragrafo.content | default([])
        | selectattr('type', 'equalto', 'text')
        | map(attribute='text')
        | join('')
        | trim
        | regex_replace('^\\*\\.', 'star.')
      ) %}
      {% if host and estado.validade %}
      {% set resultado.certificados = resultado.certificados + [
        {
          'ticket': ticket.key,
          'operacao': operacao,
          'host': host,
          'tipo': estado.tipo,
          'validade': estado.validade
        }
      ] %}
      {% endif %}
      {% endif %}
      {% endfor %}
      {% endfor %}
      {% endif %}
      {% endfor %}
      {% endfor %}
      {{ resultado.certificados | to_yaml | from_yaml }}

- name: Converter texto para lista
  ansible.builtin.set_fact:
    certificados_jira: "{{ certificados_jira | from_yaml }}"

# ============================================================
# 5. Separar atualização x criação (nunca se misturam).
#    certificados_para_atualizar mantém o nome original.
#    'unique' remove linhas idênticas repetidas no mesmo chamado.
# ============================================================

- name: Separar certificados de atualização e de criação
  ansible.builtin.set_fact:
    certificados_para_atualizar: "{{ certificados_jira | selectattr('operacao', 'equalto', 'ATUALIZACAO') | unique | list }}"
    certificados_para_criar: "{{ certificados_jira | selectattr('operacao', 'equalto', 'CRIACAO') | unique | list }}"

- name: Exibir certificados encontrados
  ansible.builtin.debug:
    msg:
      operacao: "{{ item.operacao }}"
      ticket: "{{ item.ticket }}"
      host: "{{ item.host }}"
      tipo: "{{ item.tipo }}"
      validade: "{{ item.validade }}"
  loop: "{{ certificados_jira }}"
  loop_control:
    label: "{{ item.operacao }} {{ item.host }}"
