---
# ============================================================
# Role cria: cadastra itens NOVOS de certificado no host
# CERTIFICADOS_CLARO_BRASIL, sem duplicar os que já existem, e
# cria a trigger de expiração de cada item criado.
#
# Entrada (role descoberta):
#   certificados_para_criar:
#     - ticket: GA-456
#       operacao: CRIACAO
#       host: novo.claro.com.br
#       tipo: Externo
#       validade: "20/08/2027"
#
# Saída (consumida pela role relatorios):
#   resultado_criacao (mesmas colunas de resultado_atualizacao,
#   mais key_ com a key do item criado).
#
# Status possíveis:
#   CRIADO         API confirmou a criação do item (e da trigger)
#   SIMULADO       aplicar_alteracoes = false (nada foi gravado)
#   JA_EXISTE      já há item para host + tipo (não cria; para mudar
#                  a data use chamado de atualização)
#   SEM_MODELO     não há item-modelo Enabled do mesmo tipo no host, ou o nome
#                  dele não permite derivar o nome do novo item
#   CONFLITO       chamados pedem validades diferentes para o mesmo
#                  certificado (não cria)
#   TIPO_INVALIDO  descrição do chamado sem Externo/Interno
#   ERRO           a API retornou erro ou não respondeu. Também é usado
#                  quando o item foi criado mas a trigger falhou (a
#                  mensagem informa o itemid; a trigger deve ser criada
#                  manualmente, pois uma nova execução veria JA_EXISTE).
#
# Como o item novo é montado (nada é inventado):
#   - key_       : a key do item-modelo, trocando host e data;
#   - name       : o nome do item-modelo, trocando host e data;
#   - description: a do item-modelo + "Chamado Jira: <ticket>";
#   - hostid     : obtido por host.get do host de certificados;
#   - demais atributos: copiados do item-modelo (cria_campos_modelo).
#
# Trigger (somente para itens CRIADOS): módulo
# community.zabbix.zabbix_trigger, usando a key exata do item criado.
# ============================================================

# ------------------------------------------------------------
# 1. hostid do host de certificados (necessário no item.create).
# ------------------------------------------------------------
- name: Buscar o hostid do host de certificados
  ansible.builtin.uri:
    url: "{{ zabbix_api_url }}"
    method: POST
    body_format: json
    headers:
      Content-Type: application/json-rpc
    body:
      jsonrpc: "2.0"
      method: "host.get"
      params:
        filter:
          host:
            - "{{ zabbix_host_certificados }}"
        output:
          - hostid
          - host
      auth: "{{ zabbix_api_token }}"
      id: 1
    validate_certs: "{{ zabbix_validate_certs }}"
  delegate_to: localhost
  register: zbx_host
  failed_when: >-
    zbx_host.json is not defined
    or zbx_host.json.error is defined
    or zbx_host.json.result is not defined
    or zbx_host.json.result | length != 1

- name: Guardar o hostid
  ansible.builtin.set_fact:
    zbx_hostid: "{{ zbx_host.json.result[0].hostid }}"

# ------------------------------------------------------------
# 2. Itens de certificado já existentes, com TODOS os atributos
#    (output extend), tags e pré-processamento: servem para
#    detectar duplicatas e como modelo.
# ------------------------------------------------------------
- name: Buscar itens de certificado no Zabbix
  ansible.builtin.uri:
    url: "{{ zabbix_api_url }}"
    method: POST
    body_format: json
    headers:
      Content-Type: application/json-rpc
    body:
      jsonrpc: "2.0"
      method: "item.get"
      params:
        hostids: "{{ zbx_hostid }}"
        search:
          key_: "{{ zabbix_chave_certificado }}"
        output: "extend"
        selectTags: "extend"
        selectPreprocessing: "extend"
        sortfield: "itemid"
      auth: "{{ zabbix_api_token }}"
      id: 1
    validate_certs: "{{ zabbix_validate_certs }}"
  delegate_to: localhost
  register: zbx_itens
  failed_when: >-
    zbx_itens.json is not defined
    or zbx_itens.json.error is defined
    or zbx_itens.json.result is not defined

# host_orig guarda o host exatamente como está na key (com maiúsculas
# e minúsculas), usado para trocar o host no nome e na key do modelo.
- name: Interpretar a key dos itens existentes
  ansible.builtin.set_fact:
    zbx_certs: >-
      {%- set r = namespace(lista=[]) -%}
      {%- for i in zbx_itens.json.result -%}
      {%- set p = i.key_ | regex_findall(zabbix_chave_regex) -%}
      {%- if p -%}
      {%- set r.lista = r.lista + [{'itemid': i.itemid, 'name': i.name, 'key_': i.key_, 'host': p[0][0] | lower, 'host_orig': p[0][0], 'tipo': p[0][1] | lower, 'data': p[0][2], 'item': i}] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ r.lista }}

# ------------------------------------------------------------
# 3. Planejar: decide o que fazer com cada certificado, SEM
#    criar nada. Ordem do "status" = prioridade das regras.
#    O payload mostrado é exatamente o que iria no item.create.
# ------------------------------------------------------------
- name: Planejar criações (somente leitura)
  ansible.builtin.debug:
    msg:
      operacao: "CRIACAO"
      ticket: "{{ item.ticket }}"
      host: "{{ item.host }}"
      tipo: "{{ item.tipo }}"
      itemid: "{{ existentes[0].itemid if existentes | length > 0 else '' }}"
      validade_anterior: "{{ existentes[0].data if existentes | length > 0 else '' }}"
      validade_solicitada: "{{ item.validade }}"
      status: "{{ status }}"
      mensagem: "{{ mensagem }}"
      payload: "{{ payload }}"
  vars:
    # itens que já existem para o mesmo host + tipo (qualquer data)
    existentes: >-
      {{ zbx_certs
         | selectattr('host', 'equalto', item.host | lower)
         | selectattr('tipo', 'equalto', item.tipo | lower)
         | list }}
    # item-modelo: primeiro item Enabled (menor itemid) do mesmo tipo.
    # Só Enabled, porque o status do modelo é copiado para o item novo.
    modelo: >-
      {{ zbx_certs
         | selectattr('tipo', 'equalto', item.tipo | lower)
         | selectattr('item.status', 'equalto', '0')
         | first
         | default({}) }}
    # o nome do modelo precisa conter o host para podermos trocá-lo
    modelo_ok: "{{ modelo | length > 0 and modelo.host_orig in modelo.item.name }}"
    datas_pedidas: >-
      {{ certificados_para_criar
         | selectattr('host', 'equalto', item.host)
         | selectattr('tipo', 'equalto', item.tipo)
         | map(attribute='validade')
         | unique
         | list }}
    status: >-
      {{ 'TIPO_INVALIDO' if (item.tipo | lower) not in ['externo', 'interno']
         else 'CONFLITO' if datas_pedidas | length > 1
         else 'JA_EXISTE' if existentes | length > 0
         else 'SEM_MODELO' if not modelo_ok
         else 'PENDENTE' }}
    mensagem: >-
      {{ 'Tipo não identificado na descrição do chamado (esperado Externo ou Interno).' if status == 'TIPO_INVALIDO'
         else 'Chamados pedem validades diferentes para o mesmo certificado (' ~ (datas_pedidas | join(', ')) ~ '). Nada foi criado.' if status == 'CONFLITO'
         else 'Já existe item para este host e tipo (itemid ' ~ existentes[0].itemid ~ ', validade ' ~ existentes[0].data ~ '). Nada foi criado; para mudar a data use um chamado de atualização.' if status == 'JA_EXISTE'
         else 'Sem item-modelo Enabled do tipo ' ~ item.tipo ~ ' no host, ou o nome do modelo não contém o host. Nada foi criado.' if status == 'SEM_MODELO'
         else 'Aguardando criação.' }}
    nome: >-
      {{ modelo.item.name | replace(modelo.host_orig, item.host) | replace(modelo.data, item.validade) if status == 'PENDENTE' else '' }}
    # key do modelo com o host e a data trocados (mantém o formato da key)
    chave: >-
      {{ modelo.key_ | replace('"' ~ modelo.host_orig ~ '"', '"' ~ item.host ~ '"') | regex_replace(zabbix_data_regex, item.validade) if status == 'PENDENTE' else '' }}
    # atributos do modelo (somente os de cria_campos_modelo, e só se preenchidos)
    campos_modelo: >-
      {{ modelo.item | dict2items
         | selectattr('key', 'in', cria_campos_modelo)
         | rejectattr('value', 'in', ['', []])
         | items2dict }}
    # description = a do modelo + "Chamado Jira: <ticket>" (nova linha).
    # Só é avaliada quando PENDENTE (o modelo existe nesse caso).
    descricao_modelo: "{{ modelo.item.description | default('') | string | trim }}"
    # quebra de linha real (YAML entre aspas duplas converte "\n" antes do Jinja)
    quebra_linha: "\n"
    descricao_ticket: >-
      {{ descricao_modelo if ('Chamado Jira: ' ~ item.ticket) in descricao_modelo
         else (descricao_modelo ~ (quebra_linha if descricao_modelo | length > 0 else '') ~ 'Chamado Jira: ' ~ item.ticket) }}
    payload: >-
      {{ ({'hostid': zbx_hostid, 'name': nome, 'key_': chave} | combine(campos_modelo) | combine({'description': descricao_ticket})) if status == 'PENDENTE' else {} }}
  loop: "{{ certificados_para_criar }}"
  loop_control:
    label: "{{ item.host }} ({{ item.tipo }})"
  register: zbx_plano_loop

- name: Guardar o plano
  ansible.builtin.set_fact:
    zbx_plano: "{{ zbx_plano_loop.results | map(attribute='msg') | list }}"

# ------------------------------------------------------------
# 4. Criar. Só vai para a API o que ficou PENDENTE e somente com
#    aplicar_alteracoes = true. failed_when: false -> um erro não
#    interrompe os demais; o resultado real é avaliado no passo 5.
# ------------------------------------------------------------
- name: Criar os itens no Zabbix
  ansible.builtin.uri:
    url: "{{ zabbix_api_url }}"
    method: POST
    body_format: json
    headers:
      Content-Type: application/json-rpc
    body:
      jsonrpc: "2.0"
      method: "item.create"
      params: "{{ item.payload }}"
      auth: "{{ zabbix_api_token }}"
      id: 1
    validate_certs: "{{ zabbix_validate_certs }}"
  delegate_to: localhost
  loop: "{{ zbx_plano }}"
  loop_control:
    label: "{{ item.host }} ({{ item.tipo }})"
  when: item.status == 'PENDENTE' and zabbix_aplicar_alteracoes | bool
  register: zbx_create
  failed_when: false

# ------------------------------------------------------------
# 5. Resultado final dos itens. Sucesso = HTTP 200 + sem "error" no
#    JSON-RPC + um itemid em result.itemids. Qualquer outra coisa
#    vira ERRO com a mensagem da API (ou do transporte).
#    key_ vai na linha para a trigger (passo 6) usar a key exata.
# ------------------------------------------------------------
- name: Consolidar resultado da criação
  ansible.builtin.debug:
    msg:
      operacao: "{{ linha.operacao }}"
      ticket: "{{ linha.ticket }}"
      host: "{{ linha.host }}"
      tipo: "{{ linha.tipo }}"
      itemid: "{{ novo_itemid if status == 'CRIADO' else linha.itemid }}"
      key_: "{{ linha.payload.key_ | default('') }}"
      validade_anterior: "{{ linha.validade_anterior }}"
      validade_solicitada: "{{ linha.validade_solicitada }}"
      status: "{{ status }}"
      mensagem: "{{ mensagem }}"
  vars:
    linha: "{{ item.0 }}"
    resp: "{{ item.1 }}"
    novo_itemid: "{{ resp.json.result.itemids[0] | default('') if resp.json is defined and resp.json.error is not defined else '' }}"
    api_ok: >-
      {{ resp.json is defined
         and resp.json.error is not defined
         and resp.json.result.itemids | default([]) | length == 1 }}
    api_erro: >-
      {{ (resp.json.error.message ~ ' - ' ~ (resp.json.error.data | default('')))
         if resp.json is defined and resp.json.error is defined
         else (resp.msg | default('Sem resposta válida da API.')) }}
    status: >-
      {{ linha.status if linha.status != 'PENDENTE'
         else 'SIMULADO' if resp.skipped | default(false)
         else 'CRIADO' if api_ok
         else 'ERRO' }}
    mensagem: >-
      {{ linha.mensagem if linha.status != 'PENDENTE'
         else 'Simulação (aplicar_alteracoes=false): seria criado o item "' ~ linha.payload.name ~ '" com a key ' ~ linha.payload.key_ ~ ' e a trigger de expiração correspondente.' if status == 'SIMULADO'
         else 'Item criado: ' ~ linha.payload.key_ if status == 'CRIADO'
         else api_erro }}
  loop: "{{ zbx_plano | zip(zbx_create.results) | list }}"
  loop_control:
    label: "{{ item.0.host }} ({{ item.0.tipo }})"
  register: zbx_resultado_loop

- name: Guardar o resultado para o relatório
  ansible.builtin.set_fact:
    resultado_criacao: "{{ zbx_resultado_loop.results | map(attribute='msg') | list }}"

# ------------------------------------------------------------
# 6. Criar trigger somente para itens que foram realmente criados.
#    Em simulação, resultado_criacao não contém status CRIADO, então
#    nenhuma trigger é criada.
#
#    Pontos importantes do módulo community.zabbix.zabbix_trigger:
#    - severity, recovery_mode, correlation_mode, generate_multiple_events,
#      manual_close, enabled, expression, recovery_expression, event_name
#      e tags ficam DENTRO de "params";
#    - o texto de descrição vai em "desc" (campo "comments" da trigger);
#      "description" dentro de params é o NOME da trigger na API e o
#      módulo o sobrescreve com "name";
#    - ignore_errors: se a trigger falhar, o play NÃO pode parar aqui,
#      senão a role relatorios não roda e o e-mail não é enviado. A falha
#      é refletida no resultado no passo 7.
# ------------------------------------------------------------
- name: Criar triggers para certificados recém-criados
  community.zabbix.zabbix_trigger:
    name: "Certificado {{ item.tipo }} {{ item.host | regex_replace('^star\\.', '*.') }} expirado"
    host_name: "{{ zabbix_host_certificados }}"
    desc: |-
      Verifica status do certificado.
      Gera alarme quando estiver expirado
    params:
      event_name: "Certificado {{ item.tipo }} {{ item.host | regex_replace('^star\\.', '*.') }} expirado"
      expression: 'find(/{{ zabbix_host_certificados }}/{{ item.key_ }},#1,"like","expirado")<>0'
      recovery_mode: recovery_expression
      recovery_expression: 'find(/{{ zabbix_host_certificados }}/{{ item.key_ }},#1,"like","OK")<>0'
      # confirme a severidade desejada: not_classified | information |
      # warning | average | high | disaster
      severity: average
      correlation_mode: all
      generate_multiple_events: false
      manual_close: false
      enabled: true
      tags:
        - tag: impacto
          value: SERVICO
        - tag: solucionador
          value: '{$SOLUCIONADOR_GA_CERTIFICADOS}'
    state: present
  delegate_to: "{{ zabbix_inventory_host }}"
  loop: "{{ resultado_criacao | selectattr('status', 'equalto', 'CRIADO') | list }}"
  loop_control:
    label: "{{ item.host }} ({{ item.tipo }})"
  register: zbx_trigger_create
  when: zabbix_aplicar_alteracoes | bool
  ignore_errors: true

- name: Exibir resultado da criação dos triggers
  ansible.builtin.debug:
    msg:
      certificado: "{{ item.item.host }} ({{ item.item.tipo }})"
      trigger: "Certificado {{ item.item.tipo }} {{ item.item.host | regex_replace('^star\\.', '*.') }} expirado"
      resultado: "{{ 'OK' if not (item.failed | default(false)) else 'ERRO' }}"
      mensagem: "{{ item.msg | default('Trigger criada/atualizada.') }}"
  loop: "{{ zbx_trigger_create.results | default([]) }}"
  loop_control:
    label: "{{ item.item.host | default('trigger') }}"
  when: zabbix_aplicar_alteracoes | bool

# ------------------------------------------------------------
# 7. Refletir falhas de trigger no resultado do relatório. Item criado
#    com trigger que falhou vira ERRO (o e-mail mostra o itemid e a
#    role relatorios falha o job DEPOIS de enviar o e-mail). Sem
#    falhas, resultado_criacao permanece exatamente como está.
# ------------------------------------------------------------
- name: Refletir falhas de trigger em resultado_criacao
  ansible.builtin.set_fact:
    resultado_criacao: >-
      {%- set falhas = namespace(lista=[]) -%}
      {%- for t in zbx_trigger_create.results | default([]) if t.failed | default(false) -%}
      {%- set falhas.lista = falhas.lista + [{'itemid': t.item.itemid, 'msg': t.msg | default('sem detalhes')}] -%}
      {%- endfor -%}
      {%- set nova = namespace(lista=[]) -%}
      {%- for r in resultado_criacao -%}
      {%- set f = falhas.lista | selectattr('itemid', 'equalto', r.itemid) | list -%}
      {%- if f | length > 0 -%}
      {%- set nova.lista = nova.lista + [r | combine({'status': 'ERRO', 'mensagem': 'Item criado (itemid ' ~ r.itemid ~ ', key ' ~ r.key_ ~ '), mas a trigger NÃO foi criada: ' ~ f[0].msg ~ ' Crie a trigger manualmente.'})] -%}
      {%- else -%}
      {%- set nova.lista = nova.lista + [r] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ nova.lista }}