---
# ============================================================
# Atributos copiados do item-modelo ao criar um item novo.
#
# O item-modelo é um item já existente no host de certificados com
# o mesmo tipo (Externo/Interno) do certificado a criar. Só os
# campos abaixo, e só quando preenchidos no modelo, vão no
# item.create. hostid, name e key_ são sempre montados pela role.
#
# Se o tipo de item usado em produção exigir outros campos (ex.:
# params, timeout, trapper_hosts, snmp_oid, url...), acrescente-os
# aqui conforme a documentação da versão do Zabbix. Antes de
# executar com aplicar_alteracoes=true, confira o "payload" que a
# simulação mostra para cada certificado.
# ============================================================
cria_campos_modelo:
  - type
  - value_type
  - interfaceid
  - delay
  - history
  - trends
  - units
  - description
  - status
  - tags
  - preprocessing
