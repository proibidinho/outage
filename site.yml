---
# Elasticsearch 6.8 (licenca free/Basic), um unico no. Um playbook, na ordem:
#   1 conferir (somente leitura)  2 disco  3 sistema  4 Java + pacote
#   5 certificado HTTPS + keystore  6 configuracao  7 start + senha do "elastic"  8 validacao
# Pode rodar de novo: o que ja esta pronto nao muda.
- name: Elasticsearch 6.8 single node
  hosts: es68
  gather_facts: true
  vars_files: [vault.yml]               # es_elastic_password, tls_p12_password
  vars:
    es_version: "6.8.23"                # ultima da serie 6.8
    es_cluster_name: es68
    es_heap: 30g                        # metade da RAM, abaixo do limite de ponteiros comprimidos (conferido no final)
    es_java_pkg: java-11-openjdk-headless
    es_java_home: /usr/lib/jvm/jre-11-openjdk
    es_extra_dns: []                    # nomes extras no certificado (ex.: nome de um VIP)
    ntp_server: 10.29.4.200
    elastic_repo_proxy: ""              # proxy para baixar o RPM (vazio = direto)
    data_volume: {vg: vg_esdata, lv: lv_esdata, mount: /var/lib/elasticsearch, disk_gb: 1024}
    data_disk_count: 1                  # quantos discos virgens usar agora (outro depois: ver README)
    es_bin: /usr/share/elasticsearch/bin
    ca_dir: /root/elastic-ca            # CA interna (fica so aqui, modo 0700)
    tls_dir: /etc/elasticsearch/certs
    es_url: "https://{{ ansible_host }}:9200"
  environment:                          # usado pelo certutil e pelo keystore
    JAVA_HOME: "{{ es_java_home }}"
    ES_PATH_CONF: /etc/elasticsearch
  module_defaults:
    ansible.builtin.uri:
      url_username: elastic
      url_password: "{{ es_elastic_password }}"
      force_basic_auth: true
      ca_path: "{{ ca_dir }}/ca.crt"
      body_format: json
      return_content: true

  tasks:
    # ============================ 1) CONFERIR (nada e alterado) ============================
    - name: Conferir sistema operacional e memória
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == 'RedHat'
          - ansible_facts.memtotal_mb >= 60000
        fail_msg: "Esperado RHEL com ~64 GB de RAM (encontrado {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}, {{ ansible_facts.memtotal_mb }} MB)"

    - name: Ver se o volume de dados já existe
      ansible.builtin.stat:
        path: "/dev/mapper/{{ data_volume.vg }}-{{ data_volume.lv }}"
      register: volume

    - name: Procurar discos virgens do tamanho esperado (sem partição e sem assinatura de filesystem/LVM)
      ansible.builtin.shell: |
        min=$(( {{ data_volume.disk_gb }} * 90 / 100 * 1073741824 ))
        max=$(( {{ data_volume.disk_gb }} * 110 / 100 * 1073741824 ))
        for d in $(lsblk -dnpo NAME,TYPE | awk '$2=="disk"{print $1}'); do
          [ "$(lsblk -nr "$d" | wc -l)" -eq 1 ] || continue
          blkid -p "$d" >/dev/null 2>&1 && continue
          s=$(blockdev --getsize64 "$d")
          if [ "$s" -ge "$min" ] && [ "$s" -le "$max" ]; then echo "$d"; fi
        done
      register: discos
      changed_when: false
      check_mode: false                 # somente leitura: roda também com --check
      when: not volume.stat.exists

    - name: Listar os discos do servidor (só para a mensagem de erro)
      ansible.builtin.command: lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINT
      register: lsblk
      changed_when: false
      check_mode: false
      when: not volume.stat.exists

    - name: Conferir que há discos virgens suficientes
      ansible.builtin.assert:
        that: discos.stdout_lines | length >= data_disk_count | int
        fail_msg:
          - "Preciso de {{ data_disk_count }} disco(s) virgem(ns) de ~{{ data_volume.disk_gb }} GiB (sem partição e sem filesystem) e achei {{ discos.stdout_lines }}."
          - "Nenhum disco foi tocado. Discos do servidor:"
          - "{{ lsblk.stdout_lines | join('\n') }}"
      when: not volume.stat.exists

    - name: Discos que serão usados
      ansible.builtin.debug:
        msg: "{{ discos.stdout_lines[:data_disk_count | int] }}"
      when: not volume.stat.exists

    # Com --check o playbook so confere (itens acima). O resto precisa instalar de verdade.
    - name: Fim do modo check
      ansible.builtin.meta: end_host
      when: ansible_check_mode

    # ================================== 2) DISCO DE DADOS ==================================
    - name: Criar o volume de dados (LVM + XFS)
      when: not volume.stat.exists
      block:
        - name: Instalar lvm2 e xfsprogs
          ansible.builtin.dnf:
            name: [lvm2, xfsprogs]
            state: present

        - name: Criar o VG com o(s) disco(s) escolhido(s) (pvcreate + vgcreate)
          community.general.lvg:
            vg: "{{ data_volume.vg }}"
            pvs: "{{ discos.stdout_lines[:data_disk_count | int] }}"
            state: present

        - name: Criar o LV com 100% do VG
          community.general.lvol:
            vg: "{{ data_volume.vg }}"
            lv: "{{ data_volume.lv }}"
            size: 100%FREE
            shrink: false

        - name: Criar o filesystem XFS (nunca sobrescreve um existente)
          community.general.filesystem:
            fstype: xfs
            dev: "/dev/{{ data_volume.vg }}/{{ data_volume.lv }}"

        - name: Criar o ponto de montagem
          ansible.builtin.file:
            path: "{{ data_volume.mount }}"
            state: directory

        - name: Gravar no /etc/fstab e montar (com nofail, o servidor sobe mesmo sem o disco)
          ansible.posix.mount:
            path: "{{ data_volume.mount }}"
            src: "/dev/mapper/{{ data_volume.vg }}-{{ data_volume.lv }}"
            fstype: xfs
            opts: defaults,noatime,nofail
            state: mounted

    - name: Ler o que está montado em {{ data_volume.mount }}
      ansible.builtin.command: "findmnt -n -o SOURCE {{ data_volume.mount }}"
      register: montado
      changed_when: false
      failed_when: false

    - name: Conferir que os dados vão para o volume dedicado e não para o disco do sistema
      ansible.builtin.assert:
        that: data_volume.vg in montado.stdout
        fail_msg: "{{ data_volume.mount }} não está montado a partir de {{ data_volume.vg }} (montado: '{{ montado.stdout }}')."

    # ==================================== 3) SISTEMA ====================================
    - name: Instalar chrony e unzip
      ansible.builtin.dnf:
        name: [chrony, unzip]
        state: present

    - name: Chrony, comentar fontes que não sejam o NTP da empresa
      ansible.builtin.replace:
        path: /etc/chrony.conf
        regexp: '^((?:pool|server) (?!{{ ntp_server | regex_escape }} ).*)$'
        replace: '# \1'
      notify: reiniciar chronyd

    - name: Chrony, usar o NTP da empresa
      ansible.builtin.lineinfile:
        path: /etc/chrony.conf
        line: "server {{ ntp_server }} iburst"
        insertbefore: BOF
      notify: reiniciar chronyd

    - name: Chrony ativo e hora ajustada
      ansible.builtin.systemd:
        name: chronyd
        enabled: true
        state: started

    - name: Ajustar o relógio agora
      ansible.builtin.command: chronyc makestep
      changed_when: false
      failed_when: false

    - name: Kernel, vm.max_map_count
      ansible.posix.sysctl:
        name: vm.max_map_count
        value: "262144"
        sysctl_file: /etc/sysctl.d/99-elasticsearch.conf
        reload: true

    - name: Desligar o swap agora
      ansible.builtin.command: swapoff -a
      when: ansible_facts.swaptotal_mb | int > 0

    - name: Desligar o swap no /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#\n].*\sswap\s.*)$'
        replace: '# \1'

    - name: Limites do serviço (override do systemd)
      ansible.builtin.file:
        path: /etc/systemd/system/elasticsearch.service.d
        state: directory
        mode: "0755"

    - name: Gravar o override (memória travada, arquivos abertos, só inicia com o disco montado)
      ansible.builtin.copy:
        dest: /etc/systemd/system/elasticsearch.service.d/override.conf
        mode: "0644"
        content: |
          [Unit]
          RequiresMountsFor={{ data_volume.mount }}
          [Service]
          LimitMEMLOCK=infinity
          LimitNOFILE=65535
          LimitNPROC=4096
      notify: reiniciar elasticsearch

    # ================================= 4) JAVA E PACOTE =================================
    # A 6.8 nao traz JDK proprio: usa o OpenJDK 11 do sistema.
    - name: Instalar o Java
      ansible.builtin.dnf:
        name: "{{ es_java_pkg }}"
        state: present

    - name: Conferir o Java
      ansible.builtin.stat:
        path: "{{ es_java_home }}/bin/java"
      register: java
      failed_when: not java.stat.exists

    - name: Baixar o RPM do Elasticsearch (confere o SHA-512)
      ansible.builtin.get_url:
        url: "https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-{{ es_version }}.rpm"
        dest: "/root/elasticsearch-{{ es_version }}.rpm"
        checksum: "sha512:https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-{{ es_version }}.rpm.sha512"
        mode: "0644"
      environment: "{{ {'https_proxy': elastic_repo_proxy} if elastic_repo_proxy | length > 0 else {} }}"

    # A chave GPG da Elastic usa SHA-1, que o RHEL 9 costuma recusar; a integridade vem do SHA-512 acima.
    - name: Instalar o Elasticsearch
      ansible.builtin.dnf:
        name: "/root/elasticsearch-{{ es_version }}.rpm"
        state: present
        disable_gpg_check: true

    - name: Dono do diretório de dados
      ansible.builtin.file:
        path: "{{ data_volume.mount }}"
        state: directory
        owner: elasticsearch
        group: elasticsearch
        mode: "0750"

    - name: Contexto SELinux dos dados
      ansible.builtin.command: "restorecon -R {{ data_volume.mount }}"
      changed_when: false
      when: ansible_facts.selinux.status | default('disabled') == 'enabled'

    - name: JVM, heap de {{ es_heap }}
      ansible.builtin.lineinfile:
        path: /etc/elasticsearch/jvm.options
        regexp: '^{{ item.chave }}'
        line: "{{ item.chave }}{{ es_heap }}"
      loop:
        - {chave: "-Xms"}
        - {chave: "-Xmx"}
      notify: reiniciar elasticsearch

    - name: Serviço, qual Java usar
      ansible.builtin.lineinfile:
        path: /etc/sysconfig/elasticsearch
        regexp: '^#?JAVA_HOME='
        line: "JAVA_HOME={{ es_java_home }}"
      notify: reiniciar elasticsearch

    # ========================== 5) CERTIFICADO HTTPS E KEYSTORE ==========================
    # CA interna gerada aqui mesmo. Para os clientes confiarem, entregue {{ ca_dir }}/ca.crt.
    - name: Criar as pastas da CA e dos certificados
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - {path: "{{ ca_dir }}", group: root, mode: "0700"}
        - {path: "{{ tls_dir }}", group: elasticsearch, mode: "0750"}

    - name: Gerar a CA (certutil ca, PEM)
      ansible.builtin.shell: >-
        {{ es_bin }}/elasticsearch-certutil ca --pem --days 1825 --pass "" --out {{ ca_dir }}/ca.zip
        && unzip -oj {{ ca_dir }}/ca.zip -d {{ ca_dir }}
      args:
        creates: "{{ ca_dir }}/ca.crt"

    - name: Gerar o certificado HTTPS (certutil cert, .p12 protegido por senha)
      ansible.builtin.shell: >-
        {{ es_bin }}/elasticsearch-certutil cert --ca-cert {{ ca_dir }}/ca.crt --ca-key {{ ca_dir }}/ca.key
        --days 1825 --name es --out {{ tls_dir }}/http.p12 --pass "$P12"
        --dns {{ ([inventory_hostname, ansible_facts.fqdn, 'localhost'] + es_extra_dns) | unique | join(',') }}
        --ip {{ ansible_host }},127.0.0.1
      args:
        creates: "{{ tls_dir }}/http.p12"
      environment:
        P12: "{{ tls_p12_password }}"
      no_log: true

    - name: Permissão do certificado
      ansible.builtin.file:
        path: "{{ tls_dir }}/http.p12"
        owner: root
        group: elasticsearch
        mode: "0640"

    - name: Gravar no keystore a senha do certificado e a senha inicial do usuário elastic
      ansible.builtin.shell: |
        set -e
        KS={{ es_bin }}/elasticsearch-keystore
        [ -f /etc/elasticsearch/elasticsearch.keystore ] || "$KS" create
        grava() { if "$KS" list | grep -qx "$1"; then "$KS" remove "$1"; fi; printf '%s' "$2" | "$KS" add --stdin "$1"; }
        grava xpack.security.http.ssl.keystore.secure_password "$P12"
        [ -f /etc/elasticsearch/.elastic_ok ] || grava bootstrap.password "$ELASTIC"
        chgrp elasticsearch /etc/elasticsearch/elasticsearch.keystore
        chmod 660 /etc/elasticsearch/elasticsearch.keystore
      environment:
        P12: "{{ tls_p12_password }}"
        ELASTIC: "{{ es_elastic_password }}"
      changed_when: false
      no_log: true

    # ================================== 6) CONFIGURACAO ==================================
    - name: Gravar o elasticsearch.yml
      ansible.builtin.copy:
        dest: /etc/elasticsearch/elasticsearch.yml
        owner: root
        group: elasticsearch
        mode: "0660"
        content: |
          # {{ ansible_managed }}
          cluster.name: {{ es_cluster_name }}
          node.name: {{ inventory_hostname }}
          path.data: {{ data_volume.mount }}
          path.logs: /var/log/elasticsearch
          bootstrap.memory_lock: true
          network.host: {{ ansible_host }}
          http.port: 9200
          discovery.type: single-node
          xpack.license.self_generated.type: basic
          xpack.security.enabled: true
          xpack.security.http.ssl.enabled: true
          xpack.security.http.ssl.keystore.path: certs/http.p12
      notify: reiniciar elasticsearch

    - name: Aplicar as mudanças pendentes (reinicia o Elasticsearch se algo mudou)
      ansible.builtin.meta: flush_handlers

    # ============================ 7) START E SENHA DO "ELASTIC" ============================
    - name: Garantir o serviço ativo e habilitado
      ansible.builtin.systemd:
        name: elasticsearch
        enabled: true
        state: started
        daemon_reload: true

    - name: Aguardar a porta 9200
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 9200
        timeout: 300

    # A senha inicial (bootstrap) e igual a final, mas so vale se for gravada no cluster.
    - name: Gravar a senha do usuário elastic no cluster
      ansible.builtin.uri:
        url: "{{ es_url }}/_xpack/security/user/elastic/_password"
        method: PUT
        body:
          password: "{{ es_elastic_password }}"
      register: senha
      until: senha is succeeded
      retries: 30
      delay: 5
      no_log: true

    - name: Tirar a senha inicial do keystore
      ansible.builtin.shell: |
        set -e
        KS={{ es_bin }}/elasticsearch-keystore
        if "$KS" list | grep -qx bootstrap.password; then "$KS" remove bootstrap.password; fi
        touch /etc/elasticsearch/.elastic_ok
      changed_when: false

    # ==================================== 8) VALIDACAO ====================================
    - name: Ler versão, saúde, licença e heap
      ansible.builtin.uri:
        url: "{{ es_url }}{{ item }}"
      loop:
        - /
        - /_cluster/health
        - /_xpack/license
        - /_nodes/jvm?filter_path=nodes.*.jvm.using_compressed_ordinary_object_pointers
      register: api
      until: api is succeeded
      retries: 12
      delay: 5

    - name: Conferir o resultado
      ansible.builtin.assert:
        that:
          - api.results[0].json.version.number == es_version
          - api.results[1].json.status in ['green', 'yellow']
          - api.results[1].json.number_of_nodes == 1
          - api.results[2].json.license.type == 'basic'
          - (api.results[3].json.nodes.values() | first).jvm.using_compressed_ordinary_object_pointers | string | lower == 'true'
        fail_msg: >-
          Algo difere do esperado (versão {{ es_version }}, cluster green/yellow com 1 nó, licença basic, heap com ponteiros comprimidos).
          Se foi o heap, reduza es_heap para 26g.

    - name: Resumo
      ansible.builtin.debug:
        msg:
          - "Elasticsearch {{ es_version }} no ar em {{ es_url }} (usuário elastic)"
          - "Saúde do cluster: {{ api.results[1].json.status }}. Licença: {{ api.results[2].json.license.type }}"
          - "CA para os clientes confiarem: {{ ca_dir }}/ca.crt"

  handlers:
    - name: reiniciar chronyd
      ansible.builtin.systemd:
        name: chronyd
        state: restarted

    - name: reiniciar elasticsearch
      ansible.builtin.systemd:
        name: elasticsearch
        state: restarted
        enabled: true
        daemon_reload: true
