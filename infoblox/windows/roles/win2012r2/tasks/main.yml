- name: "WIN2012R2 | DEPLOY | Configurar DNS via netsh"
  ansible.windows.win_shell: |
    $allAdapters = Get-WmiObject Win32_NetworkAdapterConfiguration |
      Where-Object { $_.IPEnabled -eq $true }

    $adapters = $allAdapters |
      Where-Object { $_.DHCPEnabled -eq $false }

    $dhcpCount = ($allAdapters | Where-Object { $_.DHCPEnabled -eq $true } | Measure-Object).Count

    if (($adapters | Measure-Object).Count -eq 0) {
      Write-Output "SOMENTE_DHCP"
      exit 0
    }

    $total = ($adapters | Measure-Object).Count
    $ok = 0

    foreach ($adapter in $adapters) {
      try {
        $result = $adapter.SetDNSServerSearchOrder(@(
          "{{ dns_infoblox[datacenter_final | default(datacenter)].primario }}",
          "{{ dns_infoblox[datacenter_final | default(datacenter)].secundario }}"
        ))

        if ($result.ReturnValue -eq 0) {
          $ok++
        }
      }
      catch {}
    }

    Write-Output "TOTAL=$total"
    Write-Output "OK=$ok"
    Write-Output "DHCP=$dhcpCount"

    if ($ok -eq $total -and $total -gt 0) {
      Write-Output "CONFIG_OK"
    }
    else {
      Write-Output "CONFIG_FALHA"
    }
  register: set_dns
  when: funcao == 'deploy'
  ignore_errors: true

- name: "WIN2012R2 | DEPLOY | Limpar cache DNS"
  ansible.windows.win_shell: ipconfig /flushdns
  when: funcao == 'deploy'
  ignore_errors: true

- name: "WIN2012R2 | DEPLOY | Verificar nova configuração"
  ansible.windows.win_shell: |
    $adapter = Get-WmiObject Win32_NetworkAdapterConfiguration | Where-Object { $_.IPEnabled -eq $true } | Select-Object -First 1
    if ($adapter -and $adapter.DNSServerSearchOrder) {
      Write-Output ($adapter.DNSServerSearchOrder -join ",")
    } else {
      Write-Output "DHCP"
    }
  register: dns_novo
  when: funcao == 'deploy'
  ignore_errors: true

- name: "WIN2012R2 | DEPLOY | Registrar resultado"
  ansible.builtin.set_fact:
    resultado_host:
      ip: "{{ inventory_hostname }}"
      so: "Windows Server 2012 R2"
      datacenter: "{{ datacenter }}"
      funcao: "{{ funcao }}"
      winrm: "OK"
      porta_53: "OK"
      admin_local: "OK"
      # status: "{{ 'OK' if set_dns.stdout is defined and 'CONFIG_OK' in set_dns.stdout else 'FALHA' }}"
      # tipo_erro: "{{ 'NENHUM' if set_dns.stdout is defined and 'CONFIG_OK' in set_dns.stdout else 'CONFIG_DNS' }}"
      # mensagem: >-
      #   {%- if set_dns.stdout is defined and 'CONFIG_OK' in set_dns.stdout -%}
      #     DNS configurado: {{ dns_infoblox[datacenter_final | default(datacenter)].primario }},{{ dns_infoblox[datacenter_final | default(datacenter)].secundario }}
      #   {%- else -%}
      #     Erro ao configurar DNS - verificar logs
      #   {%- endif -%}
      # dns_atual: "{{ dns_novo.stdout | default('N/A') | trim }}"

      status: >-
        {% if set_dns.stdout is defined and 'SOMENTE_DHCP' in set_dns.stdout %}
        SKIPPED
        {% elif set_dns.stdout is defined and 'CONFIG_OK' in set_dns.stdout %}
        OK
        {% else %}
        FALHA
        {% endif %}

      tipo_erro: >-
        {% if set_dns.stdout is defined and 'SOMENTE_DHCP' in set_dns.stdout %}
        DHCP
        {% elif set_dns.stdout is defined and 'CONFIG_OK' in set_dns.stdout %}
        NENHUM
        {% else %}
        CONFIG_DNS
        {% endif %}

      mensagem: >-
        {% if set_dns.stdout is defined and 'SOMENTE_DHCP' in set_dns.stdout %}
        Servidor utiliza DHCP. Nenhuma alteração realizada.
        {% elif set_dns.stdout is defined and 'CONFIG_OK' in set_dns.stdout %}
        DNS configurado: {{ dns_infoblox[datacenter_final | default(datacenter)].primario }},{{ dns_infoblox[datacenter_final | default(datacenter)].secundario }}
        {% else %}
        Erro ao configurar DNS - verificar logs
        {% endif %}
    when: funcao == 'deploy'

