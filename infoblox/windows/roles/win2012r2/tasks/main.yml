- name: "WIN2012R2 | ROLLBACK | Restaurar DNS para DHCP"
  ansible.windows.win_shell: |
    $allAdapters = Get-WmiObject Win32_NetworkAdapterConfiguration |
      Where-Object { $_.IPEnabled -eq $true }

    $adapters = $allAdapters |
      Where-Object { $_.DHCPEnabled -eq $false }

    if (($adapters | Measure-Object).Count -eq 0) {
      Write-Output "SOMENTE_DHCP"
      exit 0
    }

    $total = ($adapters | Measure-Object).Count
    $ok = 0

    foreach ($adapter in $adapters) {
      try {
        $result = $adapter.SetDNSServerSearchOrder($null)

        if ($result.ReturnValue -eq 0 -or $result.ReturnValue -eq 1) {
          $ok++
        }
      }
      catch {}
    }

    Write-Output "TOTAL=$total"
    Write-Output "OK=$ok"

    if ($ok -eq $total -and $total -gt 0) {
      Write-Output "ROLLBACK_OK"
    }
    else {
      Write-Output "ROLLBACK_FALHA"
    }
  register: rollback_result
  when: funcao == 'rollback'
  ignore_errors: true

- name: "WIN2012R2 | ROLLBACK | Limpar cache DNS"
  ansible.windows.win_shell: ipconfig /flushdns
  when: funcao == 'rollback'
  ignore_errors: true

- name: "WIN2012R2 | ROLLBACK | Verificar configuração"
  ansible.windows.win_shell: |
    $adapter = Get-WmiObject Win32_NetworkAdapterConfiguration | Where-Object { $_.IPEnabled -eq $true } | Select-Object -First 1
    if ($adapter -and $adapter.DNSServerSearchOrder) {
      Write-Output ($adapter.DNSServerSearchOrder -join ",")
    } else {
      Write-Output "DHCP"
    }
  register: dns_pos_rollback
  when: funcao == 'rollback'
  ignore_errors: true

- name: "WIN2012R2 | ROLLBACK | Registrar resultado"
  ansible.builtin.set_fact:
    resultado_host:
      ip: "{{ inventory_hostname }}"
      so: "Windows Server 2012 R2"
      datacenter: "{{ datacenter }}"
      funcao: "{{ funcao }}"
      winrm: "OK"
      porta_53: "N/A"
      admin_local: "N/A"
      status: "{{ 'OK' if rollback_result.stdout is defined and 'ROLLBACK_OK' in rollback_result.stdout else 'FALHA' }}"
      tipo_erro: "{{ 'NENHUM' if rollback_result.stdout is defined and 'ROLLBACK_OK' in rollback_result.stdout else 'ROLLBACK_FALHOU' }}"
      mensagem: >-
        {%- if rollback_result.stdout is defined and 'ROLLBACK_OK' in rollback_result.stdout -%}
          Rollback OK - DNS restaurado para DHCP
        {%- else -%}
          Erro no rollback - verificar logs
        {%- endif -%}
      dns_atual: "{{ dns_pos_rollback.stdout | default('N/A') | trim }}"
  when: funcao == 'rollback'