---
# =============================================================================
# ROLE: Windows Server 2012 R2 - DNS Infoblox
# Usa netsh e WMI (PowerShell limitado nessa versão)
# =============================================================================

# -------------------------------------------------------------------------
# DEPLOY MODE
# -------------------------------------------------------------------------
- name: "WIN2012R2 | DEPLOY | Criar diretório de backup"
  ansible.windows.win_file:
    path: "{{ backup_dir }}"
    state: directory
  when: funcao == 'deploy'
  ignore_errors: true

- name: "WIN2012R2 | DEPLOY | Backup da configuração DNS"
  ansible.windows.win_shell: |
    $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
    $backupFile = "{{ backup_dir }}\dns_backup_$timestamp.txt"
    netsh interface ip show dns > $backupFile
    $adapters = Get-WmiObject Win32_NetworkAdapterConfiguration | Where-Object { $_.IPEnabled -eq $true }
    $backupData = @()
    foreach ($adapter in $adapters) {
      $dns = $adapter.DNSServerSearchOrder -join ","
      if (-not $dns) { $dns = "DHCP" }
      Add-Content $backupFile "ADAPTER:$($adapter.InterfaceIndex)|$dns"
    }
    Write-Output $backupFile
  register: backup_result
  when: funcao == 'deploy'
  ignore_errors: true

