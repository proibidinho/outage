    - name: EMAIL | Enviar parecer pos-validacao
      community.general.mail:
        host: vip_smtp.claro.com.br
        port: 25
        from: coeeaiops@claro.com.br
        to: "{{ email_destino }}"
        subject: "PÓS-VALIDAÇÃO GMUD INFOBLOX WINDOWS - {{ datacenter }} - RDM {{ rdm | default('N/A') }} - {{ ansible_date_time.date }}"
        subtype: plain
        attach:
