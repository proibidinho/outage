      community.general.mail:
        host: vip_smtp.claro.com.br
        port: 25
        from: coeeaiops@claro.com.br
        to: "{{ email_destino }}"
        subject: "Relatorio Infoblox Windows ROLLBACK - {{ datacenter }} - RDM {{ rdm | default('N/A') }} - {{ ansible_date_time.date }}"
        subtype: plain
        attach:
          - "{{ relatorio_excel }}"
        body: |
          Prezado(a),

          Segue o relatorio de ROLLBACK DNS Infoblox em servidores Windows.

          EXECUTADO ({{ total_rollback_ok }})
          {{ lista_rb_ok }}

          FALHA ({{ total_rollback_falha }})
          {{ lista_rb_falha }}

