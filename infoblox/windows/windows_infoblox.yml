---
# =============================================================================
# PLAYBOOK PRINCIPAL - WINDOWS INFOBLOX DNS
# =============================================================================
# Variáveis do Survey:
#   - servers: Lista de IPs (um por linha)
#   - datacenter: Mackenzie | Lapa | Campinas
#   - funcao: validation | deploy | rollback
#   - email_destino: Email para enviar relatório
#   - rdm: Número da RDM (opcional)
# =============================================================================

# =============================================================================
# PLAY 1: BUSCAR CREDENCIAIS E ADICIONAR SERVIDORES
# =============================================================================
- name: Preparar inventory com credenciais CyberArk
  hosts: localhost
  gather_facts: false
  
  vars:
    dns_infoblox:
      Mackenzie:
        primario: "10.54.44.13"
        secundario: "10.53.22.101"
      Lapa:
        primario: "10.29.177.81"
        secundario: "10.53.22.102"
      Campinas:
        primario: "10.54.44.12"
        secundario: "10.29.177.82"
    backup_dir: "C:\\DNS_Backup_Ansible"

  tasks:
    - name: CYBERARK | Buscar credencial admin
      delegate_to: localhost
      delegate_facts: true
      vars:
        ansible_connection: local
      run_once: true
      cyberark.pas.cyberark_credential:
        api_base_url: "https://10.88.132.184/"
        app_id: "APP_Ansible"
        path: "AIMWebService/api/Accounts"
        query: "Safe=APP_Ansible;UserName=OPS_CRK_API_AAPWIN"
        validate_certs: false
        reason: "Requesting credential for Ansible deployment - Infoblox DNS {{ funcao }}"
        fail_request_on_password_change: true
        connection_timeout: 60
      register: cyberark_secret
      environment:
        http_proxy: ""
        https_proxy: ""
        no_proxy: "10.88.132.184"

    - name: INVENTORY | Adicionar servidores ao grupo windows
      ansible.builtin.add_host:
        name: "{{ item | trim }}"
        groups: windows
        ansible_user: "{{ cyberark_secret.result.UserName }}@CORP.CLAROBR"
        ansible_password: "{{ cyberark_secret.result.Content }}"
        ansible_connection: winrm
        ansible_port: 5985
        ansible_winrm_transport: ntlm
        ansible_winrm_server_cert_validation: ignore
        ansible_winrm_message_encryption: auto
        ansible_winrm_operation_timeout_sec: 60
        ansible_winrm_read_timeout_sec: 120
        dns_infoblox: "{{ dns_infoblox }}"
        backup_dir: "{{ backup_dir }}"
        datacenter: "{{ datacenter }}"
        funcao: "{{ funcao }}"
      loop: "{{ servers.splitlines() | map('trim') | select() | unique | list }}"
      delegate_to: localhost
      no_log: true

    - name: INFO | Exibir informações da execução
      ansible.builtin.debug:
        msg: |
          ================================================================
          INFOBLOX DNS WINDOWS - {{ funcao | upper }}
          ================================================================
          Datacenter: {{ datacenter }}
          RDM: {{ rdm | default('N/A') }}
          Total de hosts: {{ servers.splitlines() | map('trim') | select() | unique | list | length }}
          Função: {{ funcao }}
          DNS Primário: {{ dns_infoblox[datacenter].primario }}
          DNS Secundário: {{ dns_infoblox[datacenter].secundario }}
          ================================================================

# =============================================================================
# PLAY 2: EXECUTAR VALIDAÇÃO OU DEPLOY/ROLLBACK
# =============================================================================
- name: Executar nos servidores Windows
  hosts: windows
  gather_facts: false
  ignore_unreachable: true
  ignore_errors: true

  tasks:
    # =========================================================================
    # ETAPA 1A: TESTAR CONECTIVIDADE DE REDE - PORTA 5985 (TCP PURO)
    # Roda no localhost (controller). Não precisa de nada no servidor remoto.
    # Se falhar = porta bloqueada por firewall/rede → problema de Telecom.
    # =========================================================================
    - name: REDE | Testar porta 5985 via TCP
      ansible.builtin.wait_for:
        host: "{{ inventory_hostname }}"
        port: 5985
        timeout: 15
        state: started
      delegate_to: localhost
      register: porta_5985_test
      ignore_errors: true

    - name: REDE | Registrar status porta 5985
      ansible.builtin.set_fact:
        porta_5985_ok: "{{ not (porta_5985_test.failed | default(true)) }}"

    # =========================================================================
    # ETAPA 1B: TESTAR WINRM / AUTENTICAÇÃO (SOMENTE SE PORTA 5985 OK)
    # Testa se o serviço WinRM responde e se a credencial autentica.
    # Se falhar = serviço WinRM parado, credencial inválida ou PowerShell
    # incompatível → problema do Time Windows.
    # =========================================================================
    - name: WINRM | Testar conexão e autenticação
      ansible.windows.win_ping:
      register: winrm_test
      when: porta_5985_ok | default(false)
      ignore_errors: true

    # - name: WINRM | Registrar status
    #   ansible.builtin.set_fact:
    #     winrm_ok: >-
    #       {{ (porta_5985_ok | default(false)) and
    #          not (winrm_test.failed | default(false)) and
    #          not (winrm_test.unreachable | default(false)) }}
    #     winrm_erro: >-
    #       {%- if not (porta_5985_ok | default(false)) -%}
    #         Porta 5985 inacessivel - Firewall ou rede bloqueando (Telecom)
    #       {%- elif (winrm_test.unreachable | default(false)) or (winrm_test.failed | default(false)) -%}
    #         {{ winrm_test.msg | default('Falha WinRM - verificar servico e credenciais') | truncate(120) }}
    #       {%- else -%}
    #         OK
    #       {%- endif -%}


    - name: WINRM | Registrar status
      ansible.builtin.set_fact:
        winrm_ok: >-
          {{ (porta_5985_ok | default(false)) and
            not (winrm_test.failed | default(false)) and
            not (winrm_test.unreachable | default(false)) }}
        winrm_erro: >-
          {%- if not (porta_5985_ok | default(false)) -%}
            Porta 5985 inacessivel - Firewall ou rede bloqueando (Telecom)
          {%- elif (winrm_test.unreachable | default(false)) or (winrm_test.failed | default(false)) -%}
            {{ winrm_test.msg | default('Falha WinRM - verificar servico e credenciais') | truncate(120) }}
          {%- else -%}
            SEM_ERRO
          {%- endif -%}


    # DOMAIN
    - name: DOMAIN | Obter domínio da máquina
      ansible.windows.win_shell: |
        (Get-WmiObject -Class win32_computersystem).Domain
      register: domain_result
      when: winrm_ok | default(false)

    - name: DOMAIN | Normalizar domínio
      ansible.builtin.set_fact:
        domain_name: "{{ domain_result.stdout | default('') | lower | trim }}"

    - name: DOMAIN | Definir datacenter_final
      ansible.builtin.set_fact:
        datacenter_final: >-
          {%- set d = domain_name | default('') -%}
          {%- if d in ['corp.clarobr','claro.com.br'] -%}
          Campinas
          {%- elif d in ['nt.embratel.com.br','extranet.ebt','ixtools.telco.embratel','primesys.br'] -%}
          Mackenzie
          {%- elif d in ['netservicos.corp','dcing.corp','netdatacenter.corp'] -%}
          Lapa
          {%- else -%}
          {{ datacenter }}
          {%- endif -%}

    # =========================================================================
    # ETAPA 2: DETECTAR VERSÃO DO WINDOWS (SE WINRM OK)
    # =========================================================================
    - name: SO | Detectar versão do Windows
      ansible.windows.win_shell: |
        $os = Get-WmiObject Win32_OperatingSystem
        Write-Output $os.Caption
      register: windows_version_full
      when: winrm_ok | default(false)
      ignore_errors: true

    - name: SO | Classificar versão
      ansible.builtin.set_fact:
        so_detectado: "{{ windows_version_full.stdout | default('Desconhecido') | trim }}"
        detected_version: >-
          {%- set v = windows_version_full.stdout | default('') -%}
          {%- if '2012 R2' in v -%}2012R2
          {%- elif '2012' in v -%}2012R2
          {%- elif '2016' in v -%}2016
          {%- elif '2019' in v -%}2019
          {%- elif '2022' in v -%}2022
          {%- elif '2025' in v or '2026' in v -%}2025
          {%- else -%}2019{%- endif -%}
      when: winrm_ok | default(false)

    # =========================================================================
    # ETAPA 3: TESTAR PORTA 53 DO INFOBLOX (SE WINRM OK)
    # =========================================================================
    - name: DNS | Testar porta 53 - DNS Primário
      ansible.windows.win_shell: |
        $tcp = New-Object System.Net.Sockets.TcpClient
        try {
          $tcp.Connect("{{ dns_infoblox[datacenter_final | default(datacenter)].primario }}", 53)
          if ($tcp.Connected) { Write-Output "DNS1_OK"; $tcp.Close() }
          else { Write-Output "DNS1_FALHA" }
        } catch { Write-Output "DNS1_FALHA" }
      register: dns1_test
      when: winrm_ok | default(false)
      ignore_errors: true

    - name: DNS | Testar porta 53 - DNS Secundário
      ansible.windows.win_shell: |
        $tcp = New-Object System.Net.Sockets.TcpClient
        try {
          $tcp.Connect("{{ dns_infoblox[datacenter_final | default(datacenter)].secundario }}", 53)
          if ($tcp.Connected) { Write-Output "DNS2_OK"; $tcp.Close() }
          else { Write-Output "DNS2_FALHA" }
        } catch { Write-Output "DNS2_FALHA" }
      register: dns2_test
      when: winrm_ok | default(false)
      ignore_errors: true

    - name: DNS | Registrar status porta 53
      ansible.builtin.set_fact:
        dns1_ok: "{{ dns1_test.stdout is defined and 'DNS1_OK' in dns1_test.stdout }}"
        dns2_ok: "{{ dns2_test.stdout is defined and 'DNS2_OK' in dns2_test.stdout }}"
      when: winrm_ok | default(false)

    # =========================================================================
    # ETAPA 4: TESTAR PERMISSÃO DE ADMIN LOCAL (SE WINRM OK)
    # =========================================================================
    - name: ADMIN | Testar permissão para alterar DNS
      ansible.windows.win_shell: |
        # Tenta obter a interface de rede
        $adapter = Get-NetAdapter -ErrorAction SilentlyContinue | Where-Object { $_.Status -eq 'Up' } | Select-Object -First 1
        if (-not $adapter) {
          Write-Output "ADMIN_FALHA_INTERFACE"
          exit 0
        }
        # Tenta ler configuração DNS (precisa de permissão)
        try {
          $dns = Get-DnsClientServerAddress -InterfaceIndex $adapter.InterfaceIndex -AddressFamily IPv4 -ErrorAction Stop
          # Verifica se o usuário é admin local
          $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          if ($isAdmin) {
            Write-Output "ADMIN_OK"
          } else {
            Write-Output "ADMIN_FALHA_NAO_ADMIN"
          }
        } catch {
          Write-Output "ADMIN_FALHA_PERMISSAO"
        }
      register: admin_test
      when: winrm_ok | default(false)
      ignore_errors: true

    - name: ADMIN | Registrar status permissão
      ansible.builtin.set_fact:
        admin_ok: "{{ admin_test.stdout is defined and 'ADMIN_OK' in admin_test.stdout }}"
        admin_erro: >-
          {%- if admin_test.stdout is defined -%}
            {%- if 'ADMIN_FALHA_INTERFACE' in admin_test.stdout -%}Interface de rede nao encontrada
            {%- elif 'ADMIN_FALHA_NAO_ADMIN' in admin_test.stdout -%}Usuario nao e administrador local
            {%- elif 'ADMIN_FALHA_PERMISSAO' in admin_test.stdout -%}Sem permissao para alterar DNS
            {%- else -%}-{%- endif -%}
          {%- else -%}Erro ao verificar permissao{%- endif -%}
      when: winrm_ok | default(false)

    # =========================================================================
    # ETAPA 5: OBTER DNS ATUAL (PARA RELATÓRIO)
    # =========================================================================
    # - name: INFO | Obter configuração DNS atual
    #   ansible.windows.win_shell: |
    #     Get-DnsClientServerAddress -AddressFamily IPv4 | Where-Object { $_.InterfaceAlias -notlike "*Loopback*" } | Select-Object InterfaceAlias, ServerAddresses | Format-Table -AutoSize | Out-String
    #   register: dns_atual
    #   when: winrm_ok | default(false)
    #   ignore_errors: true

    - name: INFO | Obter configuração DNS atual
      ansible.windows.win_shell: |
        $dns = Get-DnsClientServerAddress -AddressFamily IPv4 | 
              Where-Object { $_.InterfaceAlias -notlike "*Loopback*" -and $_.ServerAddresses.Count -gt 0 } |
              Select-Object -First 1
        if ($dns) {
          Write-Output "$($dns.InterfaceAlias)|$($dns.ServerAddresses -join ',')"
        } else {
          Write-Output "NONE|DHCP"
        }
      register: dns_atual
      when: winrm_ok | default(false)
      ignore_errors: true

    # =========================================================================
    # MODO VALIDATION: APENAS REGISTRAR RESULTADO
    # =========================================================================
    - name: VALIDATION | Registrar resultado
      ansible.builtin.set_fact:
        resultado_host:
          ip: "{{ inventory_hostname }}"
          so: "{{ so_detectado | default('Desconhecido') }}"
          datacenter: "{{ datacenter }}"
          funcao: "{{ funcao }}"
          winrm: >-
            {%- if not (porta_5985_ok | default(false)) -%}FALHA_REDE
            {%- elif not (winrm_ok | default(false)) -%}FALHA_SERVICO
            {%- else -%}OK{%- endif -%}
          porta_53: >-
            {%- if not (winrm_ok | default(false)) -%}NAO_TESTADO
            {%- elif (dns1_ok | default(false)) and (dns2_ok | default(false)) -%}OK
            {%- elif not (dns1_ok | default(false)) and not (dns2_ok | default(false)) -%}AMBOS_BLOQUEADOS
            {%- elif not (dns1_ok | default(false)) -%}PRIMARIO_BLOQUEADO
            {%- else -%}SECUNDARIO_BLOQUEADO{%- endif -%}
          admin_local: >-
            {%- if not (winrm_ok | default(false)) -%}NAO_TESTADO
            {%- elif (admin_ok | default(false)) -%}OK
            {%- else -%}FALHA{%- endif -%}
          status: >-
            {%- if not (porta_5985_ok | default(false)) -%}FALHA
            {%- elif not (winrm_ok | default(false)) -%}FALHA
            {%- elif not (dns1_ok | default(false)) or not (dns2_ok | default(false)) -%}FALHA
            {%- elif not (admin_ok | default(false)) -%}FALHA
            {%- else -%}OK{%- endif -%}
          tipo_erro: >-
            {%- if not (porta_5985_ok | default(false)) -%}REDE_5985
            {%- elif not (winrm_ok | default(false)) -%}WINRM
            {%- elif not (dns1_ok | default(false)) or not (dns2_ok | default(false)) -%}FIREWALL_53
            {%- elif not (admin_ok | default(false)) -%}ADMIN_LOCAL
            {%- else -%}NENHUM{%- endif -%}
          mensagem: >-
            {%- if not (porta_5985_ok | default(false)) -%}
              Porta 5985 inacessivel - Firewall/rede bloqueando (abrir chamado Telecom)
            {%- elif not (winrm_ok | default(false)) -%}
              WinRM falhou - {{ winrm_erro | default('verificar servico WinRM e credenciais') | truncate(100) }}
            {%- elif not (dns1_ok | default(false)) and not (dns2_ok | default(false)) -%}
              Porta 53 bloqueada para ambos DNS ({{ dns_infoblox[datacenter_final | default(datacenter)].primario }} e {{ dns_infoblox[datacenter_final | default(datacenter)].secundario }})
            {%- elif not (dns1_ok | default(false)) -%}
              Porta 53 bloqueada para DNS primario {{ dns_infoblox[datacenter_final | default(datacenter)].primario }}
            {%- elif not (dns2_ok | default(false)) -%}
              Porta 53 bloqueada para DNS secundario {{ dns_infoblox[datacenter_final | default(datacenter)].secundario }}
            {%- elif not (admin_ok | default(false)) -%}
              {{ admin_erro | default('Sem permissao de admin local') }}
            {%- else -%}
              Validacao OK - Rede, WinRM, Porta 53 e Admin Local
            {%- endif -%}
          #dns_atual: "{{ dns_atual.stdout | default('N/A') | regex_replace('\\r\\n', ' | ') | truncate(200) }}"
          dns_atual: "{{ dns_atual.stdout | default('NONE|DHCP') | trim }}"
      when: funcao == 'validation'

    # =========================================================================
    # MODO DEPLOY: EXECUTAR ROLE PARA ALTERAR DNS
    # =========================================================================
    - name: DEPLOY | Verificar pré-requisitos
      ansible.builtin.set_fact:
        pode_deploy: "{{ (winrm_ok | default(false)) and (dns1_ok | default(false)) and (dns2_ok | default(false)) and (admin_ok | default(false)) }}"
      when: funcao == 'deploy'

    - name: DEPLOY | Executar role Windows 2012 R2
      include_role:
        name: win2012r2
      when: 
        - funcao == 'deploy'
        - pode_deploy | default(false)
        - detected_version | default('') == '2012R2'

    - name: DEPLOY | Executar role Windows 2016
      include_role:
        name: win2016
      when: 
        - funcao == 'deploy'
        - pode_deploy | default(false)
        - detected_version | default('') == '2016'

    - name: DEPLOY | Executar role Windows 2019
      include_role:
        name: win2019
      when: 
        - funcao == 'deploy'
        - pode_deploy | default(false)
        - detected_version | default('') == '2019'

    - name: DEPLOY | Executar role Windows 2022
      include_role:
        name: win2022
      when: 
        - funcao == 'deploy'
        - pode_deploy | default(false)
        - detected_version | default('') == '2022'

    - name: DEPLOY | Executar role Windows 2025
      include_role:
        name: win2025
      when: 
        - funcao == 'deploy'
        - pode_deploy | default(false)
        - detected_version | default('') == '2025'

    - name: DEPLOY | Registrar falha de pré-requisito
      ansible.builtin.set_fact:
        resultado_host:
          ip: "{{ inventory_hostname }}"
          so: "{{ so_detectado | default('Desconhecido') }}"
          datacenter: "{{ datacenter }}"
          funcao: "{{ funcao }}"
          winrm: >-
            {%- if not (porta_5985_ok | default(false)) -%}FALHA_REDE
            {%- elif not (winrm_ok | default(false)) -%}FALHA_SERVICO
            {%- else -%}OK{%- endif -%}
          porta_53: >-
            {%- if not (winrm_ok | default(false)) -%}NAO_TESTADO
            {%- elif (dns1_ok | default(false)) and (dns2_ok | default(false)) -%}OK
            {%- else -%}FALHA{%- endif -%}
          admin_local: >-
            {%- if not (winrm_ok | default(false)) -%}NAO_TESTADO
            {%- elif (admin_ok | default(false)) -%}OK
            {%- else -%}FALHA{%- endif -%}
          status: "FALHA"
          tipo_erro: >-
            {%- if not (porta_5985_ok | default(false)) -%}REDE_5985
            {%- elif not (winrm_ok | default(false)) -%}WINRM
            {%- elif not (dns1_ok | default(false)) or not (dns2_ok | default(false)) -%}FIREWALL_53
            {%- elif not (admin_ok | default(false)) -%}ADMIN_LOCAL
            {%- else -%}PRE_REQUISITO{%- endif -%}
          mensagem: >-
            {%- if not (porta_5985_ok | default(false)) -%}
              Porta 5985 inacessivel - Firewall/rede bloqueando (Telecom)
            {%- elif not (winrm_ok | default(false)) -%}
              WinRM falhou - {{ winrm_erro | default('verificar servico e credenciais') | truncate(100) }}
            {%- elif not (dns1_ok | default(false)) or not (dns2_ok | default(false)) -%}
              Porta 53 bloqueada - execute validation primeiro
            {%- elif not (admin_ok | default(false)) -%}
              Sem permissao admin local - execute validation primeiro
            {%- else -%}
              Pre-requisitos nao atendidos
            {%- endif -%}
          dns_atual: "{{ dns_atual.stdout | default('N/A') | regex_replace('\\r\\n', ' | ') | truncate(200) }}"
      when: 
        - funcao == 'deploy'
        - not (pode_deploy | default(false))

    # =========================================================================
    # MODO ROLLBACK: EXECUTAR ROLE PARA RESTAURAR DNS
    # =========================================================================
    - name: ROLLBACK | Executar role Windows 2012 R2
      include_role:
        name: win2012r2
      when: 
        - funcao == 'rollback'
        - winrm_ok | default(false)
        - detected_version | default('') == '2012R2'

    - name: ROLLBACK | Executar role Windows 2016
      include_role:
        name: win2016
      when: 
        - funcao == 'rollback'
        - winrm_ok | default(false)
        - detected_version | default('') == '2016'

    - name: ROLLBACK | Executar role Windows 2019
      include_role:
        name: win2019
      when: 
        - funcao == 'rollback'
        - winrm_ok | default(false)
        - detected_version | default('') == '2019'

    - name: ROLLBACK | Executar role Windows 2022
      include_role:
        name: win2022
      when: 
        - funcao == 'rollback'
        - winrm_ok | default(false)
        - detected_version | default('') == '2022'

    - name: ROLLBACK | Executar role Windows 2025
      include_role:
        name: win2025
      when: 
        - funcao == 'rollback'
        - winrm_ok | default(false)
        - detected_version | default('') == '2025'

    - name: ROLLBACK | Registrar falha de conexão
      ansible.builtin.set_fact:
        resultado_host:
          ip: "{{ inventory_hostname }}"
          so: "Desconhecido"
          datacenter: "{{ datacenter }}"
          funcao: "{{ funcao }}"
          winrm: >-
            {%- if not (porta_5985_ok | default(false)) -%}FALHA_REDE
            {%- else -%}FALHA_SERVICO{%- endif -%}
          porta_53: "NAO_TESTADO"
          admin_local: "NAO_TESTADO"
          status: "FALHA"
          tipo_erro: >-
            {%- if not (porta_5985_ok | default(false)) -%}REDE_5985
            {%- else -%}WINRM{%- endif -%}
          mensagem: >-
            {%- if not (porta_5985_ok | default(false)) -%}
              Porta 5985 inacessivel - nao foi possivel conectar para rollback (Telecom)
            {%- else -%}
              WinRM falhou - {{ winrm_erro | default('verificar servico e credenciais') | truncate(100) }}
            {%- endif -%}
          dns_atual: "N/A"
      when: 
        - funcao == 'rollback'
        - not (winrm_ok | default(false))

# =============================================================================
# PLAY 3: GERAR RELATÓRIO E ENVIAR EMAIL
# =============================================================================
- name: Gerar relatorio e enviar email
  hosts: localhost
  gather_facts: true
  connection: local

  vars:
    dns_infoblox:
      Mackenzie:
        primario: "10.54.44.13"
        secundario: "10.53.22.101"
      Lapa:
        primario: "10.29.177.81"
        secundario: "10.53.22.102"
      Campinas:
        primario: "10.54.44.12"
        secundario: "10.29.177.82"
    backup_dir: "C:\\DNS_Backup_Ansible"
    relatorio_excel: "/tmp/infoblox_windows_{{ funcao }}_{{ ansible_date_time.date }}_{{ ansible_date_time.hour }}{{ ansible_date_time.minute }}.xlsx"

  tasks:
    # -------------------------------------------------------------------------
    # COMPILAR RESULTADOS
    # -------------------------------------------------------------------------
    - name: RELATORIO | Compilar todos os resultados
      ansible.builtin.set_fact:
        resultados: >-
          {{
            groups['windows'] | default([]) | map('extract', hostvars)
            | selectattr('resultado_host', 'defined')
            | map(attribute='resultado_host')
            | list
          }}

    - name: RELATORIO | Adicionar hosts não processados
      ansible.builtin.set_fact:
        resultados: >-
          {{
            resultados + [{
              'ip': item,
              'so': 'Desconhecido',
              'datacenter': datacenter | default('N/A'),
              'funcao': funcao,
              'winrm': 'NAO_TESTADO',
              'porta_53': 'NAO_TESTADO',
              'admin_local': 'NAO_TESTADO',
              'status': 'FALHA',
              'tipo_erro': 'NAO_PROCESSADO',
              'mensagem': 'Host nao foi processado - verificar logs',
              'dns_atual': 'N/A'
            }]
          }}
      loop: "{{ groups['windows'] | default([]) }}"
      when: hostvars[item].resultado_host is not defined

    # -------------------------------------------------------------------------
    # CONTADORES
    # -------------------------------------------------------------------------
    - name: RELATORIO | Calcular contadores
      ansible.builtin.set_fact:
        total_hosts: "{{ resultados | length }}"
        total_ok: "{{ resultados | selectattr('status', 'equalto', 'OK') | list | length }}"
        total_rede_5985: "{{ resultados | selectattr('tipo_erro', 'equalto', 'REDE_5985') | list | length }}"
        total_winrm: "{{ resultados | selectattr('tipo_erro', 'equalto', 'WINRM') | list | length }}"
        total_firewall_53: "{{ resultados | selectattr('tipo_erro', 'equalto', 'FIREWALL_53') | list | length }}"
        total_admin: "{{ resultados | selectattr('tipo_erro', 'equalto', 'ADMIN_LOCAL') | list | length }}"
        total_outros: "{{ resultados | selectattr('status', 'equalto', 'FALHA') | rejectattr('tipo_erro', 'in', ['REDE_5985', 'WINRM', 'FIREWALL_53', 'ADMIN_LOCAL']) | list | length }}"
        total_dhcp: "{{ resultados | selectattr('tipo_erro', 'equalto', 'DHCP') | list | length }}"

    # -------------------------------------------------------------------------
    # GERAR PLANILHA EXCEL
    # -------------------------------------------------------------------------
    - name: EXCEL | Montar matriz
      ansible.builtin.set_fact:
        excel_matrix: >-
          {%- set matrix = [] -%}
          {%- set _ = matrix.append({'cell_row': 1, 'cell_col': 1, 'cell_value': 'RELATORIO INFOBLOX WINDOWS - ' ~ funcao | upper}) -%}
          {%- set _ = matrix.append({'cell_row': 3, 'cell_col': 1, 'cell_value': 'Data/Hora:'}) -%}
          {%- set _ = matrix.append({'cell_row': 3, 'cell_col': 2, 'cell_value': ansible_date_time.date ~ ' ' ~ ansible_date_time.time}) -%}
          {%- set _ = matrix.append({'cell_row': 4, 'cell_col': 1, 'cell_value': 'Datacenter:'}) -%}
          {%- set _ = matrix.append({'cell_row': 4, 'cell_col': 2, 'cell_value': datacenter | default('N/A')}) -%}
          {%- set _ = matrix.append({'cell_row': 5, 'cell_col': 1, 'cell_value': 'RDM:'}) -%}
          {%- set _ = matrix.append({'cell_row': 5, 'cell_col': 2, 'cell_value': rdm | default('N/A')}) -%}
          {%- set _ = matrix.append({'cell_row': 6, 'cell_col': 1, 'cell_value': 'Funcao:'}) -%}
          {%- set _ = matrix.append({'cell_row': 6, 'cell_col': 2, 'cell_value': funcao | upper}) -%}
          {%- set _ = matrix.append({'cell_row': 7, 'cell_col': 1, 'cell_value': 'DNS Primario:'}) -%}
          {%- set _ = matrix.append({'cell_row': 7, 'cell_col': 2, 'cell_value': dns_infoblox[datacenter].primario}) -%}
          {%- set _ = matrix.append({'cell_row': 8, 'cell_col': 1, 'cell_value': 'DNS Secundario:'}) -%}
          {%- set _ = matrix.append({'cell_row': 8, 'cell_col': 2, 'cell_value': dns_infoblox[datacenter].secundario}) -%}
          {%- set _ = matrix.append({'cell_row': 10, 'cell_col': 1, 'cell_value': 'RESUMO'}) -%}
          {%- set _ = matrix.append({'cell_row': 11, 'cell_col': 1, 'cell_value': 'Total:'}) -%}
          {%- set _ = matrix.append({'cell_row': 11, 'cell_col': 2, 'cell_value': total_hosts}) -%}
          {%- set _ = matrix.append({'cell_row': 12, 'cell_col': 1, 'cell_value': 'OK:'}) -%}
          {%- set _ = matrix.append({'cell_row': 12, 'cell_col': 2, 'cell_value': total_ok}) -%}
          {%- set _ = matrix.append({'cell_row': 13, 'cell_col': 1, 'cell_value': 'Falha Rede/5985 (Telecom):'}) -%}
          {%- set _ = matrix.append({'cell_row': 13, 'cell_col': 2, 'cell_value': total_rede_5985}) -%}
          {%- set _ = matrix.append({'cell_row': 14, 'cell_col': 1, 'cell_value': 'Falha WinRM (Servico/Auth):'}) -%}
          {%- set _ = matrix.append({'cell_row': 14, 'cell_col': 2, 'cell_value': total_winrm}) -%}
          {%- set _ = matrix.append({'cell_row': 15, 'cell_col': 1, 'cell_value': 'Falha Porta 53:'}) -%}
          {%- set _ = matrix.append({'cell_row': 15, 'cell_col': 2, 'cell_value': total_firewall_53}) -%}
          {%- set _ = matrix.append({'cell_row': 16, 'cell_col': 1, 'cell_value': 'Falha Admin Local:'}) -%}
          {%- set _ = matrix.append({'cell_row': 16, 'cell_col': 2, 'cell_value': total_admin}) -%}
          {%- set _ = matrix.append({'cell_row': 17, 'cell_col': 1, 'cell_value': 'DHCP Ignorado:'}) -%}
          {%- set _ = matrix.append({'cell_row': 17, 'cell_col': 2, 'cell_value': total_dhcp}) -%}
          {%- set _ = matrix.append({'cell_row': 18, 'cell_col': 1, 'cell_value': 'Outros:'}) -%}
          {%- set _ = matrix.append({'cell_row': 18, 'cell_col': 2, 'cell_value': total_outros}) -%}
          {%- set _ = matrix.append({'cell_row': 20, 'cell_col': 1, 'cell_value': 'IP'}) -%}
          {%- set _ = matrix.append({'cell_row': 20, 'cell_col': 2, 'cell_value': 'SO'}) -%}
          {%- set _ = matrix.append({'cell_row': 20, 'cell_col': 3, 'cell_value': 'WINRM'}) -%}
          {%- set _ = matrix.append({'cell_row': 20, 'cell_col': 4, 'cell_value': 'PORTA_53'}) -%}
          {%- set _ = matrix.append({'cell_row': 20, 'cell_col': 5, 'cell_value': 'ADMIN_LOCAL'}) -%}
          {%- set _ = matrix.append({'cell_row': 20, 'cell_col': 6, 'cell_value': 'STATUS'}) -%}
          {%- set _ = matrix.append({'cell_row': 20, 'cell_col': 7, 'cell_value': 'TIPO_ERRO'}) -%}
          {%- set _ = matrix.append({'cell_row': 20, 'cell_col': 8, 'cell_value': 'MENSAGEM'}) -%}
          {%- set _ = matrix.append({'cell_row': 20, 'cell_col': 9, 'cell_value': 'DNS_ATUAL'}) -%}
          {%- for item in resultados -%}
            {%- set row = loop.index + 20 -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 1, 'cell_value': item.ip}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 2, 'cell_value': item.so | default('N/A')}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 3, 'cell_value': item.winrm | default('N/A') | trim}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 4, 'cell_value': item.porta_53 | default('N/A') | trim}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 5, 'cell_value': item.admin_local | default('N/A') | trim}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 6, 'cell_value': item.status | default('N/A') | trim}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 7, 'cell_value': item.tipo_erro | default('N/A') | trim}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 8, 'cell_value': item.mensagem | default('N/A') | trim}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 9, 'cell_value': item.dns_atual | default('N/A') | trim}) -%}
          {%- endfor -%}
          {{ matrix }}

    - name: EXCEL | Criar planilha
      ans2dev.general.open_xl:
        op: n
        dest: "{{ relatorio_excel }}"
        sheet_name: "Infoblox Windows"
        updates_matrix: "{{ excel_matrix }}"

    # -------------------------------------------------------------------------
    # MONTAR LISTAS PARA EMAIL
    # -------------------------------------------------------------------------
    - name: EMAIL | Lista OK
      ansible.builtin.set_fact:
        lista_ok: "{% for r in resultados if r.status | trim == 'OK' %}\n- {{ r.ip }} ({{ r.so | default('N/A') }}){% endfor %}"

    - name: EMAIL | Lista REDE_5985
      ansible.builtin.set_fact:
        lista_rede_5985: "{% for r in resultados if r.tipo_erro | trim == 'REDE_5985' %}\n- {{ r.ip }}{% endfor %}"

    - name: EMAIL | Lista WINRM
      ansible.builtin.set_fact:
        lista_winrm: "{% for r in resultados if r.tipo_erro | trim == 'WINRM' %}\n- {{ r.ip }} | {{ r.mensagem | default('N/A') | trim }}{% endfor %}"

    - name: EMAIL | Lista FIREWALL_53
      ansible.builtin.set_fact:
        lista_firewall_53: "{% for r in resultados if r.tipo_erro | trim == 'FIREWALL_53' %}\n- {{ r.ip }} | {{ r.porta_53 | default('N/A') }}{% endfor %}"

    - name: EMAIL | Lista ADMIN_LOCAL
      ansible.builtin.set_fact:
        lista_admin: "{% for r in resultados if r.tipo_erro | trim == 'ADMIN_LOCAL' %}\n- {{ r.ip }}{% endfor %}"

    - name: EMAIL | Lista OUTROS
      ansible.builtin.set_fact:
        lista_outros: "{% for r in resultados if r.status | trim == 'FALHA' and r.tipo_erro | trim not in ['REDE_5985', 'WINRM', 'FIREWALL_53', 'ADMIN_LOCAL'] %}\n- {{ r.ip }} | {{ r.mensagem | default('N/A') }}{% endfor %}"

    - name: EMAIL | Lista DHCP
      ansible.builtin.set_fact:
        lista_dhcp: "{% for r in resultados if r.tipo_erro | trim == 'DHCP' %}\n- {{ r.ip }}{% endfor %}"

    # -------------------------------------------------------------------------
    # EXIBIR RELATÓRIO
    # -------------------------------------------------------------------------
    - name: RELATORIO | Exibir no console
      ansible.builtin.debug:
        msg: |
          ================================================================
          RELATORIO INFOBLOX WINDOWS - {{ funcao | upper }}
          ================================================================
          Data/Hora: {{ ansible_date_time.date }} {{ ansible_date_time.time }}
          Datacenter: {{ datacenter | default('N/A') }}
          RDM: {{ rdm | default('N/A') }}
          DNS: {{ dns_infoblox[datacenter].primario }} / {{ dns_infoblox[datacenter].secundario }}
          Total de hosts: {{ total_hosts }}
          ----------------------------------------------------------------
          OK ({{ total_ok }}):{{ lista_ok | default('\n  Nenhum') }}
          
          FALHA REDE/5985 - TELECOM ({{ total_rede_5985 }}):{{ lista_rede_5985 | default('\n  Nenhum') }}
          
          FALHA WINRM - SERVICO/AUTH ({{ total_winrm }}):{{ lista_winrm | default('\n  Nenhum') }}
          
          FALHA PORTA 53 ({{ total_firewall_53 }}):{{ lista_firewall_53 | default('\n  Nenhum') }}
          
          FALHA ADMIN LOCAL ({{ total_admin }}):{{ lista_admin | default('\n  Nenhum') }}
          
          SERVIDORES DHCP ({{ total_dhcp }}):{{ lista_dhcp | default('\n  Nenhum') }}
          
          OUTROS ({{ total_outros }}):{{ lista_outros | default('\n  Nenhum') }}
          ================================================================
          Planilha: {{ relatorio_excel }}
          ================================================================

    # -------------------------------------------------------------------------
    # ENVIAR EMAIL
    # -------------------------------------------------------------------------
    - name: EMAIL | Enviar relatório
      community.general.mail:
        host: vip_smtp.claro.com.br
        port: 25
        from: coeeaiops@claro.com.br
        to: "{{ email_destino }}"
        subject: "Relatorio Infoblox Windows {{ funcao | upper }} - {{ datacenter | default('N/A') }} - {{ ansible_date_time.date }}"
        subtype: plain
        attach:
          - "{{ relatorio_excel }}"
        body: |
          Prezado(a),
          
          Segue o relatorio de {{ funcao | upper }} DNS Infoblox em servidores Windows.
          
          ================================================================
          RESUMO
          ================================================================
          Data/Hora: {{ ansible_date_time.date }} {{ ansible_date_time.time }}
          Datacenter: {{ datacenter | default('N/A') }}
          RDM: {{ rdm | default('N/A') }}
          Funcao: {{ funcao | upper }}
          DNS Primario: {{ dns_infoblox[datacenter].primario }}
          DNS Secundario: {{ dns_infoblox[datacenter].secundario }}
          Total de hosts: {{ total_hosts }}
          
          OK: {{ total_ok }}
          Falha Rede/5985 (Telecom): {{ total_rede_5985 }}
          Falha WinRM (Servico/Auth): {{ total_winrm }}
          Falha Porta 53: {{ total_firewall_53 }}
          Falha Admin Local: {{ total_admin }}
          DHCP IGNORADO: {{ total_dhcp }}
          Outros: {{ total_outros }}
          
          ================================================================
          OK ({{ total_ok }})
          ================================================================{{ lista_ok | default('\nNenhum') }}
          
          ================================================================
          FALHA REDE/5985 - TELECOM ({{ total_rede_5985 }})
          ================================================================{{ lista_rede_5985 | default('\nNenhum') }}
          
          ACAO: Porta 5985 inacessivel pela rede. Abrir chamado para equipe
          de Telecom solicitar liberacao de firewall na porta TCP 5985 (WinRM).
          
          ================================================================
          FALHA WINRM - SERVICO/AUTH ({{ total_winrm }})
          ================================================================{{ lista_winrm | default('\nNenhum') }}
          
          ACAO: Porta 5985 acessivel, porem o servico WinRM nao respondeu.
          Verificar com equipe Windows:
          - Servico WinRM esta rodando? (Get-Service WinRM)
          - Listener configurado? (winrm enumerate winrm/config/listener)
          - Credencial CyberArk valida para este servidor?
          
          ================================================================
          FALHA PORTA 53 ({{ total_firewall_53 }})
          ================================================================{{ lista_firewall_53 | default('\nNenhum') }}
          
          ACAO: Solicitar liberacao TCP/UDP para DNS Infoblox na porta 53
          - DNS Primario: {{ dns_infoblox[datacenter].primario }}
          - DNS Secundario: {{ dns_infoblox[datacenter].secundario }}
          
          ================================================================
          FALHA ADMIN LOCAL ({{ total_admin }})
          ================================================================{{ lista_admin | default('\nNenhum') }}
          
          ACAO: Verificar se a conta possui privilegios de Administrador Local
          
          ================================================================
          SERVIDORES DHCP ({{ total_dhcp }})
          ================================================================{{ lista_dhcp | default('\nNenhum') }}
          Estes servidores utilizam DHCP.
          Nenhuma alteração foi realizada pois o DNS será obtido automaticamente pelo lease DHCP.

          ================================================================
          OUTROS ({{ total_outros }})
          ================================================================{{ lista_outros | default('\nNenhum') }}
          
          ================================================================
          {% if funcao == 'deploy' %}
          BACKUP: Os backups foram salvos em {{ backup_dir }} nos servidores
          {% endif %}
          {% if funcao == 'rollback' %}
          ROLLBACK: DNS restaurado para configuracao DHCP
          {% endif %}
          
          Planilha detalhada em anexo.
          
          Este e um email automatico gerado pelo Ansible.
      when: 
        - email_destino is defined 
        - email_destino | length > 0