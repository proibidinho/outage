          ERRO DE CONECTIVIDADE ({{ total_rollback_conectividade }}):
          {{ lista_rb_conectividade }}
          ================================================================================
      when: funcao == 'rollback'

    - name: EMAIL | Enviar relatorio validation/deploy
      community.general.mail:
        host: vip_smtp.claro.com.br
