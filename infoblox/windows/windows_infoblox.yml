          ERRO DE CONECTIVIDADE ({{ total_erro_conectividade }})
          {{ lista_pos_conectividade }}

          DNS esperado: {{ dns_infoblox[datacenter].primario }} e {{ dns_infoblox[datacenter].secundario }}
