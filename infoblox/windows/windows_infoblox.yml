---
# =============================================================================
# PLAYBOOK UNICO - INFOBLOX DNS WINDOWS
# =============================================================================
# Um unico playbook atende os quatro modos:
#   validation    -> pre-check somente leitura
#   deploy        -> somente hosts OK PARA ALTERAÇÃO entram nos roles
#   pos-validacao -> evidencia da GMUD, somente leitura
#   rollback      -> executa o role de rollback da versao detectada
#
# Categorias operacionais de validation/deploy:
#   DNS JÁ CORRETO | OK PARA ALTERAÇÃO | DHCP | FAZER MANUALMENTE
#
# Regra importante:
#   O servidor somente pode ser OK PARA ALTERAÇÃO se os DOIS DNS Infoblox
#   esperados responderem na porta 53. Um unico DNS funcionando nao basta.
#
# Variaveis do Survey:
#   - servers        : lista de IPs (um por linha)
#   - datacenter     : Mackenzie | Lapa | Campinas
#   - funcao         : validation | deploy | pos-validacao | rollback
#   - email_destino  : email para o relatorio
#   - rdm            : numero da RDM (opcional)
# =============================================================================

# =============================================================================
# PLAY 1: VALIDAR PARAMETROS, BUSCAR CREDENCIAL E MONTAR INVENTORY
# =============================================================================
- name: Preparar inventory Windows
  hosts: localhost
  gather_facts: false

  vars:
    dns_infoblox:
      Mackenzie:
        primario: "10.54.44.13"
        secundario: "10.53.22.101"
      Lapa:
        primario: "10.29.177.81"
        secundario: "10.53.22.102"
      Campinas:
        primario: "10.54.44.12"
        secundario: "10.29.177.82"
    backup_dir: "C:\\DNS_Backup_Ansible"

  tasks:
    - name: PARAMETROS | Validar entradas
      ansible.builtin.assert:
        that:
          - funcao | default('') in ['validation', 'deploy', 'pos-validacao', 'rollback']
          - datacenter is defined
          - datacenter in dns_infoblox
          - servers is defined
          - (servers.splitlines() | map('trim') | select() | list | length) > 0
        fail_msg: "Parametros invalidos. funcao={{ funcao | default('N/D') }} datacenter={{ datacenter | default('N/D') }}"

    - name: CYBERARK | Buscar credencial admin
      delegate_to: localhost
      delegate_facts: true
      vars:
        ansible_connection: local
      run_once: true
      cyberark.pas.cyberark_credential:
        api_base_url: "https://10.88.132.184/"
        app_id: "APP_Ansible"
        path: "AIMWebService/api/Accounts"
        query: "Safe=APP_Ansible;UserName=OPS_CRK_API_AAPWIN"
        validate_certs: false
        reason: "Requesting credential for Ansible deployment - Infoblox DNS {{ funcao }}"
        fail_request_on_password_change: true
        connection_timeout: 60
      register: cyberark_secret
      environment:
        http_proxy: ""
        https_proxy: ""
        no_proxy: "10.88.132.184"
      no_log: true

    - name: INVENTORY | Adicionar servidores ao grupo windows
      ansible.builtin.add_host:
        name: "{{ item | trim }}"
        groups: windows
        ansible_user: "{{ cyberark_secret.result.UserName }}@CORP.CLAROBR"
        ansible_password: "{{ cyberark_secret.result.Content }}"
        ansible_connection: winrm
        ansible_port: 5985
        ansible_winrm_transport: ntlm
        ansible_winrm_server_cert_validation: ignore
        ansible_winrm_message_encryption: auto
        ansible_winrm_operation_timeout_sec: 60
        ansible_winrm_read_timeout_sec: 120
        dns_infoblox: "{{ dns_infoblox }}"
        backup_dir: "{{ backup_dir }}"
        datacenter: "{{ datacenter }}"
        funcao: "{{ funcao }}"
      loop: "{{ servers.splitlines() | map('trim') | select() | unique | list }}"
      delegate_to: localhost
      no_log: true

    - name: INFO | Exibir informacoes da execucao
      ansible.builtin.debug:
        msg: |
          ================================================================================
          INFOBLOX DNS WINDOWS - {{ funcao | upper }}
          ================================================================================
          Datacenter: {{ datacenter }}
          RDM: {{ rdm | default('N/A') }}
          Total de hosts: {{ servers.splitlines() | map('trim') | select() | unique | list | length }}
          DNS Primario: {{ dns_infoblox[datacenter].primario }}
          DNS Secundario: {{ dns_infoblox[datacenter].secundario }}
          ================================================================================

# =============================================================================
# PLAY 2: TESTES, CLASSIFICACAO, DEPLOY, POS-VALIDACAO E ROLLBACK
# =============================================================================
- name: Executar fluxo Windows Infoblox
  hosts: windows
  gather_facts: false
  ignore_unreachable: true
  ignore_errors: true

  tasks:
    # -------------------------------------------------------------------------
    # INIT
    # -------------------------------------------------------------------------
    - name: INIT | Valores padrao
      ansible.builtin.set_fact:
        porta_5985_ok: false
        winrm_ok: false
        winrm_erro: ""
        dhcp_detectado: false
        dns_configurado_ok: false
        dns1_ok: false
        dns2_ok: false
        admin_ok: false
        so_detectado: "Desconhecido"
        detected_version: ""
        domain_name: ""
        datacenter_final: "{{ datacenter }}"
        dns_atual_texto: "N/A"
        deploy_executado: false
        rollback_executado: false

    # -------------------------------------------------------------------------
    # REDE / WINRM - todos os modos
    # -------------------------------------------------------------------------
    - name: REDE | Testar porta 5985 via TCP
      ansible.builtin.wait_for:
        host: "{{ inventory_hostname }}"
        port: 5985
        timeout: 15
        state: started
      delegate_to: localhost
      register: porta_5985_test
      ignore_errors: true
      changed_when: false

    - name: REDE | Registrar status porta 5985
      ansible.builtin.set_fact:
        porta_5985_ok: "{{ not (porta_5985_test.failed | default(true)) }}"

    - name: WINRM | Testar conexao e autenticacao
      ansible.windows.win_ping:
      register: winrm_test
      when: porta_5985_ok | bool
      ignore_errors: true

    - name: WINRM | Registrar status
      ansible.builtin.set_fact:
        winrm_ok: >-
          {{ (porta_5985_ok | bool) and
             not (winrm_test.failed | default(false)) and
             not (winrm_test.unreachable | default(false)) }}
        winrm_erro: >-
          {%- if not (porta_5985_ok | bool) -%}
          Porta 5985 inacessivel
          {%- elif (winrm_test.unreachable | default(false)) or (winrm_test.failed | default(false)) -%}
          {{ winrm_test.msg | default('Falha WinRM - verificar servico e credenciais') | truncate(120) }}
          {%- else -%}
          SEM_ERRO
          {%- endif -%}

    # -------------------------------------------------------------------------
    # SO / DOMINIO - todos os modos que conseguiram WinRM
    # -------------------------------------------------------------------------
    - name: DOMAIN | Obter dominio da maquina
      ansible.windows.win_shell: |
        (Get-WmiObject -Class win32_computersystem).Domain
      register: domain_result
      when: winrm_ok | bool
      ignore_errors: true
      changed_when: false

    - name: DOMAIN | Normalizar dominio
      ansible.builtin.set_fact:
        domain_name: "{{ domain_result.stdout | default('') | lower | trim }}"
      when: winrm_ok | bool

    - name: DOMAIN | Definir datacenter_final
      ansible.builtin.set_fact:
        datacenter_final: >-
          {%- set d = domain_name | default('') -%}
          {%- if d in ['corp.clarobr','claro.com.br'] -%}Campinas
          {%- elif d in ['nt.embratel.com.br','extranet.ebt','ixtools.telco.embratel','primesys.br'] -%}Mackenzie
          {%- elif d in ['netservicos.corp','dcing.corp','netdatacenter.corp'] -%}Lapa
          {%- else -%}{{ datacenter }}{%- endif -%}
      when: winrm_ok | bool

    - name: SO | Detectar versao do Windows
      ansible.windows.win_shell: |
        $os = Get-WmiObject Win32_OperatingSystem
        Write-Output $os.Caption
      register: windows_version_full
      when: winrm_ok | bool
      ignore_errors: true
      changed_when: false

    - name: SO | Classificar versao
      ansible.builtin.set_fact:
        so_detectado: "{{ windows_version_full.stdout | default('Desconhecido') | trim }}"
        detected_version: >-
          {%- set v = windows_version_full.stdout | default('') -%}
          {%- if '2012 R2' in v -%}2012R2
          {%- elif '2012' in v -%}2012R2
          {%- elif '2016' in v -%}2016
          {%- elif '2019' in v -%}2019
          {%- elif '2022' in v -%}2022
          {%- elif '2025' in v or '2026' in v -%}2025
          {%- else -%}DESCONHECIDO{%- endif -%}
      when: winrm_ok | bool

    # -------------------------------------------------------------------------
    # DNS PORTA 53 - SEMPRE TESTAR OS DOIS DNS
    # -------------------------------------------------------------------------
    - name: DNS | Testar porta 53 - DNS Primario
      ansible.windows.win_shell: |
        $tcp = New-Object System.Net.Sockets.TcpClient
        try {
          $tcp.Connect("{{ dns_infoblox[datacenter_final].primario }}", 53)
          if ($tcp.Connected) { Write-Output "DNS1_OK" } else { Write-Output "DNS1_FALHA" }
        } catch { Write-Output "DNS1_FALHA" }
        finally { $tcp.Close() }
      register: dns1_test
      when: winrm_ok | bool
      ignore_errors: true
      changed_when: false

    - name: DNS | Testar porta 53 - DNS Secundario
      ansible.windows.win_shell: |
        $tcp = New-Object System.Net.Sockets.TcpClient
        try {
          $tcp.Connect("{{ dns_infoblox[datacenter_final].secundario }}", 53)
          if ($tcp.Connected) { Write-Output "DNS2_OK" } else { Write-Output "DNS2_FALHA" }
        } catch { Write-Output "DNS2_FALHA" }
        finally { $tcp.Close() }
      register: dns2_test
      when: winrm_ok | bool
      ignore_errors: true
      changed_when: false

    - name: DNS | Registrar status porta 53
      ansible.builtin.set_fact:
        dns1_ok: "{{ dns1_test.stdout is defined and 'DNS1_OK' in dns1_test.stdout }}"
        dns2_ok: "{{ dns2_test.stdout is defined and 'DNS2_OK' in dns2_test.stdout }}"
      when: winrm_ok | bool

    # -------------------------------------------------------------------------
    # DNS ATUAL - coleta exata dos enderecos em TODAS as interfaces relevantes
    # -------------------------------------------------------------------------
    - name: DNS | Obter configuracao atual
      ansible.windows.win_shell: |
        $addresses = @(Get-DnsClientServerAddress -AddressFamily IPv4 |
          Where-Object { $_.InterfaceAlias -notlike '*Loopback*' } |
          ForEach-Object { $_.ServerAddresses } |
          Where-Object { $_ })

        if ($addresses.Count -gt 0) {
          Write-Output "ADDRESSES|$($addresses -join ',')"
        } else {
          Write-Output "ADDRESSES|DHCP"
        }

        if (($addresses -contains '{{ dns_infoblox[datacenter_final].primario }}') -and
            ($addresses -contains '{{ dns_infoblox[datacenter_final].secundario }}')) {
          Write-Output "DNS_CORRETO"
        } else {
          Write-Output "DNS_NAO_CORRETO"
        }
      register: dns_atual
      when: winrm_ok | bool
      ignore_errors: true
      changed_when: false

    - name: DNS | Registrar configuracao atual
      ansible.builtin.set_fact:
        dns_configurado_ok: "{{ dns_atual.stdout is defined and 'DNS_CORRETO' in dns_atual.stdout }}"
        dns_atual_texto: "{{ dns_atual.stdout | default('N/A') | trim }}"
      when: winrm_ok | bool

    # -------------------------------------------------------------------------
    # DHCP - mesma logica de windows/infoblox_dominio.yml
    # -------------------------------------------------------------------------
    - name: DHCP | Verificar se todas as interfaces ativas usam DHCP
      ansible.windows.win_shell: |
        $adapters = Get-NetAdapter | Where-Object {
          $_.Status -eq 'Up' -and
          $_.InterfaceDescription -notlike '*Virtual*' -and
          $_.InterfaceDescription -notlike '*Loopback*'
        } | Where-Object {
          (Get-NetIPInterface -InterfaceIndex $_.InterfaceIndex -AddressFamily IPv4).Dhcp -eq 'Disabled'
        }

        if (($adapters | Measure-Object).Count -eq 0) {
          Write-Output "SOMENTE_DHCP"
        } else {
          Write-Output "DNS_ESTATICO"
        }
      register: dhcp_check
      when: winrm_ok | bool
      ignore_errors: true
      changed_when: false

    - name: DHCP | Registrar status
      ansible.builtin.set_fact:
        dhcp_detectado: "{{ dhcp_check.stdout is defined and 'SOMENTE_DHCP' in dhcp_check.stdout }}"
      when: winrm_ok | bool

    # -------------------------------------------------------------------------
    # ADMIN - somente quando o modo puder alterar
    # -------------------------------------------------------------------------
    - name: ADMIN | Testar administrador local
      ansible.windows.win_shell: |
        $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
        if ($isAdmin) { Write-Output "ADMIN_OK" } else { Write-Output "ADMIN_FALHA" }
      register: admin_test
      when:
        - winrm_ok | bool
        - funcao in ['validation', 'deploy']
      ignore_errors: true
      changed_when: false

    - name: ADMIN | Registrar status
      ansible.builtin.set_fact:
        admin_ok: "{{ admin_test.stdout is defined and 'ADMIN_OK' in admin_test.stdout }}"
      when:
        - winrm_ok | bool
        - funcao in ['validation', 'deploy']

    # -------------------------------------------------------------------------
    # VALIDATION
    # -------------------------------------------------------------------------
    - name: VALIDATION | Classificar servidor
      ansible.builtin.set_fact:
        resultado_host:
          ip: "{{ inventory_hostname }}"
          so: "{{ so_detectado }}"
          datacenter: "{{ datacenter_final }}"
          funcao: "{{ funcao }}"
          classificacao: >-
            {%- if not (porta_5985_ok | bool) or not (winrm_ok | bool) -%}FAZER MANUALMENTE
            {%- elif dhcp_detectado | bool -%}DHCP
            {%- elif dns_configurado_ok | bool -%}DNS JÁ CORRETO
            {%- elif (dns1_ok | bool) and (dns2_ok | bool) and (admin_ok | bool) -%}OK PARA ALTERAÇÃO
            {%- else -%}FAZER MANUALMENTE{%- endif -%}
          status: "VALIDADO"
          tipo_erro: >-
            {%- if not (porta_5985_ok | bool) -%}REDE_5985
            {%- elif not (winrm_ok | bool) -%}WINRM
            {%- elif dhcp_detectado | bool -%}DHCP
            {%- elif dns_configurado_ok | bool -%}NENHUM
            {%- elif not (dns1_ok | bool) or not (dns2_ok | bool) -%}FIREWALL_53
            {%- elif not (admin_ok | bool) -%}ADMIN_LOCAL
            {%- else -%}NENHUM{%- endif -%}
          mensagem: >-
            {%- if not (porta_5985_ok | bool) -%}Porta 5985 inacessivel
            {%- elif not (winrm_ok | bool) -%}WinRM indisponivel - {{ winrm_erro | truncate(120) }}
            {%- elif dhcp_detectado | bool -%}Servidor utiliza DHCP. Nenhuma alteracao sera realizada.
            {%- elif dns_configurado_ok | bool -%}Os dois DNS Infoblox esperados ja estao configurados.
            {%- elif not (dns1_ok | bool) and not (dns2_ok | bool) -%}Os dois DNS Infoblox falharam no teste da porta 53.
            {%- elif not (dns1_ok | bool) -%}DNS primario falhou no teste da porta 53.
            {%- elif not (dns2_ok | bool) -%}DNS secundario falhou no teste da porta 53.
            {%- elif not (admin_ok | bool) -%}Usuario nao e administrador local.
            {%- else -%}Pre-requisitos atendidos.
            {%- endif -%}
          dns_atual: "{{ dns_atual_texto }}"
          dns_esperado: "{{ dns_infoblox[datacenter_final].primario }}, {{ dns_infoblox[datacenter_final].secundario }}"
      when: funcao == 'validation'

    # -------------------------------------------------------------------------
    # DEPLOY - gate: SOMENTE OK PARA ALTERACAO
    # -------------------------------------------------------------------------
    - name: DEPLOY | Calcular candidato
      ansible.builtin.set_fact:
        pode_deploy: >-
          {{ (porta_5985_ok | bool)
             and (winrm_ok | bool)
             and not (dhcp_detectado | bool)
             and not (dns_configurado_ok | bool)
             and (dns1_ok | bool)
             and (dns2_ok | bool)
             and (admin_ok | bool)
             and (detected_version in ['2012R2', '2016', '2019', '2022', '2025']) }}
      when: funcao == 'deploy'

    - name: DEPLOY | Registrar pre-classificacao
      ansible.builtin.set_fact:
        resultado_host:
          ip: "{{ inventory_hostname }}"
          so: "{{ so_detectado }}"
          datacenter: "{{ datacenter_final }}"
          funcao: "{{ funcao }}"
          classificacao: >-
            {%- if dhcp_detectado | bool -%}DHCP
            {%- elif dns_configurado_ok | bool -%}DNS JÁ CORRETO
            {%- elif pode_deploy | bool -%}OK PARA ALTERAÇÃO
            {%- else -%}FAZER MANUALMENTE{%- endif -%}
          status: "IGNORADO (NAO ENVIADO AO DEPLOY)"
          tipo_erro: >-
            {%- if dhcp_detectado | bool -%}DHCP
            {%- elif dns_configurado_ok | bool -%}NENHUM
            {%- elif not (porta_5985_ok | bool) -%}REDE_5985
            {%- elif not (winrm_ok | bool) -%}WINRM
            {%- elif not (dns1_ok | bool) or not (dns2_ok | bool) -%}FIREWALL_53
            {%- elif not (admin_ok | bool) -%}ADMIN_LOCAL
            {%- else -%}VERSAO_NAO_SUPORTADA{%- endif -%}
          mensagem: "Nao enviado ao deploy ate atender todos os pre-requisitos."
          dns_atual: "{{ dns_atual_texto }}"
          dns_esperado: "{{ dns_infoblox[datacenter_final].primario }}, {{ dns_infoblox[datacenter_final].secundario }}"
      when: funcao == 'deploy'

    - name: DEPLOY | Executar role Windows 2012 R2
      ansible.builtin.include_role:
        name: win2012r2
      when:
        - funcao == 'deploy'
        - pode_deploy | bool
        - detected_version == '2012R2'

    - name: DEPLOY | Executar role Windows 2016
      ansible.builtin.include_role:
        name: win2016
      when:
        - funcao == 'deploy'
        - pode_deploy | bool
        - detected_version == '2016'

    - name: DEPLOY | Executar role Windows 2019
      ansible.builtin.include_role:
        name: win2019
      when:
        - funcao == 'deploy'
        - pode_deploy | bool
        - detected_version == '2019'

    - name: DEPLOY | Executar role Windows 2022
      ansible.builtin.include_role:
        name: win2022
      when:
        - funcao == 'deploy'
        - pode_deploy | bool
        - detected_version == '2022'

    - name: DEPLOY | Executar role Windows 2025
      ansible.builtin.include_role:
        name: win2025
      when:
        - funcao == 'deploy'
        - pode_deploy | bool
        - detected_version == '2025'

    - name: DEPLOY | Marcar execucao
      ansible.builtin.set_fact:
        deploy_executado: true
      when:
        - funcao == 'deploy'
        - pode_deploy | bool

    - name: DEPLOY | Reler DNS apos alteracao
      ansible.windows.win_shell: |
        $addresses = @(Get-DnsClientServerAddress -AddressFamily IPv4 |
          Where-Object { $_.InterfaceAlias -notlike '*Loopback*' } |
          ForEach-Object { $_.ServerAddresses } | Where-Object { $_ })
        if (($addresses -contains '{{ dns_infoblox[datacenter_final].primario }}') -and
            ($addresses -contains '{{ dns_infoblox[datacenter_final].secundario }}')) {
          Write-Output "DNS_ALTERADO_OK"
        } else {
          Write-Output "DNS_ALTERADO_FALHA|$($addresses -join ',')"
        }
      register: deploy_dns_result
      when:
        - funcao == 'deploy'
        - pode_deploy | bool
      ignore_errors: true
      changed_when: false

    - name: DEPLOY | Registrar resultado final
      ansible.builtin.set_fact:
        resultado_host: >-
          {{ resultado_host | combine({
            'classificacao': ('ALTERADO COM SUCESSO' if (deploy_dns_result.stdout is defined and 'DNS_ALTERADO_OK' in deploy_dns_result.stdout) else 'FAZER MANUALMENTE'),
            'status': ('ALTERADO' if (deploy_dns_result.stdout is defined and 'DNS_ALTERADO_OK' in deploy_dns_result.stdout) else 'FALHA NA ALTERACAO'),
            'mensagem': ('DNS alterado e confirmado com os dois Infoblox.' if (deploy_dns_result.stdout is defined and 'DNS_ALTERADO_OK' in deploy_dns_result.stdout) else 'Deploy executado, mas os dois DNS esperados nao foram confirmados.'),
            'dns_atual': (deploy_dns_result.stdout | default('N/A') | trim)
          }) }}
      when:
        - funcao == 'deploy'
        - pode_deploy | bool

    # -------------------------------------------------------------------------
    # POS-VALIDACAO - 100% SOMENTE LEITURA
    # -------------------------------------------------------------------------
    - name: POS | Registrar parecer
      ansible.builtin.set_fact:
        resultado_host:
          ip: "{{ inventory_hostname }}"
          so: "{{ so_detectado }}"
          datacenter: "{{ datacenter_final }}"
          funcao: "{{ funcao }}"
          escopo: >-
            {%- if not (winrm_ok | bool) -%}INDETERMINADO
            {%- elif detected_version in ['2012R2', '2016', '2019', '2022', '2025'] -%}EM ESCOPO
            {%- else -%}FORA DE ESCOPO{%- endif -%}
          dns_esperado: "{{ dns_infoblox[datacenter_final].primario }}, {{ dns_infoblox[datacenter_final].secundario }}"
          dns_encontrado: "{{ dns_atual_texto }}"
          teste_dns1: "{{ 'OK' if dns1_ok | bool else 'FALHA' }}"
          teste_dns2: "{{ 'OK' if dns2_ok | bool else 'FALHA' }}"
          dhcp: "{{ 'SIM' if dhcp_detectado | bool else 'NAO' }}"
          status: >-
            {%- if not (winrm_ok | bool) -%}ERRO DE CONECTIVIDADE
            {%- elif detected_version not in ['2012R2', '2016', '2019', '2022', '2025'] -%}FORA DE ESCOPO
            {%- elif dhcp_detectado | bool -%}FORA DE ESCOPO
            {%- elif not (dns_configurado_ok | bool) -%}FALHA
            {%- elif not (dns1_ok | bool) or not (dns2_ok | bool) -%}FALHA
            {%- else -%}SUCESSO{%- endif -%}
          motivo: >-
            {%- if not (winrm_ok | bool) -%}WinRM indisponivel.
            {%- elif detected_version not in ['2012R2', '2016', '2019', '2022', '2025'] -%}Versao Windows fora do escopo dos roles.
            {%- elif dhcp_detectado | bool -%}Servidor utiliza DHCP; nenhuma alteracao automatica esperada.
            {%- elif not (dns_configurado_ok | bool) -%}Os dois DNS Infoblox esperados nao estao configurados.
            {%- elif not (dns1_ok | bool) -%}DNS primario nao respondeu na porta 53.
            {%- elif not (dns2_ok | bool) -%}DNS secundario nao respondeu na porta 53.
            {%- else -%}Os dois DNS Infoblox estao configurados e ambos responderam na porta 53.
            {%- endif -%}
          evidencia: >-
            dns1={{ 'OK' if dns1_ok | bool else 'FALHA' }};
            dns2={{ 'OK' if dns2_ok | bool else 'FALHA' }};
            dhcp={{ 'sim' if dhcp_detectado | bool else 'nao' }};
            dns={{ dns_atual_texto }}
      when: funcao == 'pos-validacao'

    # -------------------------------------------------------------------------
    # ROLLBACK - usa exatamente os roles existentes por versao
    # -------------------------------------------------------------------------
    - name: ROLLBACK | Executar role Windows 2012 R2
      ansible.builtin.include_role:
        name: win2012r2
      when:
        - funcao == 'rollback'
        - winrm_ok | bool
        - detected_version == '2012R2'

    - name: ROLLBACK | Executar role Windows 2016
      ansible.builtin.include_role:
        name: win2016
      when:
        - funcao == 'rollback'
        - winrm_ok | bool
        - detected_version == '2016'

    - name: ROLLBACK | Executar role Windows 2019
      ansible.builtin.include_role:
        name: win2019
      when:
        - funcao == 'rollback'
        - winrm_ok | bool
        - detected_version == '2019'

    - name: ROLLBACK | Executar role Windows 2022
      ansible.builtin.include_role:
        name: win2022
      when:
        - funcao == 'rollback'
        - winrm_ok | bool
        - detected_version == '2022'

    - name: ROLLBACK | Executar role Windows 2025
      ansible.builtin.include_role:
        name: win2025
      when:
        - funcao == 'rollback'
        - winrm_ok | bool
        - detected_version == '2025'

    - name: ROLLBACK | Reler DNS apos restauracao
      ansible.windows.win_shell: |
        $addresses = @(Get-DnsClientServerAddress -AddressFamily IPv4 |
          Where-Object { $_.InterfaceAlias -notlike '*Loopback*' } |
          ForEach-Object { $_.ServerAddresses } | Where-Object { $_ })
        if ($addresses.Count -eq 0) {
          Write-Output "DHCP"
        } else {
          Write-Output ($addresses -join ',')
        }
      register: rollback_dns_result
      when:
        - funcao == 'rollback'
        - winrm_ok | bool
      ignore_errors: true
      changed_when: false

    - name: ROLLBACK | Registrar resultado
      ansible.builtin.set_fact:
        resultado_host:
          ip: "{{ inventory_hostname }}"
          so: "{{ so_detectado }}"
          datacenter: "{{ datacenter_final }}"
          funcao: "{{ funcao }}"
          status: >-
            {%- if not (winrm_ok | bool) -%}ERRO DE CONECTIVIDADE
            {%- elif rollback_dns_result.stdout is defined and rollback_dns_result.stdout | trim | length > 0 -%}EXECUTADO
            {%- else -%}FALHA{%- endif -%}
          mensagem: >-
            {%- if not (winrm_ok | bool) -%}Nao foi possivel conectar ao servidor.
            {%- elif rollback_dns_result.stdout is defined and rollback_dns_result.stdout | trim | length > 0 -%}Rollback executado; DNS atual: {{ rollback_dns_result.stdout | trim }}
            {%- else -%}Rollback nao confirmado.
            {%- endif -%}
          dns_atual: "{{ rollback_dns_result.stdout | default('N/A') | trim }}"
      when: funcao == 'rollback'

# =============================================================================
# PLAY 3: RELATORIO / EMAIL
# =============================================================================
- name: Gerar relatorio Windows Infoblox
  hosts: localhost
  gather_facts: true
  connection: local

  vars:
    dns_infoblox:
      Mackenzie:
        primario: "10.54.44.13"
        secundario: "10.53.22.101"
      Lapa:
        primario: "10.29.177.81"
        secundario: "10.53.22.102"
      Campinas:
        primario: "10.54.44.12"
        secundario: "10.29.177.82"
    relatorio_excel: "/tmp/infoblox_windows_{{ funcao }}_{{ ansible_date_time.date }}_{{ ansible_date_time.hour }}{{ ansible_date_time.minute }}.xlsx"

  tasks:
    - name: RELATORIO | Compilar resultados
      ansible.builtin.set_fact:
        resultados: >-
          {%- set out = [] -%}
          {%- for h in groups['windows'] | default([]) -%}
            {%- set r = hostvars[h].resultado_host | default(none) -%}
            {%- if r is none -%}
              {%- if funcao == 'pos-validacao' -%}
                {%- set _ = out.append({'ip': h, 'so': 'Desconhecido', 'datacenter': datacenter, 'status': 'ERRO DE CONECTIVIDADE', 'motivo': 'Host nao foi processado - verificar logs', 'dns_esperado': dns_infoblox[datacenter].primario ~ ', ' ~ dns_infoblox[datacenter].secundario, 'dns_encontrado': '', 'teste_dns1': 'N/A', 'teste_dns2': 'N/A', 'dhcp': 'N/A', 'evidencia': ''}) -%}
              {%- else -%}
                {%- set _ = out.append({'ip': h, 'so': 'Desconhecido', 'datacenter': datacenter, 'classificacao': 'FAZER MANUALMENTE', 'status': 'NAO PROCESSADO', 'mensagem': 'Host nao foi processado - verificar logs', 'dns_atual': 'N/A'}) -%}
              {%- endif -%}
            {%- else -%}
              {%- set _ = out.append(r) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}

    - name: RELATORIO | Contadores operacionais
      ansible.builtin.set_fact:
        total_hosts: "{{ resultados | length }}"
        total_dns_ok: "{{ resultados | selectattr('classificacao', 'equalto', 'DNS JÁ CORRETO') | list | length }}"
        total_ok_alteracao: "{{ resultados | selectattr('classificacao', 'equalto', 'OK PARA ALTERAÇÃO') | list | length }}"
        total_dhcp: "{{ resultados | selectattr('classificacao', 'equalto', 'DHCP') | list | length }}"
        total_manual: "{{ resultados | selectattr('classificacao', 'equalto', 'FAZER MANUALMENTE') | list | length }}"
      when: funcao in ['validation', 'deploy']

    - name: RELATORIO | Contadores pos-validacao
      ansible.builtin.set_fact:
        total_hosts: "{{ resultados | length }}"
        total_sucesso: "{{ resultados | selectattr('status', 'equalto', 'SUCESSO') | list | length }}"
        total_falha: "{{ resultados | selectattr('status', 'equalto', 'FALHA') | list | length }}"
        total_fora_escopo: "{{ resultados | selectattr('status', 'equalto', 'FORA DE ESCOPO') | list | length }}"
        total_erro_conectividade: "{{ resultados | selectattr('status', 'equalto', 'ERRO DE CONECTIVIDADE') | list | length }}"
      when: funcao == 'pos-validacao'

    - name: RELATORIO | Contadores rollback
      ansible.builtin.set_fact:
        total_hosts: "{{ resultados | length }}"
        total_rollback_ok: "{{ resultados | selectattr('status', 'equalto', 'EXECUTADO') | list | length }}"
        total_rollback_falha: "{{ resultados | selectattr('status', 'equalto', 'FALHA') | list | length }}"
        total_rollback_conectividade: "{{ resultados | selectattr('status', 'equalto', 'ERRO DE CONECTIVIDADE') | list | length }}"
      when: funcao == 'rollback'

    - name: EMAIL | Listas operacionais
      ansible.builtin.set_fact:
        lista_dns_ok: >-
          {% set ips = resultados | selectattr('classificacao', 'equalto', 'DNS JÁ CORRETO') | map(attribute='ip') | list %}
          {{ ('- ' ~ ips | join('\n- ')) if ips else 'Nenhum' }}
        lista_ok_alteracao: >-
          {% set ips = resultados | selectattr('classificacao', 'equalto', 'OK PARA ALTERAÇÃO') | map(attribute='ip') | list %}
          {{ ('- ' ~ ips | join('\n- ')) if ips else 'Nenhum' }}
        lista_dhcp: >-
          {% set ips = resultados | selectattr('classificacao', 'equalto', 'DHCP') | map(attribute='ip') | list %}
          {{ ('- ' ~ ips | join('\n- ')) if ips else 'Nenhum' }}
        lista_manual: >-
          {% set ips = resultados | selectattr('classificacao', 'equalto', 'FAZER MANUALMENTE') | map(attribute='ip') | list %}
          {{ ('- ' ~ ips | join('\n- ')) if ips else 'Nenhum' }}
      when: funcao in ['validation', 'deploy']

    - name: EMAIL | Listas pos-validacao
      ansible.builtin.set_fact:
        lista_pos_sucesso: >-
          {% set ips = resultados | selectattr('status', 'equalto', 'SUCESSO') | map(attribute='ip') | list %}
          {{ ('- ' ~ ips | join('\n- ')) if ips else 'Nenhum' }}
        lista_pos_falha: >-
          {% set ips = resultados | selectattr('status', 'equalto', 'FALHA') | map(attribute='ip') | list %}
          {{ ('- ' ~ ips | join('\n- ')) if ips else 'Nenhum' }}
        lista_pos_escopo: >-
          {% set ips = resultados | selectattr('status', 'equalto', 'FORA DE ESCOPO') | map(attribute='ip') | list %}
          {{ ('- ' ~ ips | join('\n- ')) if ips else 'Nenhum' }}
        lista_pos_conectividade: >-
          {% set ips = resultados | selectattr('status', 'equalto', 'ERRO DE CONECTIVIDADE') | map(attribute='ip') | list %}
          {{ ('- ' ~ ips | join('\n- ')) if ips else 'Nenhum' }}
      when: funcao == 'pos-validacao'

    - name: EMAIL | Listas rollback
      ansible.builtin.set_fact:
        lista_rb_ok: >-
          {% set ips = resultados | selectattr('status', 'equalto', 'EXECUTADO') | map(attribute='ip') | list %}
          {{ ('- ' ~ ips | join('\n- ')) if ips else 'Nenhum' }}
        lista_rb_falha: >-
          {% set ips = resultados | selectattr('status', 'equalto', 'FALHA') | map(attribute='ip') | list %}
          {{ ('- ' ~ ips | join('\n- ')) if ips else 'Nenhum' }}
        lista_rb_conectividade: >-
          {% set ips = resultados | selectattr('status', 'equalto', 'ERRO DE CONECTIVIDADE') | map(attribute='ip') | list %}
          {{ ('- ' ~ ips | join('\n- ')) if ips else 'Nenhum' }}
      when: funcao == 'rollback'

    - name: EXCEL | Montar matriz validation/deploy
      ansible.builtin.set_fact:
        excel_matrix: >-
          {%- set matrix = [] -%}
          {%- set _ = matrix.append({'cell_row': 1, 'cell_col': 1, 'cell_value': 'RELATORIO INFOBLOX WINDOWS - ' ~ funcao | upper}) -%}
          {%- set resumo = [
            ['Data/Hora:', ansible_date_time.date ~ ' ' ~ ansible_date_time.time],
            ['Datacenter:', datacenter],
            ['RDM:', rdm | default('N/A')],
            ['DNS Primario:', dns_infoblox[datacenter].primario],
            ['DNS Secundario:', dns_infoblox[datacenter].secundario],
            ['Total de hosts:', total_hosts],
            ['DNS JÁ CORRETO:', total_dns_ok],
            ['OK PARA ALTERAÇÃO:', total_ok_alteracao],
            ['DHCP:', total_dhcp],
            ['FAZER MANUALMENTE:', total_manual]
          ] -%}
          {%- for p in resumo -%}
            {%- set _ = matrix.append({'cell_row': loop.index + 2, 'cell_col': 1, 'cell_value': p[0]}) -%}
            {%- set _ = matrix.append({'cell_row': loop.index + 2, 'cell_col': 2, 'cell_value': p[1]}) -%}
          {%- endfor -%}
          {%- set _ = matrix.append({'cell_row': 14, 'cell_col': 1, 'cell_value': 'IP'}) -%}
          {%- set _ = matrix.append({'cell_row': 14, 'cell_col': 2, 'cell_value': 'SO'}) -%}
          {%- set _ = matrix.append({'cell_row': 14, 'cell_col': 3, 'cell_value': 'CLASSIFICACAO'}) -%}
          {%- set _ = matrix.append({'cell_row': 14, 'cell_col': 4, 'cell_value': 'DNS ATUAL'}) -%}
          {%- set _ = matrix.append({'cell_row': 14, 'cell_col': 5, 'cell_value': 'MOTIVO'}) -%}
          {%- for item in resultados -%}
            {%- set row = loop.index + 14 -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 1, 'cell_value': item.ip | default('')}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 2, 'cell_value': item.so | default('') | trim}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 3, 'cell_value': item.classificacao | default(item.status | default('N/A')) | trim}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 4, 'cell_value': item.dns_atual | default(item.dns_encontrado | default('N/A')) | trim}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 5, 'cell_value': item.mensagem | default(item.motivo | default('N/A')) | trim}) -%}
          {%- endfor -%}
          {{ matrix }}
      when: funcao in ['validation', 'deploy']

    - name: EXCEL | Montar matriz pos-validacao
      ansible.builtin.set_fact:
        excel_matrix: >-
          {%- set matrix = [] -%}
          {%- set _ = matrix.append({'cell_row': 1, 'cell_col': 1, 'cell_value': 'PARECER POS-VALIDACAO GMUD INFOBLOX - WINDOWS'}) -%}
          {%- set resumo = [
            ['Data/Hora:', ansible_date_time.date ~ ' ' ~ ansible_date_time.time],
            ['Datacenter:', datacenter],
            ['RDM:', rdm | default('N/A')],
            ['Total analisado:', total_hosts],
            ['Sucesso:', total_sucesso],
            ['Falha:', total_falha],
            ['Fora de escopo:', total_fora_escopo],
            ['Erro de conectividade:', total_erro_conectividade]
          ] -%}
          {%- for p in resumo -%}
            {%- set _ = matrix.append({'cell_row': loop.index + 2, 'cell_col': 1, 'cell_value': p[0]}) -%}
            {%- set _ = matrix.append({'cell_row': loop.index + 2, 'cell_col': 2, 'cell_value': p[1]}) -%}
          {%- endfor -%}
          {%- for h in ['IP','DATACENTER','SO','ESCOPO','DNS ESPERADO','DNS ENCONTRADO','TESTE DNS 1','TESTE DNS 2','DHCP','STATUS FINAL','MOTIVO','EVIDENCIA'] -%}
            {%- set _ = matrix.append({'cell_row': 12, 'cell_col': loop.index, 'cell_value': h}) -%}
          {%- endfor -%}
          {%- for item in resultados -%}
            {%- set row = loop.index + 12 -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 1, 'cell_value': item.ip | default('')}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 2, 'cell_value': item.datacenter | default('')}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 3, 'cell_value': item.so | default('')}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 4, 'cell_value': item.escopo | default('')}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 5, 'cell_value': item.dns_esperado | default('')}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 6, 'cell_value': item.dns_encontrado | default('')}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 7, 'cell_value': item.teste_dns1 | default('')}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 8, 'cell_value': item.teste_dns2 | default('')}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 9, 'cell_value': item.dhcp | default('')}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 10, 'cell_value': item.status | default('')}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 11, 'cell_value': item.motivo | default('')}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 12, 'cell_value': item.evidencia | default('')}) -%}
          {%- endfor -%}
          {{ matrix }}
      when: funcao == 'pos-validacao'

    - name: EXCEL | Montar matriz rollback
      ansible.builtin.set_fact:
        excel_matrix: >-
          {%- set matrix = [] -%}
          {%- set _ = matrix.append({'cell_row': 1, 'cell_col': 1, 'cell_value': 'RELATORIO ROLLBACK INFOBLOX WINDOWS'}) -%}
          {%- for h in ['IP','SO','DATACENTER','STATUS','DNS ATUAL','MENSAGEM'] -%}
            {%- set _ = matrix.append({'cell_row': 4, 'cell_col': loop.index, 'cell_value': h}) -%}
          {%- endfor -%}
          {%- for item in resultados -%}
            {%- set row = loop.index + 4 -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 1, 'cell_value': item.ip | default('')}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 2, 'cell_value': item.so | default('')}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 3, 'cell_value': item.datacenter | default('')}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 4, 'cell_value': item.status | default('')}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 5, 'cell_value': item.dns_atual | default('')}) -%}
            {%- set _ = matrix.append({'cell_row': row, 'cell_col': 6, 'cell_value': item.mensagem | default('')}) -%}
          {%- endfor -%}
          {{ matrix }}
      when: funcao == 'rollback'

    - name: EXCEL | Criar planilha
      ans2dev.general.open_xl:
