---
- name: Ansible
  hosts: localhost
  gather_facts: false

  vars_files:
  - vars/test_vars.yml
  - vars/db_map.yml

  vars:
    script_path: "script/script.sql"

  tasks:

  - name: Include JIRA role
    ansible.builtin.include_role:
      name: dml.oracle_dml.jira
    when: platform == 'JIRA'

  - name: Include ITP role
    ansible.builtin.include_role:
      name: dml.oracle_dml.itp
    when: platform == 'ITP'

  - name: Include OS/OC role
    ansible.builtin.include_role:
      name: dml.oracle_dml.os_oc
    when: platform == 'OS/OC'

  # O "always" roda com sucesso ou falha da role, sem alterar o resultado do job.
  # O email só é enviado nos Job Templates com enviar_saida_email: true.
  - name: Executar Oracle e enviar saída por email
    when: ( executar_oracle_jira | default(false) or executar_oracle_osoc | default(false) or executar_oracle_itp | default(false))
    block:
      - name: Include Oracle role
        ansible.builtin.include_role:
          name: oracle_dml

    always:
      - name: Enviar saída por email
        community.general.mail:
          host: vip_smtp.claro.com.br
          port: 25
          from: coeeaiops@claro.com.br
          to: "{{ email }}"
          subject: "Saída DML Oracle - Chamado {{ chamado | default('-') }} - {{ now().strftime('%d/%m/%Y %H:%M') }}"
          subtype: plain
          charset: utf-8
          body: |-
            Chamado ......: {{ chamado | default('-') }}
            Plataforma ...: {{ platform | default('-') }}
            Credencial ...: {{ oracle_credencial | default('-') }}
            Sucessos .....: {{ total_sucesso | default('-') }}
            Falhas .......: {{ ((total_falha_oracle | default(0) | int) + (indices_invalidos | default([]) | length)) }}

            {% for r in result.results %}
            {% if r is not skipped and r is not failed %}
            {% if modo_massivo | default(false) | bool %}
            ----- linha {{ csv_numeros_linhas[loop.index] | default('-') }} -----
            {% endif %}
            {{ r.output | default('') | trim }}

            {% endif %}
            {% endfor %}
        when:
          - enviar_saida_email | default(false) | bool
          - result is defined
          - email | default('') | length > 0
        # Falha no envio não pode marcar o job como falho: o DML já foi executado
        # e quem reexecutar por engano pode duplicar a alteração.
        ignore_errors: true
