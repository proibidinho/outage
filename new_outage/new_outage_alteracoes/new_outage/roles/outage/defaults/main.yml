---
# ============================================================
# Defaults da role outage (precedência MAIS BAIXA do Ansible).
#
# Qualquer valor definido em group_vars (inclusive no vault),
# no playbook, na Survey do AAP ou em extra vars SOBRESCREVE
# o que está aqui. Estes valores só entram em ação quando a
# variável não existe em nenhum outro lugar.
# ============================================================

# Modo de teste do Zabbix: true = não cria a maintenance, só valida.
# Por segurança, na falta de definição acompanha o modo do Dynatrace
# (que por sua vez assume "validar" se também não estiver definido).
# Para criar maintenance de verdade: zabbix_validate_only: false.
zabbix_validate_only: "{{ dynatrace_validate_only | default(true) | bool }}"

# O módulo zabbix_maintenance, por padrão, procura os hosts pelo NOME
# VISÍVEL (visible_name=true). Aqui os hosts vêm do campo técnico "host"
# (zabbix_host_info), então o correto é false. Se o vault já define
# zabbix_usar_visible_name, o valor do vault prevalece.
zabbix_usar_visible_name: false

# zabbix_collect_data NÃO tem default aqui de propósito: quando não
# definida, a task usa "| default(omit)" e vale o padrão do módulo
# (true = continua coletando dados durante a manutenção).
