---
# Recebe a variável "gmud" (loop_var definido em main.yml).
# Só é incluída quando zabbix_habilitado for true (ver main.yml).

- name: Converter janela da GMUD para o formato do Zabbix
  ansible.builtin.set_fact:
    zbx_inicio: >-
      {{ (gmud.inicio | to_datetime('%Y-%m-%dT%H:%M:%S.%f%z')).strftime('%Y-%m-%d %H:%M') }}
    zbx_fim: >-
      {{ (gmud.fim | to_datetime('%Y-%m-%dT%H:%M:%S.%f%z')).strftime('%Y-%m-%d %H:%M') }}
    zbx_minutos: >-
      {{ ((
            (gmud.fim   | to_datetime('%Y-%m-%dT%H:%M:%S.%f%z'))
          - (gmud.inicio | to_datetime('%Y-%m-%dT%H:%M:%S.%f%z'))
         ).total_seconds() / 60) | round | int }}

- name: Validar duração da janela
  ansible.builtin.assert:
    that:
      - zbx_minutos | int > 0
    fail_msg: >-
      GMUD {{ gmud.chave }}: janela inválida
      ({{ gmud.inicio }} -> {{ gmud.fim }}).

- name: Localizar ativos no Zabbix (UPPER)
  community.zabbix.zabbix_host_info:
    host_name: "{{ item | upper }}"
    exact_match: true
  loop: "{{ gmud.ativos }}"
  delegate_to: "{{ zabbix_inventory_host }}"
  register: zbx_busca_upper
  failed_when: false

- name: Localizar ativos no Zabbix (LOWER)
  community.zabbix.zabbix_host_info:
    host_name: "{{ item | lower }}"
    exact_match: true
  loop: "{{ gmud.ativos }}"
  delegate_to: "{{ zabbix_inventory_host }}"
  register: zbx_busca_lower
  failed_when: false

- name: Montar lista de hosts encontrados
  ansible.builtin.set_fact:
    zbx_hosts: >-
      {{
        (
          (
            zbx_busca_upper.results
            +
            zbx_busca_lower.results
          )
          | selectattr('hosts', 'defined')
          | map(attribute='hosts')
          | flatten
          | map(attribute='host')
          | unique
          | list
        )
      }}

# Ativos da GMUD que NÃO foram achados no Zabbix (sem diferenciar
# maiúsculas/minúsculas). Só informativo: alimenta o log e o relatório.
- name: Identificar ativos não encontrados no Zabbix
  ansible.builtin.set_fact:
    zbx_faltando: >-
      {%- set achados = zbx_hosts | map('lower') | list -%}
      {%- set r = namespace(lista=[]) -%}
      {%- for a in gmud.ativos -%}
      {%- if (a | lower) not in achados -%}
      {%- set r.lista = r.lista + [a] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ r.lista }}

- name: Definir se a GMUD é válida para o Zabbix
  ansible.builtin.set_fact:
    gmud_valida_zabbix: "{{ zbx_hosts | length == gmud.ativos | length }}"

- name: Informar GMUD ignorada por ativo não encontrado no Zabbix
  ansible.builtin.debug:
    msg: >-
      GMUD {{ gmud.chave }} ignorada no Zabbix: esperados
      {{ gmud.ativos | length }} ativos, encontrados {{ zbx_hosts | length }}
      ({{ zbx_hosts | join(', ') }}). Não encontrados:
      {{ zbx_faltando | join(', ') }}. Nenhuma maintenance será criada.
  when: not gmud_valida_zabbix

- name: Mostrar o que será colocado em manutenção no Zabbix
  ansible.builtin.debug:
    msg:
      gmud: "{{ gmud.chave }}"
      nome_maintenance: "GMUD {{ gmud.chave }}"
      inicio: "{{ zbx_inicio }}"
      fim: "{{ zbx_fim }}"
      duracao_minutos: "{{ zbx_minutos }}"
      hosts: "{{ zbx_hosts }}"
  when: gmud_valida_zabbix

- name: Criar maintenance no Zabbix
  community.zabbix.zabbix_maintenance:
    state: present
    name: "GMUD {{ gmud.chave }}"
    desc: >-
      Outage automático para a GMUD {{ gmud.chave }} - {{ gmud.resumo }}
    host_names: "{{ zbx_hosts }}"
    visible_name: "{{ zabbix_usar_visible_name }}"
    collect_data: "{{ zabbix_collect_data | default(omit) }}"
    active_since: "{{ zbx_inicio }}"
    active_till: "{{ zbx_fim }}"
    minutes: "{{ zbx_minutos }}"
  delegate_to: "{{ zabbix_inventory_host }}"
  environment: "{{ proxy_env }}"
  register: zbx_maintenance
  when:
    - gmud_valida_zabbix
    - not (zabbix_validate_only | bool)

- name: Informar resultado do Zabbix
  ansible.builtin.debug:
    msg:
      gmud: "{{ gmud.chave }}"
      resultado: >-
        {{
          'VALIDAÇÃO OK - nenhuma maintenance foi criada'
          if zabbix_validate_only | bool
          else 'Maintenance criada/atualizada no Zabbix'
        }}
  when: gmud_valida_zabbix

# Guarda o desfecho desta GMUD no Zabbix para o relatório por e-mail.
# Só registra: não chama API nem altera nada.
#   IGNORADA       algum ativo não existe no Zabbix (nada criado)
#   VALIDADO       modo de teste (nada criado)
#   APLICADA       maintenance criada ou atualizada
#   SEM_ALTERACAO  maintenance já existia idêntica
- name: Registrar resultado do Zabbix para o relatório
  ansible.builtin.set_fact:
    outage_zabbix_resultado: >-
      {{
        (outage_zabbix_resultado | default([]))
        +
        [{
          'chave': gmud.chave,
          'status': status_zbx,
          'hosts': zbx_hosts,
          'faltando': zbx_faltando,
          'esperados': gmud.ativos | length,
          'minutos': zbx_minutos | int
        }]
      }}
  vars:
    status_zbx: >-
      {{ 'IGNORADA' if not (gmud_valida_zabbix | bool)
         else 'VALIDADO' if zabbix_validate_only | bool
         else 'APLICADA' if (zbx_maintenance.changed | default(false))
         else 'SEM_ALTERACAO' }}
