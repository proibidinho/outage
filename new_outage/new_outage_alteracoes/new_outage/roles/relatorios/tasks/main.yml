---
- name: Montar dados da planilha
  ansible.builtin.set_fact:
    outage_planilha: []

- name: Adicionar ativos das GMUDs
  ansible.builtin.set_fact:
    outage_planilha: >-
      {{
        outage_planilha +
        [{
          'gml': item.0.chave,
          'ativo': item.1,
          'tipo': 'HOST',
          'inicio': item.0.inicio,
          'fim': item.0.fim
        }]
      }}
  loop: "{{ gmuds_atualizadas | subelements('ativos') }}"

- name: Adicionar SERVICES Dynatrace na planilha
  ansible.builtin.set_fact:
    outage_planilha: >-
      {{
        outage_planilha +
        [{
          'gml': item.0.gml,
          'ativo': item.1,
          'tipo': 'SERVICE',
          'inicio': item.0.inicio,
          'fim': item.0.fim
        }]
      }}
  loop: "{{ dynatrace_relatorio | default([]) | subelements('entidades') }}"
  when:
    - item.1 is match('^SERVICE-')

- name: Montar matriz Excel
  ansible.builtin.set_fact:
    excel_matrix: >-
      {%- set matrix = [] -%}

        {%- set _ = matrix.append({'cell_row': 1, 'cell_col': 1, 'cell_value': 'GML'}) -%}
        {%- set _ = matrix.append({'cell_row': 1, 'cell_col': 2, 'cell_value': 'ATIVO'}) -%}
        {%- set _ = matrix.append({'cell_row': 1, 'cell_col': 3, 'cell_value': 'TIPO'}) -%}
        {%- set _ = matrix.append({'cell_row': 1, 'cell_col': 4, 'cell_value': 'INICIO'}) -%}
        {%- set _ = matrix.append({'cell_row': 1, 'cell_col': 5, 'cell_value': 'FIM'}) -%}

      {%- for item in outage_planilha | default([]) -%}
        {%- set row = loop.index + 1 -%}

        {%- set _ = matrix.append({'cell_row': row, 'cell_col': 1, 'cell_value': item.gml}) -%}
        {%- set _ = matrix.append({'cell_row': row, 'cell_col': 2, 'cell_value': item.ativo}) -%}
        {%- set _ = matrix.append({'cell_row': row, 'cell_col': 3, 'cell_value': item.tipo}) -%}
        {%- set _ = matrix.append({'cell_row': row, 'cell_col': 4, 'cell_value': item.inicio}) -%}
        {%- set _ = matrix.append({'cell_row': row, 'cell_col': 5, 'cell_value': item.fim}) -%}
      {%- endfor -%}

      {{ matrix }}


- name: Definir caminho da planilha
  ansible.builtin.set_fact:
    relatorio_excel: "/tmp/outages_gml.xlsx"

- name: Criar planilha
  ans2dev.general.open_xl:
    op: n
    dest: "{{ relatorio_excel }}"
    sheet_name: "Outages"
    updates_matrix: "{{ excel_matrix }}"

- name: RELATORIO | Resumo da planilha
  ansible.builtin.debug:
    msg:
      registros: "{{ outage_planilha | default([]) | length }}"
      arquivo: "{{ relatorio_excel }}"

# =========================================================================
# RELATÓRIO HTML (corpo do e-mail)
#
# Junta, por GMUD, o que as roles anteriores registraram:
#   gmuds_atualizadas           -> janela, sistemas e servidores (CMDB)
#   outage_dynatrace_resultado  -> desfecho no Dynatrace (role outage)
#   outage_zabbix_resultado     -> desfecho no Zabbix (role outage)
# e entrega uma lista única, outage_relatorio, que o template
# corpo_email.html.j2 apenas desenha. A role não conhece Jira nem APIs.
# =========================================================================

- name: Definir modos de execução para o relatório
  ansible.builtin.set_fact:
    relatorio_modo_dynatrace: >-
      {{ 'VALIDAÇÃO' if (dynatrace_validate_only | default(true) | bool)
         else 'APLICAÇÃO REAL' }}
    relatorio_modo_zabbix: >-
      {{ 'DESABILITADO' if not (zabbix_habilitado | default(false) | bool)
         else 'VALIDAÇÃO' if (zabbix_validate_only | default(dynatrace_validate_only | default(true)) | bool)
         else 'APLICAÇÃO REAL' }}

- name: Inicializar dados do relatório HTML
  ansible.builtin.set_fact:
    outage_relatorio: []

# inicio/fim chegam como 2026-09-18T18:08:00.000-0300. Para exibir,
# fatiamos o texto (sem parse de data, que poderia falhar). A duração só é
# calculada quando o formato é o esperado; do contrário fica vazia.
- name: Montar dados do relatório HTML (uma entrada por GMUD)
  ansible.builtin.set_fact:
    outage_relatorio: >-
      {{
        outage_relatorio +
        [{
          'chave': item.chave,
          'resumo': item.resumo | default(''),
          'inicio': inicio_fmt,
          'fim': fim_fmt,
          'duracao_min': duracao_min,
          'sistemas': item.nome_cmdb | default([]),
          'servidores': item.ativos | default([]),
          'dynatrace': dyn,
          'zabbix': zbx
        }]
      }}
  vars:
    inicio_txt: "{{ item.inicio | default('') | string }}"
    fim_txt: "{{ item.fim | default('') | string }}"
    inicio_fmt: >-
      {{ (inicio_txt[8:10] ~ '/' ~ inicio_txt[5:7] ~ '/' ~ inicio_txt[0:4] ~ ' ' ~ inicio_txt[11:16])
         if inicio_txt | length >= 16 else inicio_txt }}
    fim_fmt: >-
      {{ (fim_txt[8:10] ~ '/' ~ fim_txt[5:7] ~ '/' ~ fim_txt[0:4] ~ ' ' ~ fim_txt[11:16])
         if fim_txt | length >= 16 else fim_txt }}
    formato_ok: >-
      {{ inicio_txt is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}[+-][0-9]{4}$')
         and fim_txt is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}[+-][0-9]{4}$') }}
    duracao_min: >-
      {{ (((fim_txt | to_datetime('%Y-%m-%dT%H:%M:%S.%f%z'))
           - (inicio_txt | to_datetime('%Y-%m-%dT%H:%M:%S.%f%z'))).total_seconds() / 60) | round | int
         if formato_ok | bool else '' }}
    dyn: >-
      {{ outage_dynatrace_resultado | default([])
         | selectattr('chave', 'equalto', item.chave) | list
         | first | default({'status': 'SEM_DADOS'}) }}
    zbx: >-
      {{ outage_zabbix_resultado | default([])
         | selectattr('chave', 'equalto', item.chave) | list
         | first | default({'status': ('DESABILITADO' if relatorio_modo_zabbix == 'DESABILITADO' else 'SEM_DADOS')}) }}
  loop: "{{ gmuds_atualizadas | default([]) }}"
  loop_control:
    label: "{{ item.chave }}"

# Mesmas informações no output do job, para quem acompanha pelo AAP.
- name: RELATORIO | Resultado por GMUD
  ansible.builtin.debug:
    msg:
      gmud: "{{ item.chave }}"
      dynatrace: "{{ item.dynatrace.status | default('SEM_DADOS') }}"
      zabbix: "{{ item.zabbix.status | default('SEM_DADOS') }}"
      servidores: "{{ item.servidores | length }}"
  loop: "{{ outage_relatorio }}"
  loop_control:
    label: "{{ item.chave }}"

# -------------------------------------------------------------------------
# EMAIL | Enviar relatório de Outages
# Corpo HTML + planilha Excel em anexo (a planilha continua igual).
# -------------------------------------------------------------------------
- name: EMAIL | Enviar relatório de Outages
  community.general.mail:
    host: "{{ relatorio_smtp_host }}"
    port: "{{ relatorio_smtp_porta }}"
    from: "{{ relatorio_remetente }}"
    to: "{{ relatorio_destinatarios }}"
    subject: >-
      {{ relatorio_assunto_prefixo }} -
      {{ ansible_date_time.date }}{{ ' (VALIDAÇÃO)' if relatorio_modo_dynatrace == 'VALIDAÇÃO' else '' }}
    subtype: html
    attach:
      - "{{ relatorio_excel }}"
    body: "{{ lookup('template', 'corpo_email.html.j2') }}"
  when: (relatorio_enviar_sem_gmud | bool) or (outage_relatorio | length > 0)
