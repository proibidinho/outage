---
# Esta role recebe "gmuds" da role descoberta.
# Para cada GMUD:
#   1. Busca os servidores no CMDB.
#   2. Localiza os ativos no Dynatrace.
#   3. Garante que todos foram encontrados.
#   4. Cria/valida a Maintenance Window.

- name: Verificar se há GMUDs para processar
  ansible.builtin.debug:
    msg: "Nenhuma GMUD de Observabilidade encontrada."
  when: gmuds | default([]) | length == 0

- name: Inicializar GMUDs atualizadas
  ansible.builtin.set_fact:
    gmuds_atualizadas: []

- name: Achar servidores no CMDB
  ansible.builtin.include_tasks: busca_ativos_no_cmdb.yml
  loop: "{{ gmuds | default([]) }}"
  loop_control:
    loop_var: gmud
    label: "{{ gmud.chave }}"

# O Dynatrace roda sempre, independente do Zabbix estar habilitado
# ou não. Uma GMUD pode existir só no Dynatrace, só no Zabbix, ou
# nos dois — cada bloco decide por conta própria (gmud_valida /
# gmud_valida_zabbix), sem depender do resultado do outro.

- name: Processar GMUDs no Dynatrace
  ansible.builtin.include_tasks: criar_outage.yml
  loop: "{{ gmuds_atualizadas | default([]) }}"
  loop_control:
    loop_var: gmud
    label: "{{ gmud.chave }}"

- name: Processar GMUDs no Zabbix
  ansible.builtin.include_tasks: criar_outage_zabbix.yml
  loop: "{{ gmuds_atualizadas | default([]) }}"
  loop_control:
    loop_var: gmud
    label: "{{ gmud.chave }}"
  when: zabbix_habilitado